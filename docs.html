<!--
  MOBILE DOC READER — why this page exists.

  Chris reads this project from a phone, and the documents are the project:
  ml/EXPERIMENTS.md is 2,400 lines with nine-column result tables, CLAUDE.md
  is 1,100 lines with 300-character prose cells, LEADERBOARD.md has eleven
  columns. GitHub's mobile view renders all of that as a single pinched
  column with tables you must pan sideways blind — you scroll right to read
  a number and lose which row it belongs to.

  The fix deliberately does NOT touch the documents. They are the scientific
  record; rewriting tables to fit a phone would cost information that the
  desktop and the repo readers need, and it would have to be redone every
  time an experiment adds a row. Instead the RENDERER adapts:

    · wide numeric tables scroll horizontally inside their own box, with the
      first column PINNED — the row label stays on screen while the numbers
      move under it, which is the whole trick;
    · narrow tables whose cells are prose (the "file | governs" tables) stop
      being tables below 640px and become labelled blocks, because a
      two-column table of paragraphs is a worse phone layout than a list;
    · every document gets a table of contents drawer built from its own
      headings, because 2,400 lines with no navigation is unreadable however
      pretty the type is;
    · code blocks (the ASCII stencil drawings) scroll inside themselves and
      never widen the page.

  Content is fetched RAW FROM main at read time, not from the deployed copy:
  EXPERIMENTS.md changes several times an hour while a queue is draining,
  and a reader that shows yesterday's file would be worse than no reader.
  On localhost it reads the working copy instead, so the test suite needs no
  network (tests/docs.spec.js).
-->

  /* A deep link (?f=…#e-022, ?f=ml/RUNS.md#run-413) scrolls its target to

     link for is the one row you cannot see. Measured on a 390px phone

  main [id], main :target { scroll-margin-top: calc(var(--head-h) + 8px); }

  header {

  pre {

  /* ---- TABLES, the actual problem ----------------------------------- */
  /* WIDE tables: scroll box + pinned first column. Scrolling right without
     a pinned label is what makes a 9-column result table useless on a
     phone — you can see 0.5883 but not which stencil it belongs to. */
  .tbox { position: relative; margin: 1em 0; }
  .tscroll {
    overflow-x: auto; -webkit-overflow-scrolling: touch;

  }

  main table {
    border-collapse: separate; border-spacing: 0;
    width: 100%; font-size: 14px;
  }
  main th, main td {
    padding: 8px 10px; text-align: left; vertical-align: top;
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  main thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--panel-2); font-size: 13px; color: var(--dim);
  }
  main tbody tr:last-child td { border-bottom: 0; }
  .pin th:first-child, .pin td:first-child {
    position: sticky; left: 0; z-index: 1;
    background: var(--bg);
    box-shadow: 1px 0 0 var(--line);
    white-space: normal; min-width: 8.5em; max-width: 13em;
  }
  .pin thead th:first-child { z-index: 3; background: var(--panel-2); }
  /* Some tables lead with a RANK, not a name — "rank | stencil | pts | …".
     Pinning "1" tells you nothing, so the identity column travels with it
     and the rank column shrinks to what a number needs. */
  .pin2 th:first-child, .pin2 td:first-child {
    min-width: 2.6em; max-width: none; white-space: nowrap;

  .tbox.over::after {

    width: 34px; pointer-events: none; border-radius: 0 var(--radius) var(--radius) 0;
    background: linear-gradient(90deg, rgba(13,17,23,0), rgba(13,17,23,.92));

  .tbox.over.ended::after { opacity: 0; }
  .thint {
    display: none; font-size: 12px; color: var(--dim); margin: 4px 2px 0;

  .tbox.over .thint { display: block; }

  @media (max-width: 640px) {

      ["ml/plans/E080_hourglass_cone.md", "E-080 (15 Sep): THE CUT-OFF MIRRORED DOUBLE CONE — the stage-1 codec as an hourglass. Chris's four points as a specification and a pre-registered experiment: (1) the input cone loses its tip and the present becomes a WAIST of several cells, because thermal wind and geostrophy are gradients and a gradient does not exist inside one cell; (2) a PREDICTION CONE, the past cone point-mirrored through the anchor into the future (+1…+6 pentads), sampled the same way and used only as targets, never read; (3) a random SAMPLING REGIME of four tasks per example — forecast from waist + past, forecast from the waist alone (the snapshot twin inside one model), nowcast the hidden present from the past under five dropout patterns, and fill-in — with E-069b's rules (knowable targets only, no copy targets, every family against its own predict-the-mean bar); (4) a LEARNABLE CONE PER REGION: a fixed sunflower warped by eight numbers per 1° cell (coarse 10° map plus a 1° residual under a smoothness prior) and channel group — drift per pentad toward the source, and the waist and velocity-spread ellipses stored as matrix logarithms so nothing is in kilometres — plus one scale per channel, read through a per-channel soft aperture over the group's shared tokens so the loss reaches the geometry from every dot at once; learned gate-first over fixed candidate dots, then hardened into re-baked dot tables so the data loader's reads never depend on the live weights, bounded by cone v2's design speed, mirror-tied, with stop-gradient on target positions and a frozen evaluation geometry so a cone cannot learn to ask easy questions. Pre-registered: at the RAPID line (the mooring array at 26.5° N that has measured the Atlantic overturning since 2004) the surface cone should point south-west (up the Florida Current) and the model's attention on deep Argo profiles should sit north of it (up the Deep Western Boundary Current). Three arms × three seeds, verdict ru le written before any run. Deck as PDF, PDF with speaker notes, and PowerPoint beside it. DESIGN ONLY — nothing implemented or measured"],
      ["ml/plans/E082_HANDOVER.md", "E-082 handover (19 Sep): where the build of the three fine-granularity families stands — nineteen stores on the Hub (3.1+ billion rows), eight stores parked as parts waiting for assembly (with the exact commands), the stopped box, the stores not built and the measured reason for each, the credentials in place and what waits on Chris (GRDC form, Bremen email, four size decisions), the new BIOSPHERE requirement with a proposed wave 6 (LiDAR pulled to phase A, canopy-height and biomass maps, solar-induced fluorescence, LAI/phenology, GBIF occurrences, radar biomass, PACE), and the operating recipe (dispatch, watch, verify, push). Written when the Opus quota ran out mid-wave"],
      ["ml/plans/E082_family1_builds.md", "E-082 (17 Sep): BUILDING FAMILIES 1.gf, 1.0.tf AND 0.9.tf — the phase-A build plan for the three fine-granularity families designed the day before (global ocean/atmosphere observations at ≤ 10 km and ≤ 5 days; land and coast at the same scale; land through Google's AlphaEarth embedding). Nothing new is invented for the point stores: they are ADAPTERS against the family-10 builder, whose stages are parametrised (Hub prefix, parts prefix, cache, public vs private repository, int32 vs int64 seconds) with defaults that leave family 10 byte-identical. Three things ARE new: the sharded tier-G layout for grids finer than 0.25°, a PROBE stage that runs one calendar month through the real adapter on a hosted runner and writes rows-per-day, platforms, bytes and seconds so no full build is dispatched on an estimate, and the two-track publish (a store whose licence forbids redistribution goes to `chfrank/earth-tensors-private`, read by one job through a scoped token, and the public registry still lists it). Five waves: the keyless point stores first (GHCN-Daily, IGRA, GESLA tide gauges, NDBC buoys, gliders; ICOADS ship reports, the World Ocean Database, GLODAP, BGC-Argo, OceanSITES), then the sharded grids (Bremen sea ice, Hansen loss year, ocean colour, SST), the anonymous scene catalogues, the credentialed NASA stores as the secrets land, and the embedding pooling last. The credentials table says which secret unblocks which store. First measurement already in: the real GHCN-Daily January 2024 through the adapter — 1,020,479 station-days from 38,014 stations in 5 seconds, 17.5 bytes fetched per row"],
      ["ml/plans/E081_family10_2_fishing.md", "E-081 (16 Sep): FAMILY 10.2 — THE FISHING FLEET AS AN OBSERVATION STORE, and two globe layers. One new store, `fishing`: Global Fishing Watch's AIS-based apparent fishing effort v3.0 (Zenodo 14982712, CC BY-NC 4.0, no account needed) — one row per day × 0.1° cell × vessel, 2012–2024, carrying the hours that vessel was broadcasting in the cell and the part of them a neural network classed as fishing, with the vessel's gear class beside them. The fleet is a distributed sensor: ~10,000 vessels in 2012 and ~95,000 in 2024 go where the fish are, and the fish go where the fronts, the upwelling and the productivity are — so the same table is both a thing to predict and a weak extra input. The four stores of family 10.1 (drifters, tropical moorings, ship CO₂, altimeter tracks) are INHERITED BY REFERENCE and not one byte is rebuilt; the registry gains a `path` per group and an `inherits` block saying so. For the globe the store is also summed onto the 0.25° grid, one frame per month, month-major so one month is a single range read (8.3 MB — the plan budgeted float16 and the real archive does not fit it: the busiest 0.25° cell-month of 2024 is 595,726 vessel-hours against float16's 65,504 ceiling), indexed by `data/fishing_index.json` exactly as family 7 is — plus a second layer of loitering vessels (the signature of transshipment at sea) baked daily by a workflow, because that one needs a token and the browser never holds one. Build contract, QC policy, the grid's geometry and the falsifier in §2–§5. BUILT, PUBLISHED AND VERIFIED 2026-09-16 — the RESULT in §6: 617,164,038 rows on the Hub, every year reconciled one-for-one against its own source zip, 695,155,362 apparent fishing hours out of 1,985,162,794 broadcast, a registry of ten groups and 2,741,955,408 tier-P observations with the four family-10.1 entries byte-identical sha256 for sha256, built in 84 minutes on one rented box for ≈ $0.70, and all five falsifier clauses holding — the two numbers the plan projected (596 million rows, ≈ 0.8 billion fishing hours) were both corrected by the measurement"],
      ["ml/plans/E077_family7_ocean_colour.md", "E-077 (11 Sep): FAMILY 7.1 (recipes f7l1, then f7l2) — OCEAN COLOUR JOINS THE GLOBAL TENSOR as a fourth channel group. ESA OC-CCI v6.0 merged chlorophyll-a (SeaWiFS/MERIS/MODIS/VIIRS/OLCI, 4 km, Sep 1997 → 2024) box-averaged 6×6 in LOG space onto the same 0.25° point grid and the same five-day bins: `log_chl` plus `chl_cov`, the clear-sky coverage the average rests on, so a reader can tell one glimpse through a storm from thirty-six clear pixels on five days. Its time axis is OFFSET at the record's own first day (bin 1145) rather than padded with 4.7 GB of NaN. The three existing groups are NOT rebuilt — they are hard-linked from the f7l0 build and the publish refuses unless they hash identically to it. §10 (14 Sep) is the CORRECTED build, recipe f7l2: what f7l1 got wrong (`elev` published as 1,038,240 NaN after the throughput guard aborted the 933 MB ETOPO download and the stage marked itself done anyway; g100's two log channels evaluated by a float32 `log1p` that does not reproduce across boxes), what f7l2 rebuilds and what it inherits \u2014 and \u00a710.4 is the landing check against the published bytes, five items, four as predicted and one (norm_g100 moving) wrong for a reason worth reading"],
      ["ml/plans/E071_cone_v2.md", "E-071 (4 Sep): CONE v2 — Chris's four decisions turned into a spec: global sampler (longitude wraps, dots placed on the sphere, no rectangle), day-of-year harmonic climatology (K=3, evaluated at the pentad mid-day), Argo as 26 profile tokens at the live lags instead of 192 column tokens, and every family's reach from the fastest measured mechanism × 1.5 (ocean 3.6 → 5.4 m/s; wind global at once) with log-radial dot placement; token budget 748 → 1,600; §6 land, ice and air — the shared-channel principle, Antarctica to −90°, per-location tokens, Phase L0 (six ERA5/ice/soil channels, 1982→)"],
      ["ml/plans/E073_parallel_import.md", "E-073 (4 Sep): PARALLEL IMPORT OF THE TRAINING DATA — one Apache Beam (Flume) pipeline that imports every upstream source (OISST, NCEP R1, Roemmich-Gilson Argo, GLORYS12, the labels, the statics; then DUACS altimetry, EN4, ENSO series; ERA5 once the CDS account exists) into a SHARDED tf.train.Example dataset written wherever the operator points it. Polite by construction (per-host lane caps = max simultaneous connections, backoff ladder, circuit breaker) and lossless by design (states are written/present/queued/absent — a throttle changes WHEN an item is fetched, never WHETHER; absent needs a 404 twice). Two stages: per-source-day Examples, then a pentad assemble into the family-7 channel groups. Code and the operator howto under ml/import_beam/"],
      ["ml/plans/E076_family8_nearest_observations.md", "E-076 (7 Sep): FAMILY 8 \u2014 the measurement is never missing, only far away. For every sparse channel the cone carries the k nearest observations with their distance (value, \u0394x, \u0394y, \u0394t, local density) instead of a grid cell that is empty 92 % of the time; one-sided in time, bounded, k from the correlation length (Argo: k = 5 within 30 days). A hybrid that keeps the sunflower for dense channels and is no longer a single tensor \u2014 dense groups plus an observation store and a neighbour index \u2014 and the one $1 ablation that decides whether it is built. \u00a72.6 (7 Sep): GRANULARITY \u2014 a token carries the footprint of a measurement (its spatial and temporal support, in log units) beside its distance, because a 1\u00b0 value copied into nine 0.25\u00b0 cells is one measurement, not nine"],
      ["ml/plans/E075_forecaster_output_distribution.md", "E-075 (5 Sep): WHAT SHAPE SHOULD THE FORECASTER'S OUTPUT BE? \u2014 continuous flow matching, discrete autoregression, or the synthesis: a probability per value-bin for every cell in ONE network pass, with spatial coherence carried by a single 32-number random draw shared across the planet. Written to be handed to someone with no context: every term expanded, a glossary, what AlphaEarth Foundations chose and what transfers, and a two-measurement decision procedure that costs one box-day and nothing"],
      ["ml/plans/E074_hierarchical_channel_quantization.md", "E-074 (5 Sep): HIERARCHICAL CHANNEL QUANTIZATION \u2014 give every input channel its own warp fitted to its own distribution, then read the digits of the warped value: a coarse digit the forecaster rolls and fine digits that restore precision. Why the warp exponent (quantile / mean-squared-error-optimal / uniform) only has to be chosen once, why the tails are the one exception, why maximum entropy is not maximum predictability for a forecaster, and four experiments \u2014 the first of which needs no GPU"],
      ["ml/plans/E076b_results.md", "E-076b (8 Sep): THE OPTIMAL-INTERPOLATION CEILING FOR THE ARGO OCEAN INTERIOR — RESULTS. No model, no GPU: given only the k nearest real Argo float profiles within 1,000 km and 30 days, how much better than the seasonal average can ANY method guess a float's own temperature and salinity profile? Optimal interpolation — a Gaussian-process estimate whose correlation length, decorrelation time and noise are fitted on training years alone — takes 21 % off the temperature error at k = 5 and 31 % at k = 20 on the terminal held-out years (34 % on salinity), against the 2.5–3.0 % and 0.1 % the trained cone codec of E-076a managed on the same target. The information was there and the model did not use it. With per-level tables for k = 5 / 10 / 20 and a widened search, the fitted hyper-parameters, the persistence and inverse-distance bars, and the sensitivity pass that removes every target with a companion profile inside 50 km"],
      ["ml/plans/E074a_results.md", "E-074a (7 Sep): THE LADDER BAKE-OFF \u2014 RESULTS. Measured, no model: every family-7 channel gets bins fitted to its own distribution, and the four spacings (equal-probability quantiles, the mean-squared-error-optimal 1/3, 1/2, and plain uniform) are scored on held-out years for held-out surprise in nats on one common fine partition, for how predictable the coarse digit is one pentad later, for reconstruction error in the channel's own unit overall and in the strong-current tail and on the RAPID 26.5\u00b0 N section, for the quantization floor and for calibration \u2014 with the plan's four pre-registered falsifiers evaluated in code"],
      ["ml/plans/E072_earth_foundation_model.md", "E-072 (4 Sep): THE EARTH FOUNDATION MODEL — data design first, then the scaling ladder, then the recipe. The ladder of data in observed values (2.5 B \u2192 20 B \u2192 91 B \u2192 455 B \u2192 350,000 B) with the Chinchilla ceiling at values/20 and the independence correction; rungs L0\u2013L5 with compute (a 1 B model on the global pentad tensor is ~30 RTX-4090-hours; the kilometre rung is the first compute-bound one); the recipe (Perceiver over location tokens, queryable Gaussian decoder, sphere-routed MoE at L3, masked reconstruction + forecast NLL, AdamW, warm-up 2k, cosine, \u03BCP LR transfer, early stopping, \u2264 4 epochs, z-noise 0.7); the null ladder; and the read-outs (El Ni\u00F1o, AMOC, colour, sea ice, land water, atmosphere) with each one's data prerequisite"],
      ["ml/plans/E069_HANDOVER.md", "HANDOVER (2 Sep): E-069 end to end for whoever picks it up — every file and API, the ten-minute local check, the r3 tensor build/pin/publish, workflow wiring, dispatch and H1, the stage-2 arms, and the JAX/TPU port recipe with parity gates C1–C9 and the launcher"],

      ["ml/figures/geofm_survey/CONE_DATA_AND_ENSO.md", "COMPANION (3 Sep): every dataset that feeds the E-069 cone codec today with its file:line refs and derivation graph, the ranked ocean-and-biosphere additions, the El Niño 2026 catalog audit with Niño indices computed from the repo's own OISST bake, and — added 3 Sep — the four boundaries the sampler meets (window edge, land, holdout shadow, the calendar month it does NOT mask) and the propagation speeds the 0.3 m/s cone cannot represent"],

      ["ml/plans/REBOOT_PLAN.md", "REBOOTING THE RESEARCH PROGRAMME (2026-08-31): a handover for whoever continues it — what is established (the clean head loses to damped persistence at every lead), the frozen protocol and the codec it needs, the order to continue in (nulls and intervals before training, short budgets, five seeds, the evaluation quartet, the decision gate), what to record, and what will look like a result and is not"],
      ["ml/handoffs/HANDOVER_2026-09-03.md", "HANDOVER 2026-09-03: the fleet is idle and four results landed — the width ladder is flat, the LIM is the reference model, the 16-bit token beats its continuous twin on the one-step gate, and the terminal-holdout codec was stopped at step 41k with its checkpoint recoverable; plus the four failure modes fixed at the root and the ranked next actions"],
      ["ml/handoffs/HANDOVER_2026-09-04_cone_v2_efm.md", "HANDOVER 2026-09-04: cone v2, the four spheres, the Earth foundation model, and where to fork \u2014 where the programme stands in one paragraph per result (the reset, the flat width ladder, the LIM as reference, E-069's refuted H1, family 7's Phase A), everything the 3\u20134 Sep session produced (deck slides 44\u201348 and 51, E-071, E-072, the Cones tab's Data mode), and seven forkable areas A\u2013G with the entry document and the first concrete step for each"],
      ["ml/handoffs/REBOOT_HANDOVER_2026-08-31.md", "Reboot handover, 2026-08-31: a second-opinion review of the session handover — the two premises assessed, a codec-contamination question, the LIM/damped-persistence nulls and the statistics machinery to add, the paper quarantine, and the open AMOC-vs-field-skill headline decision"],
      ["ml/plans/E067_block_rolls.md", "E-067/E-068: rolling past a year — why Figure 5 stops at 365 d, held-out BLOCKS (a roll truncates at the block end), the terminal-holdout codec of the reboot plan (train ≤ 2020, test 2021–2024, plus 2008–09 and 2016–17 development blocks) and the 730-day development rolls of head and LIM"],
      ["ml/plans/E065_fsq_ladder.md", "E-065: the lattice ladder — 24-bit (d_z 8, 8×8 levels) and 30-bit (d_z 10, 8×10) FSQ codecs built the E-050 way (continuous parent, then warm-start quantization), each gated as a stage-2 substrate under the clean pool beside the 16-bit one"],
      ["ml/plans/E064_token_substrate_clean.md", "E-064: the 16-bit FSQ token as a forecasting substrate under the clean pool — the 7.6M head on the warm-quantized codec's tokens against its continuous twin (which is also E-060a's torch/JAX parity check), one-step gate, 30-bit lattice named as the follow-up"],
      ["ml/plans/E061_cmip6_pretraining.md", "E-061: the CMIP6 piControl pretraining corpus — 800 model-years against the 43 the reanalysis gives us; the regrid, its validation against GREP, and the confound the follow-up must control for"],

      ["docs/FAMILY10_DATA_HANDOVER.md", "Family 10.2's five observation stores and the registry, as a self-contained data handover: what changed from family 10.0 (the time column is now `time_s`, int32 seconds since 1982, replacing float32 days \u2014 which could not order `slatrack`'s once-a-second sampling, and misfiled 908 `socat` rows across a pentad boundary), the nine arrays plus `store.json` that every tier-P store ships and what each holds, the channels of `gdp` / `gtmba` / `socat` / `slatrack` with units, the quality-control policy per source and what is dropped versus merely NaN, the footprint pair every row carries, why the five-day bin goes NEGATIVE before 1982, numpy code to open a store and to find the k nearest observations one-sided in time, the MEASURED search radii per observing system, how family 8's Argo store joins the family unchanged at schema 1, and \u00a79 \u2014 exactly which sentences are verified: all four 10.1 stores published and verified by 2026-09-16 with the sha256 and byte size of every file, identical row counts and per-year counts to 10.0 except `slatrack`'s 26 recovered rows. Extended the same evening to FAMILY 10.2, which adds a fifth store, `fishing` (Global Fishing Watch's AIS-based apparent fishing effort, 617,164,038 rows of one vessel in one 0.1\u00b0 cell on one day, 2012\u20132024, CC BY-NC 4.0) and inherits the four 10.1 stores BY REFERENCE \u2014 every group carries its own `path`, and the inherited entries are byte-identical to the 10.1 registry sha256 for sha256, so nothing was rebuilt or re-downloaded: the registry at tensors/family10_2/family10.json is complete at ten groups and 2,741,955,408 tier-P observations. The new sections say what `fishing` measures and what it does not (absence of effort is not absence of fishing), warn that its `qc` column is the GEAR CLASS and not a quality grade, carry the vessel table, the ten sha256 values, the per-year counts and the non-commercial licence, and explain why its monthly 0.25\u00b0 grid is for the globe and not for training"],

      ["docs/FAMILY10_VERIFICATION_2026-09-14.md", "The independent verification of family 10's four published tier-P observation stores \u2014 surface drifters, the tropical moored arrays, ship CO\u2082 and 2.03 billion along-track sea-level samples from 29 altimeter missions \u2014 run 2026-09-14 from a clean sandbox: every file re-hashed against its own record, every count, range and per-channel statistic recomputed from the arrays rather than read out of the metadata claiming it, the k-nearest search exercised at named anchors, and the measured k-th-neighbour distances that replaced the handover's guessed search radii \u2014 including the findings that surprised the build: the k tokens come from a single platform, the Gulf Stream anchor never reaches the jet the store demonstrably holds, and (\u00a79, the 67 GB store that had to be verified by streaming) a float32 time column 84 times coarser than the once-a-second sampling it records \u2014 plus \u00a710, added 2026-09-16, which checks the family-10.1 rebuild that replaced that column with integer seconds, the 26 rows it recovered, the 908 rows whose pentad it corrected, and the timestamp collisions that fall to the number of satellites in orbit rather than to one"],
      ["docs/FAMILY8_DATA_HANDOVER.md", "Family 8, the Argo observation store, as a self-contained data handover: the thirteen files and their hashes, the sixteen pressure levels, the quality-control policy, numpy code to open it and to find the k nearest profiles one-sided in time, and how to use it in training \u2014 tokens, standardisation from training years, the two leaks, missingness as a feature, objectives and baselines"],
      ["docs/FAMILY71_INGEST_HANDOVER.md", "Family 7.1 as a DELTA handover for an agent that already holds family 7, pointed at the CORRECTED build f7l2: which of the four group files to fetch, replace or reuse (and why the published inherited groups are not the same bytes as f7l0 \u2014 the 1989 sst/sea_ice hole that family 7.1 fills, the recomputed norm_g025, the 1-ULP g100 difference), a section for readers who already ingested f7l1 (three of four files are hard links and hash identical \u2014 re-fetch the 5.4 MB npz and nothing else), the nine new npz keys including static_n_finite, why g100 was rebuilt in float64 and how far it moved, the offset time axis and reading recipe of the ocean-colour group, the minimal loader change, and the numbers to reproduce after ingest. The all-NaN elev workaround is GONE: f7l2 ships a complete elevation static, bit-identical to f7l0\u2019s"],
      ["docs/FAMILY7_DATA_HANDOVER.md", "Family 7, the global input tensor, as a self-contained data handover: the four files and their hashes, the grid and the five-day time axis, every channel with its unit, source and (mean, sd), what NaN means where, the statics and truth series, and three reading recipes including an HTTP range read"],

  var out = document.getElementById("out"),
      titleEl = document.getElementById("title"),
      ghEl = document.getElementById("gh"),
      tocBtn = document.getElementById("tocBtn"),
      toc = document.getElementById("toc"),
      tocNav = document.getElementById("tocNav"),
      scrim = document.getElementById("scrim");

  function qs(k) {
    var m = new RegExp("[?&]" + k + "=([^&#]*)").exec(location.search);
    return m ? decodeURIComponent(m[1]) : "";
  }

  // Read the LIVE file. On the deployed site that means raw main, not the
  // gh-pages copy: EXPERIMENTS.md is edited several times an hour while a
  // queue drains, and Pages only updates when someone deploys. On localhost
  // (the test suite, `python3 -m http.server`) read the working copy, so
  // the suite needs no network at all.
  var LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  function srcUrl(path) {
    return LOCAL ? path
      : "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/" +
        path + "?cb=" + Date.now();
  }

  function slug(s) {
    return s.toLowerCase().replace(/[`*_~]/g, "")
            .replace(/[^a-z0-9À-ɏ]+/g, "-")
            .replace(/^-+|-+$/g, "").slice(0, 60) || "s";
  }

  function renderIndex() {
    titleEl.innerHTML = "earth · docs";
    ghEl.href = "https://github.com/" + REPO;
    tocBtn.hidden = true;
    var h = ['<h1>Documentation</h1>',
             '<p class="note">Built for reading on a phone: wide result ',
             'tables keep their row labels pinned while the numbers scroll, ',
             'long documents get a contents drawer, and every file is read ',
             'live from <code>main</code>.</p>'];
    DOCS.forEach(function (grp) {
      h.push('<div class="grp">' + grp[0] + '</div><div class="idx">');
      grp[1].forEach(function (d) {
        h.push('<a href="?f=' + encodeURIComponent(d[0]) + '"><b>' +
               d[0] + '</b><span>' + d[1] + '</span></a>');
      });
      h.push('</div>');
    });
    out.innerHTML = h.join("");
    document.title = "earth · docs";
  }

  function enhanceTables() {
    Array.prototype.forEach.call(out.querySelectorAll("table"), function (t) {
      var heads = Array.prototype.map.call(
        t.querySelectorAll("thead th"), function (th) { return th.textContent.trim(); });
      var cols = heads.length || (t.rows[0] ? t.rows[0].cells.length : 0);
      var longest = 0;
      Array.prototype.forEach.call(t.querySelectorAll("td"), function (td) {
        longest = Math.max(longest, td.textContent.trim().length);
      });

      var box = document.createElement("div"); box.className = "tbox";
      var sc = document.createElement("div"); sc.className = "tscroll";
      t.parentNode.insertBefore(box, t);
      box.appendChild(sc); sc.appendChild(t);

      // A few columns of long prose reads better stacked than scrolled;
      // many columns of short values reads better scrolled with the label
      // pinned. ~80 characters is two phone lines at this type size, and a
      // two-column table earns stacking sooner because pinning its label
      // would leave almost nothing to scroll.
      if ((cols <= 2 && longest > 45) || (cols <= 3 && longest > 80)) {
        t.classList.add("stack");
        box.classList.add("stacked");
        Array.prototype.forEach.call(t.querySelectorAll("tbody tr"), function (tr) {
          Array.prototype.forEach.call(tr.cells, function (td, i) {
            if (heads[i]) td.setAttribute("data-label", heads[i]);
          });
        });
      } else {
        t.classList.add("pin");
        // is the first column a rank/index rather than a name?
        var firstMax = 0;
        Array.prototype.forEach.call(t.querySelectorAll("tr"), function (tr) {
          if (tr.cells[0]) firstMax = Math.max(firstMax, tr.cells[0].textContent.trim().length);
        });
        var two = cols >= 4 && firstMax <= 5;
        if (two) t.classList.add("pin2");

        var hint = document.createElement("div");
        hint.className = "thint";
        hint.textContent = "swipe the table sideways · " +
          (two ? "rank and name stay put" : "first column stays put");
        box.appendChild(hint);
        var check = function () {
          box.classList.toggle("over", sc.scrollWidth - sc.clientWidth > 4);
          if (two) {
            // the second sticky column starts where the first one ends
            var w = t.rows[0] && t.rows[0].cells[0]
              ? t.rows[0].cells[0].getBoundingClientRect().width : 0;
            Array.prototype.forEach.call(t.querySelectorAll("tr"), function (tr) {
              if (tr.cells[1]) tr.cells[1].style.left = w + "px";
            });
          }
        };
        check();
        window.addEventListener("resize", check);
        sc.addEventListener("scroll", function () {
          box.classList.toggle("ended",
            sc.scrollLeft + sc.clientWidth >= sc.scrollWidth - 4);
        }, { passive: true });
      }
    });
  }

  function buildToc() {
    var hs = out.querySelectorAll("h2, h3");
    if (hs.length < 3) { tocBtn.hidden = true; return; }
    tocBtn.hidden = false;
    var seen = {}, html = [];
    Array.prototype.forEach.call(hs, function (h) {
      var id = slug(h.textContent);
      if (seen[id]) { seen[id]++; id += "-" + seen[id]; } else { seen[id] = 1; }
      h.id = id;
      html.push('<a href="#' + id + '" class="' + h.tagName.toLowerCase() +
                '">' + h.textContent + "</a>");
    });
    tocNav.innerHTML = html.join("");

    // highlight the section you are actually in
    var links = {};
    Array.prototype.forEach.call(tocNav.querySelectorAll("a"), function (a) {
      links[a.getAttribute("href").slice(1)] = a;
    });
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          Array.prototype.forEach.call(tocNav.querySelectorAll("a.here"),
            function (a) { a.classList.remove("here"); });
          var a = links[e.target.id];
          if (a) { a.classList.add("here"); }
        });
      }, { rootMargin: "-15% 0px -70% 0px" });
      Array.prototype.forEach.call(hs, function (h) { io.observe(h); });
    }
    Array.prototype.forEach.call(tocNav.querySelectorAll("a"), function (a) {
      a.addEventListener("click", function () { drawer(false); });
    });
  }

  function drawer(on) {
    toc.classList.toggle("on", on);
    scrim.classList.toggle("on", on);
  }
  tocBtn.addEventListener("click", function () { drawer(!toc.classList.contains("on")); });
  document.getElementById("tocClose").addEventListener("click", function () { drawer(false); });
  scrim.addEventListener("click", function () { drawer(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") drawer(false);
  });

  // ---- deep links ----------------------------------------------------------
  // Fragments arrive from three places that do not know what this document
  // contains: status.html's experiment badge (#e-035), ml/RUNS.md's per-row
  // permalinks (#run-413), and session reports pasted by hand. MEASURED
  // 2026-08-19: of the 54 experiment IDs status.html links to, only 19 have
  // an explicit <a id> in EXPERIMENTS.md — so the plain getElementById lookup
  // dropped two thirds of those links at the top of a 5,000-line file, which
  // reads to the reader as "the link is broken" and to the author as "it
  // worked". Hence a ladder, and an admission when the ladder runs out.
  function anchorFor(frag) {
    var el = document.getElementById(frag);
    if (el) return el;
    // Heading ids are slugs of the WHOLE heading ("E-042 · SST as channel 40
    // — DISPATCHED…" -> "e-042-sst-as-channel-40-dispatched…"), so a fragment
    // naming the ID alone is a prefix of the one we want. First wins: the
    // document is chronological, so that is the section, not a back-reference.
    var pre = null;
    Array.prototype.forEach.call(out.querySelectorAll("[id]"), function (n) {
      if (!pre && n.id.indexOf(frag + "-") === 0) pre = n;
    });
    if (pre) return pre;
    // "E-035a" is an ARM of E-035 and usually has no section of its own; the
    // parent's section is where the arm is actually written up.
    var m = /^(e-\d{3})[a-z]$/.exec(frag);
    if (m) return anchorFor(m[1]);
    return null;
  }

  function resolveFragment() {
    if (!location.hash) return;
    var frag = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    var el = anchorFor(frag);
    if (el) { el.scrollIntoView(); return; }
    // Honest failure: the document loaded, the section did not. Say which,
    // at the top, where the reader is already looking.
    var p = document.createElement("p");
    p.className = "note";
    p.id = "fragmiss";
    p.textContent = "This document has no section “" + frag +
      "” — showing it from the top. Use the contents button for what it does have.";
    out.insertBefore(p, out.firstChild);
  }

  function renderDoc(path) {
    titleEl.innerHTML = path.replace(/^.*\//, "") +
      ' <small>' + (path.indexOf("/") > 0 ? path.replace(/\/[^/]*$/, "/") : "") + '</small>';
    document.title = path + " · earth docs";
    ghEl.href = "https://github.com/" + REPO + "/blob/" + BRANCH + "/" + path;
    out.innerHTML = '<p class="note">loading ' + path + "…</p>";

    fetch(srcUrl(path), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (md) {
        out.innerHTML = marked.parse(md, { gfm: true, breaks: false });
        enhanceTables();
        buildToc();
        // a deep link (?f=…#heading) must land after the render
        resolveFragment();
      })
      .catch(function (e) {
        out.innerHTML = '<p class="err">Could not load <code>' + path +
          "</code> (" + e.message + ").</p>" +
          '<p><a href="https://github.com/' + REPO + "/blob/" + BRANCH + "/" +
          path + '">Open it on GitHub instead →</a></p>';
      });
  }

  var f = qs("f");
  // only ever read markdown from inside the repo
  if (f && (!/\.md$/i.test(f) || /^https?:|\.\./i.test(f))) f = "";
  if (f) renderDoc(f); else renderIndex();
})();
</script>
</body>
</html>
