# GENERATED by tests/fixtures/make_fixtures.py — do not edit by hand.
# A registry whose "upstream" is a set of local file:// URLs, so the whole
# pipeline can be exercised with no network at all.
version: 1

hub:
  repo_id: test/local-hub
  repo_type: dataset
  commit_budget_per_hour: 0        # 0 = no commit-rate limiting in tests

hosts:
  testhost:
    max_lanes: 2
    min_gap_s: 0
    backoff_ladder_s: [0, 0, 0, 0]
    serves: the fixture files
    evidence: local
  testncei:
    max_lanes: 2
    min_gap_s: 0
    backoff_ladder_s: [0, 0, 0, 0]
    serves: the synthetic OISST days
    evidence: local
  testpsl:
    max_lanes: 1
    min_gap_s: 0
    backoff_ladder_s: [0, 0, 0, 0]
    serves: the synthetic NCEP file
    evidence: local
  testflaky:
    max_lanes: 1
    min_gap_s: 0
    backoff_ladder_s: [0, 0, 0, 0]
    serves: nothing — it always fails, to exercise the circuit breaker
    evidence: local

sources:
  - name: tiny
    tier: 0
    host: testhost
    mode: fetch
    fetcher: http
    chunk: file
    files: [hello.dat]
    url: "file:///home/claude/handover/tests/fixtures/generated/tiny/{file}"
    filename: "{file}"
    hub_prefix: tiny
    transform: passthrough
    expected_items: 1
    batch_files: 1
    bytes_wire: 32
    bytes_stored: 32
    notes: ["an ordinary small file over the http fetcher's file:// path"]

  - name: oisst
    tier: 0
    host: testncei
    mode: fetch
    fetcher: ncei_oisst_year
    chunk: year
    years: [2001, 2001]
    days: ['2001-12-29', '2001-12-30', '2001-12-31']
    expected_items: 1
    url: "file:///home/claude/handover/tests/fixtures/generated/oisst/oisst-avhrr-v02r01.{ymd}.nc"
    filename: oisst_daily_{year}.nc
    hub_prefix: oisst
    transform: oisst_year_fold
    batch_files: 1
    bytes_wire: 30000
    bytes_stored: 30000
    notes: ["three synthetic days folded into one year file"]

  - name: ncep
    tier: 0
    host: testpsl
    mode: fetch
    fetcher: http
    chunk: var_year
    vars: [uflx.sfc.gauss]
    years: [2001, 2001]
    expected_items: 1
    url: "file:///home/claude/handover/tests/fixtures/generated/ncep/{file}"
    filename: "{var}.{year}.nc"
    hub_prefix: ncep
    transform: passthrough
    batch_files: 1
    bytes_wire: 20000
    bytes_stored: 20000
    notes: ["an NCEP-shaped 4x-daily gaussian file"]

  - name: flaky
    tier: 0
    host: testflaky
    mode: fetch
    fetcher: transient_test
    chunk: file
    files: [a, b, c, d, e, f, g]
    url: "file:///home/claude/handover/tests/fixtures/generated/nowhere/{file}"
    filename: "{file}"
    hub_prefix: flaky
    transform: passthrough
    expected_items: 7
    batch_files: 1
    bytes_wire: 1
    bytes_stored: 1
    notes:
      - "ALWAYS fails, transiently. Five consecutive failures trip the lane's
         circuit breaker; the remaining items must come back `deferred` and
         the pipeline must still finish."
