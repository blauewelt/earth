# GENERATED by tests/fixtures/make_fixtures.py — do not edit by hand.
# A registry whose "upstream" is a set of local file:// URLs, so the whole
# pipeline can be exercised with no network at all.
version: 1

output:
  layout: "<output>/<item_id>.tfrecord  +  <item_id>.done"
  num_shards_per_group: 2

hosts:
  testhost:
    max_lanes: 2
    min_gap_s: 0
    backoff_ladder_s: [0, 0, 0, 0]
    serves: the fixture files
    evidence: local
  testncei:
    max_lanes: 2
    min_gap_s: 0
    backoff_ladder_s: [0, 0, 0, 0]
    serves: the synthetic OISST days
    evidence: local
  testpsl:
    max_lanes: 1
    min_gap_s: 0
    backoff_ladder_s: [0, 0, 0, 0]
    serves: the synthetic NCEP files
    evidence: local
  testflaky:
    max_lanes: 1
    min_gap_s: 0
    backoff_ladder_s: [0, 0, 0, 0]
    serves: nothing — it always fails, to exercise the circuit breaker
    evidence: local

sources:
  - name: tiny
    tier: 0
    host: testhost
    mode: fetch
    fetcher: http
    chunk: file
    files: [hello.dat]
    url: "file:///home/claude/handover/tests/fixtures/generated/tiny/{file}"
    filename: "{file}"
    transform: opaque
    grid: opaque
    expected_items: 1
    bytes_wire: 32
    bytes_stored: 32
    notes: ["an ordinary small file over the http fetcher's file:// path"]

  - name: ocean
    tier: 0
    host: testhost
    mode: fetch
    fetcher: http
    chunk: file
    files: [ocean_200307.nc]
    url: "file:///home/claude/handover/tests/fixtures/generated/ocean/{file}"
    filename: "{file}"
    variables: [uo, vo, mlotst, zos]
    transform: nc025_days
    grid: point025
    expected_items: 1
    bytes_wire: 20000
    bytes_stored: 20000
    notes: ["a GLORYS stand-in already on the 0.25 degree point grid"]

  - name: oisst
    tier: 0
    host: testncei
    mode: fetch
    fetcher: ncei_oisst_days
    chunk: year
    years: [2003, 2003]
    days: ['2003-07-15', '2003-07-16', '2003-07-17', '2003-07-18', '2003-07-19']
    expected_items: 1
    url: "file:///home/claude/handover/tests/fixtures/generated/oisst/oisst-avhrr-v02r01.{ymd}.nc"
    filename: oisst_daily_{year}.nc
    transform: oisst_days
    grid: oisst_center025
    bytes_wire: 30000
    bytes_stored: 30000
    notes:
      - "FIVE days are asked for and FOUR exist: 2003-07-17 is deliberately
         absent upstream. The item must still be written with the four days it
         got, and 2003-07-17 must appear in the retry queue as a day-level item."

  - name: ncep
    tier: 0
    host: testpsl
    mode: fetch
    fetcher: http
    chunk: var_year
    vars: [uflx, skt]
    years: [2003, 2003]
    extra_files: [land.sfc.gauss.nc]
    expected_items: 3
    url: "file:///home/claude/handover/tests/fixtures/generated/ncep/{file}"
    filename: "{var}.{year}.nc"
    transform: ncep_var_year
    grid: ncep_t62
    bytes_wire: 20000
    bytes_stored: 20000
    notes: ["4x-daily gaussian files plus the land mask"]

  - name: rg
    tier: 0
    host: testhost
    mode: fetch
    fetcher: http
    chunk: file
    files: [RG_ArgoClim_200307.nc]
    url: "file:///home/claude/handover/tests/fixtures/generated/rg/{file}"
    filename: "{file}"
    transform: rg_months
    grid: rg_1deg_center
    expected_items: 1
    bytes_wire: 20000
    bytes_stored: 20000
    notes: ["one month of T/S at the 16 AMOC pressure levels"]

  - name: flaky
    tier: 0
    host: testflaky
    mode: fetch
    fetcher: transient_test
    chunk: file
    files: [a, b, c, d, e, f, g]
    url: "file:///home/claude/handover/tests/fixtures/generated/nowhere/{file}"
    filename: "{file}"
    transform: opaque
    grid: opaque
    expected_items: 7
    bytes_wire: 1
    bytes_stored: 1
    notes:
      - "ALWAYS fails, transiently. Five consecutive failures trip the lane's
         circuit breaker; every remaining item must reach the RETRY QUEUE and
         the pipeline must still finish. Nothing is ever dropped."
