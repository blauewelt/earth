           mer, mtpr, skt, t2m, sp, tp]
    months: ["1982-01", "2024-12"]
    expected_items: 7224           # 14 variables x 516 months
    dataset_id: derived-era5-single-levels-daily-statistics
    filename: era5_{var}_{ym}.nc
    transform: nc025_days
    grid: era5_025
    requires_env: [CDSAPI_URL, CDSAPI_KEY]
    bytes_wire: 12000000
    bytes_stored: 12000000
    notes:
      - "BLOCKED on the free CDS (Climate Data Store) account only Chris can
         create. Without CDSAPI_KEY every item is reported `blocked` with a
         one-line explanation and NOTHING is requested."
      - "One request per (variable, month). The CDS queues server-side, so two
         in flight is the polite maximum for one user."
      - "The variable names above are ERA5 SHORT names; the CDS API wants the
         long ones for some datasets. Check the dataset's own form once the
         account exists."

