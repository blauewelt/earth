# Seal one named Actions secret to a caller-supplied RSA public key and ship
# it as a workflow artifact — so an authorized session can obtain a credential
# that lives only in GitHub secrets, without the secret ever appearing in a
# log, a commit, or an unencrypted artifact.
#
# WHY THIS EXISTS: secrets cannot be read back through the API by design, and
# the alternative handoff (pasting key material into a chat) exposes it to a
# transcript. Sealing to an ephemeral public key means the artifact is useless
# to anyone but the holder of the matching private key, which never leaves the
# requesting session.
#
# TRUST BOUNDARY, stated plainly: anyone with push access to this repo could
# add a workflow that reads any repo secret — that is GitHub's model, not a
# hole this file opens. This workflow only makes the already-possible path
# explicit, auditable (every use is a visible run), and safe in transit.
#
# The hybrid scheme (RSA-OAEP cannot seal a 2 KB JSON directly): a random
# 32-byte passphrase encrypts the secret with AES-256-CBC (pbkdf2), and the
# passphrase is sealed with RSA-OAEP under the caller's public key. The
# artifact carries {sealed_pass.bin, secret.enc}; decrypt with:
#   openssl pkeyutl -decrypt -inkey priv.pem -pkeyopt rsa_padding_mode:oaep \
#     -in sealed_pass.bin -out pass.hex
#   openssl enc -d -aes-256-cbc -pbkdf2 -pass file:pass.hex \
#     -in secret.enc -out secret.json
name: secret-handoff
on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: "Name of the Actions secret to seal (allowlisted below)"
        required: true
      pubkey_b64:
        description: "base64 of a PEM RSA public key (the sealing target)"
        required: true
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Seal the secret to the caller's public key
        env:
          # The allowlist is the env block: only secrets named here can ever
          # be sealed. Add a line to extend it; nothing is interpolated.
          GCP_TPU_SA_KEY: ${{ secrets.GCP_TPU_SA_KEY }}
          WHICH: ${{ inputs.secret_name }}
          PUB_B64: ${{ inputs.pubkey_b64 }}
        run: |
          set -eu
          case "$WHICH" in
            GCP_TPU_SA_KEY) VAL="$GCP_TPU_SA_KEY" ;;
            *) echo "secret '$WHICH' is not in this workflow's allowlist"; exit 1 ;;
          esac
          [ -n "$VAL" ] || { echo "secret '$WHICH' is empty or unset"; exit 1; }
          mkdir -p out
          printf '%s' "$PUB_B64" | base64 -d > pub.pem
          openssl rand -hex 32 > pass.hex
          printf '%s' "$VAL" | openssl enc -aes-256-cbc -pbkdf2 -pass file:pass.hex -out out/secret.enc
          openssl pkeyutl -encrypt -pubin -inkey pub.pem \
            -pkeyopt rsa_padding_mode:oaep -in pass.hex -out out/sealed_pass.bin
          rm -f pass.hex
          echo "sealed '$WHICH' ($(wc -c < out/secret.enc) bytes ciphertext)"
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-secret
          path: out/
          retention-days: 1
