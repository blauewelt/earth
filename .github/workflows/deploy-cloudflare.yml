# Standby deployment of the browser-facing site to Cloudflare Pages.
#
# WHY THIS EXISTS, AND WHY IT DOES NOTHING TODAY
# ----------------------------------------------
# GitHub Pages serves this site under a *soft* 100 GB/month bandwidth limit
# (docs.github.com, "GitHub Pages limits"). Soft means GitHub may simply stop
# serving the site rather than bill for it, and the same page forbids using
# Pages for anything commercial. Cloudflare Pages' free tier is unlimited
# bandwidth and unlimited static requests, so it is the obvious escape hatch —
# but an escape hatch is only useful if it was cut BEFORE the fire. This
# workflow is that hatch, pre-cut and inert.
#
# `pages.yml` is untouched and remains the live site. Both targets can run
# indefinitely and cost nothing; a cutover is then a link/DNS change, not a
# migration under load. The whole runbook — limits side by side, the bandwidth
# arithmetic, the measured deploy latency of each host, the exact click-path to
# enable this, and what breaks on cutover — is docs/HOSTING.md.
#
# WHAT THE `paths:` FILTER IS FOR
# -------------------------------
# Direct Upload does not consume Cloudflare's 500-builds/month quota (that
# quota is for projects Cloudflare BUILDS from a Git integration — see
# docs/HOSTING.md §3), so the filter is no longer load-bearing for quota. It is
# still right, and for a better reason: this repo took 759 commits in the 30
# days to 2026-08-21 and only 214 of them changed a byte a browser is served.
# Publishing an identical 400 MiB site 545 extra times a month is pointless
# work, pointless deployment history, and pointless risk. Measured over those
# same 30 days: 298 commits touched only `ml/`, and ZERO of them match this
# filter.
#
# NEVER add `runs-on: gpu` here, and never add a trigger that a fork can fire
# (`pull_request`, `issue_comment`, `workflow_run`). ml/CLAUDE.md §6: the one
# line of defence for the self-hosted GPU boxes is that nothing fork-triggerable
# ever reaches them. This job is `ubuntu-latest`, always.

name: Deploy to Cloudflare Pages (standby)

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Only the files a browser is actually served. Verified against the real
    # asset graph and against what the live site returns 200 for, 2026-08-21:
    # Cesium comes from cdnjs, and docs.html reads every .md from
    # raw.githubusercontent.com on the deployed site — so neither _vendor/
    # (untracked anyway) nor the bulk of ml/ is origin content.
    #
    # Three entries are less obvious and each is here for a measured reason:
    #   docs/**             index.html and the pixel card link docs/*.md with
    #                       RELATIVE hrefs, which 404 without it.
    #   ml/index.html       the `/earth/ml` shortcut Chris asked for — a meta
    #                       refresh to ../status.html. Live and returning 200
    #                       today; excluded from an earlier draft of this
    #                       allowlist, which would have silently broken it.
    #   ml/**/figs/*.html   CLAUDE.md §0b: an HTML figure must be linked at the
    #                       Pages origin, because a github.com blob URL renders
    #                       it as source. Those links are posted in chat.
    paths:
      - 'index.html'
      - 'status.html'
      - 'docs.html'
      - '404.html'
      - 'manifest.json'
      - '.nojekyll'
      - 'icon-*.png'
      - 'src/**'
      - 'lib/**'
      - 'data/**'
      - 'docs/**'
      - 'ml/index.html'
      - 'ml/figs/*.html'
      - 'ml/paper/figs/*.html'
      - '.github/workflows/deploy-cloudflare.yml'

# No write scope of any kind: this job reads the repo and talks to Cloudflare.
permissions:
  contents: read

# One deploy at a time; a burst of data commits should publish the tip, not
# race three uploads of 400 MB against each other. Cancelling mid-upload is
# safe: a Pages deployment only becomes live once the upload completes, so an
# interrupted run leaves the previous deployment serving.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # `secrets` is available to a job-level `env:` but NOT to an `if:`, so
      # the presence checks are reduced to booleans here and read as `env.` in
      # step conditions below. This stores "true"/"false" — never a token.
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      EVENT: ${{ github.event_name }}
      # Project name is not a secret. Override with a repository *variable*
      # if the Cloudflare project ends up named something else.
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'earth' }}
    steps:
      # Three different "not configured" states, three different answers. A
      # feature nobody has enabled must never paint a red X on every push — but
      # the two states that are MISTAKES rather than choices must be loud, or
      # the failure mode is a workflow that reports success and deploys
      # nothing, which is the exact class of bug CLAUDE.md Part 2 warns about
      # ("a step that reports success is not evidence it did anything").
      - name: Configuration check
        if: env.CONFIGURED != 'true'
        run: |
          set -euo pipefail
          if [ "$HAS_TOKEN" = "true" ] || [ "$HAS_ACCOUNT" = "true" ]; then
            echo "::error title=Cloudflare half-configured::CLOUDFLARE_API_TOKEN present=$HAS_TOKEN, CLOUDFLARE_ACCOUNT_ID present=$HAS_ACCOUNT. Both are required; one alone is a typo, not a standby. See docs/HOSTING.md."
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::error title=Cloudflare not configured::You asked for a deploy by hand and there is nothing to deploy with. Add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID first — docs/HOSTING.md §5 is the click-path."
            exit 1
          fi
          echo "::notice title=Cloudflare Pages standby::Not configured — nothing deployed, and this is not a failure. GitHub Pages remains the live site."
          echo "::notice title=To enable::Create a Cloudflare Pages project (Direct Upload) named '$PROJECT', then add repo secrets CLOUDFLARE_API_TOKEN (token with the 'Cloudflare Pages:Edit' permission) and CLOUDFLARE_ACCOUNT_ID. Step-by-step: docs/HOSTING.md"
          {
            echo "### Cloudflare Pages: standby"
            echo
            echo "No deploy was attempted — \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` are not set."
            echo "GitHub Pages is unaffected and remains the live site."
            echo
            echo "See [docs/HOSTING.md](../blob/main/docs/HOSTING.md) §5 for the click-path that turns this on."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: env.CONFIGURED == 'true'
        uses: actions/checkout@v4

      # Build the upload set from an ALLOWLIST of tracked files, not by
      # deleting things from a checkout. An allowlist fails closed: a new
      # top-level directory of model checkpoints is excluded by default
      # instead of silently shipping 300 MB. `git ls-files` also means
      # untracked build junk and _vendor/ can never leak in.
      #
      # Failing closed has a cost, and the manifest check below is how it is
      # paid: a file the site NEEDS is also excluded by default, and nothing
      # about the upload would look wrong. Keep this list in step with the
      # `paths:` filter above — they are the same set.
      - name: Assemble the browser-facing site
        if: env.CONFIGURED == 'true'
        run: |
          set -euo pipefail
          # The site lives at blauewelt.org/earth/ (Chris, 2026-08-22) — the
          # same path it had on GitHub Pages, so every relative link keeps
          # working and the apex stays free for whatever comes next. The
          # upload set therefore goes under _site/earth/, plus two root files:
          #   _redirects  — the bare apex forwards to /earth/ (302, deliberately
          #                 not 301, so the root can be repurposed without a
          #                 cached redirect outliving the decision);
          #   404.html    — Cloudflare looks for 404.html from the requested
          #                 path upward to the root; without a ROOT copy a
          #                 request outside /earth/ would get the SPA fallback.
          mkdir -p _site/earth
          # NUL-separated all the way through: `git ls-files -z` never quotes,
          # and `tar --null -T -` copies exactly the listed paths, creating
          # parent directories as it goes. No rsync dependency, no globbing
          # in the shell, nothing untracked can ride along.
          git ls-files -z -- \
            index.html status.html docs.html 404.html manifest.json .nojekyll \
            'icon-*.png' 'src/**' 'lib/**' 'data/**' 'docs/**' \
            ml/index.html 'ml/figs/*.html' 'ml/paper/figs/*.html' \
            | tar --null -T - -cf - | tar -xf - -C _site/earth
          cp _site/earth/404.html _site/404.html
          printf '/ /earth/ 302\n' > _site/_redirects

          # Every entry point the site is actually entered through. An
          # allowlist that quietly stopped matching one of these would deploy a
          # green, complete-looking, broken site.
          missing=""
          for f in index.html status.html docs.html 404.html manifest.json \
                   src/app.js src/style.css lib/marked.umd.js \
                   icon-192.png data/catalog.json docs/PIXEL_STATE.md \
                   ml/index.html; do
            [ -f "_site/earth/$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Allowlist dropped a required file::${missing# } — the git ls-files allowlist in this workflow no longer matches the site. See docs/HOSTING.md §3 and §9."; exit 1
          fi

          files=$(find _site -type f | wc -l)
          bytes=$(du -sb _site | cut -f1)
          big=$(find _site -type f -size +25000000c | head -5)
          echo "::notice title=Upload set::${files} files, $((bytes/1048576)) MiB"
          # Cloudflare Pages free tier: 20,000 files/site, 25 MiB per file.
          # Fail loudly here rather than half-way through an upload.
          if [ "$files" -gt 20000 ]; then
            echo "::error title=Over Cloudflare's file limit::${files} files > 20,000. See docs/HOSTING.md."; exit 1
          fi
          if [ -n "$big" ]; then
            echo "::error title=File over 25 MiB::$big — Cloudflare Pages will reject it. See docs/HOSTING.md."; exit 1
          fi
          {
            echo "### Cloudflare Pages upload set"
            echo
            echo "- files: **${files}** / 20,000"
            echo "- size: **$((bytes/1048576)) MiB**"
            echo "- commit: \`${GITHUB_SHA:0:8}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Secrets go in `env:`, never in argv — CLAUDE.md's standing rule, and
      # the permission classifier enforces it locally for good reason. Both
      # `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID` are read from the
      # environment by wrangler itself (the names are Cloudflare's own, from
      # its "Use Direct Upload with continuous integration" guide); only the
      # non-secret project name, branch and commit sha appear on the command
      # line. The `@4` pin is a MAJOR pin, not a freeze: wrangler 4 is the
      # current line (4.125.0, published 2026-08-20).
      - name: Deploy to Cloudflare Pages
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy _site \
            --project-name "$PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=true
