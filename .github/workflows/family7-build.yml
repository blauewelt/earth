# E-070 / E-071 / E-077: build FAMILY 7.2 -- the first input tensor that covers
# the whole globe rather than the North Atlantic window, at 0.25 degrees,
# five-day bins, 1982-2024, with the shared land/ocean channels and the ocean
# colour group -- CORRECTED. See ml/plans/E077_family7_ocean_colour.md, the
# section "f7l2 -- the corrected build (2026-09-14)", for what f7l1 got wrong.
#
# WHAT IT BUILDS. `ml/build_family7.py` streams five sources into four
# co-registered memmaps and one small npz, recipe `f7l2`, stem
# `family7_global025_pentad_l2`: `g025` [3142, 721, 1440, 7] float16 (45.7 GB --
# currents, mixed-layer depth, SSH, observed sea-surface temperature, sea ice),
# `g100` [3142, 181, 360, 15] (6.1 GB -- NCEP/NCAR wind stress, 2 m air, 10 m
# wind, pressure, precipitation, snow, soil, heat fluxes, skin temperature),
# `rg100` [n_live, 181, 360, 32] (~1 GB -- the Roemmich-Gilson Argo depth
# column, live bins only) and `oc025` [1997, 721, 1440, 2] (8.3 GB -- ESA OC-CCI
# surface chlorophyll-a, box-averaged from 4 km to 0.25 degrees in LOG space,
# plus the clear-sky coverage that average rests on), on an OFFSET time axis
# that starts at the colour record's own first day (1997-09-04, bin 1145)
# instead of carrying 4.7 GB of NaN before it. Plus the statics, the norms and
# the truth series.
#
# WHAT f7l2 REBUILDS, AND WHAT IT INHERITS. `seed_from` points at a FINISHED
# f7l1 build. THREE of its four group files are HARD-LINKED under the new stem
# (`os.link`, one inode, zero new bytes, same filesystem) -- `g025`, `rg100`,
# `oc025` -- together with the inherited stages' markers, spec files, norm.npz
# and per-stage state. TWO stages re-run, and they are the whole point of the
# recipe:
#
#   * `static` -- f7l1 published `elev` as 1,038,240 NaN. Its 933 MB ETOPO
#     download was aborted four times by build_family3's 1.00 MB/s throughput
#     guard (the box read www.ngdc.noaa.gov at 0.145-0.220 MB/s), the stage
#     warned once and wrote `static.done` anyway, and the next dispatch skipped
#     it on that marker and republished the NaN. The stage now REFUSES, `meta`
#     and `publish` refuse an empty static independently of any marker, and the
#     ETOPO fetch has a floor sized from the file rather than from the 45 GB
#     streams the guard was written for.
#   * `ncep` -- g100's `log_prate` and `log_swe` were computed by `np.log1p` on
#     a FLOAT32 array (`interp2_nan` returns float32), and float32 log1p is not
#     correctly rounded: 8.1 % of values differ by 1-2 ULP between numpy builds
#     and SIMD targets, which moved ~2 cells per bin by one float16 step
#     between f7l0 and f7l1. Evaluated in float64 the whole group reproduces
#     bit-for-bit across boxes.
#
# So `g100` is NOT hard-linked, its normalisation is pruned from the inherited
# `norm.npz`, and `norm` re-z-scores that group alone. The publish step fetches
# f7l1's OWN manifest and writes `same_as_base` per file from the comparison:
# a mismatch on an INHERITED group is fatal (the Hub, the handover and another
# agent's hand-off all cite those hashes), a mismatch on `g100` is the
# FINDING this build exists to produce and is recorded with both hashes.
#
# DELIBERATELY NOT FIXED: `oc025`'s `log_chl` takes `np.log10` on a float32
# raster for the same memory reason, so the colour group has the same
# non-reproducibility. Its per-year partials are already computed and its bytes
# are inherited unchanged; the plan records it as a known limitation.
#
# WHY A BOX AND NOT A HOSTED RUNNER. A GitHub-hosted job dies at six hours and
# has ~14 GB of free disk. A full build is ~61 GB of memmaps plus up to ~3 GB of
# sources in flight plus the verify downloads, and about five hours of wall
# clock; the colour stage alone streams ~10,000 daily files of ~40 MB (~400 GB)
# and takes 2.5-3 h at the box's ~44 MB/s. Splitting that into hosted
# year-lanes -- E-070 Phase C's shape -- would mean four runners each holding a
# partial memmap that no other lane can see, i.e. four experiments instead of
# one. A SEEDED f7l2 is far cheaper than that -- it rebuilds one 6.1 GB group
# and two statics -- but it still has to run where the f7l1 work dir IS, because
# a hard link cannot cross a filesystem. The `runner` default names a box; its
# `/opt/earth-cache` is persistent across jobs, which is also what makes the
# resume below real AND what makes the hard links possible (a link cannot cross
# a filesystem, so `seed_from` and `work` must both live under it).
#
# RESUMABILITY IS THE CONTRACT. Every stage flushes its memmap and THEN writes
# `<work>/<stage>.done` (ml/CLAUDE.md 5.21: a marker may only under-claim), and
# `sst`, `ncep`, `rg` and `occci` also keep per-year markers plus an atomically
# written carry for the pentad that straddles a year boundary. So a job that
# hits the timeout, loses its box, or is cancelled is resumed by re-dispatching
# this workflow WITH THE SAME `work` VALUE: finished stages are skipped and the
# interrupted one restarts at the year it lost, not at 1997. That is the only
# thing `work` is for -- pointing it somewhere new starts a fresh build, and
# two builds are two experiments (E-070 5).
#
# WHY THE LAST STEP EXISTS. A dead job must still tell its story (ml/CLAUDE.md
# 5.25/5.26): the final step runs `if: always()` and uploads `progress.json`,
# every `*.done` marker and the last 200 lines of the build log as an Actions
# artifact, so a timeout at hour 23 is diagnosable without the box.
#
# SECURITY. `workflow_dispatch` ONLY. ml/CLAUDE.md 6: self-hosted runners on a
# public repo are safe here for exactly one reason -- dispatch requires repo
# write access. NEVER add `pull_request`, `issue_comment`, `workflow_run` or
# `schedule` to this file; any of them would hand code execution on a rented
# box, plus the job token, to anyone who opens a PR. HF_TOKEN reaches the
# builder as an ENV VAR and never as a command-line argument (argv is world
# readable on the box, and the box's host has root).
name: Family 7 build
run-name: family7.2 ${{ github.event.inputs.stage || 'all' }} -> ${{ github.event.inputs.work || 'ml/cache/family7_l2' }}

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "runner label. A Vast box's runner NAME is an implicit label; the default is the 300 GB Ontario box, which is the only one with room for the seed's 53 GB plus the colour group's 25 GB plus sources"
        default: "gpu-box-31299601"
      stage:
        description: "all | glorys | sst | ncep | rg | occci | static | truth | norm | meta | publish. Order is fixed (ncep needs sst for the sst repair; norm needs everything including occci; publish last) -- a single stage is for resuming or re-running one, never for building out of order"
        default: "all"
      work:
        description: "the build directory for THIS (f7l2) build. RE-DISPATCH WITH THE SAME VALUE TO RESUME: finished stages are skipped by their .done markers. A different path is a different build"
        default: "ml/cache/family7_l2"
      seed_from:
        description: "the FINISHED f7l1 build to inherit from: its g025, rg100 and oc025 files are hard-linked under the f7l2 stem and the inherited stages' markers/specs/norm.npz copied, so only `ncep` (g100, rebuilt with the float64 log1p) and `static` (elev, which f7l1 published as all-NaN) run. g100 is NOT linked. Must be on the same filesystem as work -- a hard link cannot cross one, and both live under /opt/earth-cache. The word `none` means build all four groups from scratch (~5 h more) -- an EMPTY value is silently replaced by this default by GitHub itself, so empty cannot mean that"
        default: "ml/cache/family7_l1"
      extra_args:
        description: "extra flags for ml/build_family7.py, e.g. --source-dir <dir>, --oc-source globcolour, --redo-group <g>, or --smoke. The three DEGRADE flags (--allow-empty-rg, --allow-empty-statics, --allow-missing-years) each let one stage finish with a source it could not read; none of them is a default and none is needed for a healthy build. Word-split deliberately; leave empty for a real build"
        default: ""

permissions:
  contents: read          # the tensor is published to Hugging Face, not here

concurrency:
  # ONE BUILD AT A TIME, and never cancelled in flight. Two concurrent builds
  # would write the same memmaps and the same .done markers from two boxes and
  # produce a tensor neither of them describes -- "two builds are two
  # experiments" (E-070 5), and this is the degenerate case where they are also
  # the same files. cancel-in-progress stays false: a running build holds hours
  # of streamed sources whose only durable record is its own markers.
  group: family7-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner }}
    timeout-minutes: 1440         # 24 h; the build is ~5 h, a resumed stage less
    steps:
      - uses: actions/checkout@v4

      # The persistent cache, in ml-train.yml's exact form. /opt/earth-cache
      # survives a job and a stop/start, which is what makes `work` under
      # ml/cache/ a resumable location rather than scratch that dies with the
      # runner's workspace cleanup.
      - name: Persistent data cache (self-hosted box)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /opt/earth-cache
          rm -rf ml/cache
          ln -s /opt/earth-cache ml/cache
          # COLD-START SEED OF THE ARGO CUBES, ml-train.yml's `seed()` verbatim
          # in shape (lines ~715-760 there). Added 2026-09-14 after run #10:
          # the box read sio-argo.ucsd.edu at 0.29 MB/s, build_family3's
          # throughput guard aborted all four attempts -- correctly -- and the
          # build published `rg100` with shape (0, 181, 360, 32), 128 bytes,
          # GREEN. The builder now refuses that (--allow-empty-rg is the only
          # way to ask for it), so a box without the cubes would FAIL the job
          # five hours in; seeding them here is the reason it will not.
          # The release download URLs need no auth (public repo); the assets
          # API call does, hence GH_TOKEN. The check is COMPLETENESS, not
          # existence -- a half-extracted rg/ from a stalled origin fetch must
          # not suppress the seed. Hard --max-time on every curl and NO
          # --retry inside the stream: a mid-body retry restarts the chunk at
          # byte 0 and corrupts the tar.
          seed_rg() {
            echo "seeding rg from release data-cache-v1 …"
            rm -rf /opt/earth-cache/rg
            assets=$(curl -s --max-time 120 -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/data-cache-v1" \
              | python3 -c "import json,sys;[print(a['browser_download_url']) for a in json.load(sys.stdin).get('assets',[]) if a['name'].startswith('rg.tar.')]")
            if [ -n "$assets" ]; then
              if echo "$assets" | sort | while read u; do
                   echo "  chunk $(basename "$u") …" >&2
                   curl -sL --max-time 1800 "$u" || exit 1
                 done | tar x -C /opt/earth-cache; then
                echo "  seeded: $(du -sh /opt/earth-cache/rg | cut -f1)"
              else
                echo "::warning::seed rg failed (stall/timeout) — partial dir stays, the completeness check re-seeds next run"
              fi
            else
              echo "::warning::no rg.tar.* assets on data-cache-v1 — stage rg will try SIO and REFUSE if it cannot read the cubes"
            fi
          }
          { [ -f /opt/earth-cache/rg/RG_S.nc.gz ] && \
            [ -f /opt/earth-cache/rg/RG_T.nc.gz ]; } || seed_rg
          echo "rg cache: $(ls /opt/earth-cache/rg 2>/dev/null | wc -l) file(s)"

      # Check the preconditions while the inputs are all they have cost
      # (ml/CLAUDE.md 0.3). Both of these are DEFINITE answers and therefore
      # may be fatal (5.17): a build without a token cannot publish what it
      # spends five hours computing, and a build without disk cannot compute
      # it. Over 90 % disk is unusable, not a warning (7) -- a full box
      # computes fine and reports nothing, because every metrics write, every
      # log append and every checkpoint mirror fails behind its own
      # best-effort guard.
      # "UNSEEDED" IS SPELLED `none`, NOT "". Measured 2026-09-13 on runs #4
      # and #5 (a fresh 200 GB box with no f7l0 on it, dispatched with
      # seed_from=""): #4 failed because the old `|| 'ml/cache/family7'`
      # fallback replaced the empty string; #5, with that fallback removed,
      # STILL printed SEED=ml/cache/family7 -- GitHub applies the input's
      # `default:` to an explicitly empty workflow_dispatch value before the
      # workflow ever sees it. So the documented "leave it empty" could never
      # have worked, and the sentinel below is the only way to ask for the
      # unseeded build without dropping the default (which the everyday seeded
      # dispatch relies on). Both steps that read SEED normalise it.
      - name: Preflight
        id: preflight
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WORK: ${{ github.event.inputs.work || 'ml/cache/family7_l2' }}
          SEED: ${{ github.event.inputs.seed_from }}
        run: |
          if [ "${SEED}" = "none" ]; then SEED=""; fi
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::HF_TOKEN secret is not set. The build publishes to"
            echo "the Hub and verifies the restore; without it the job would"
            echo "spend ~5 h and have nowhere to put the result. Set it at"
            echo "Settings -> Secrets and variables -> Actions; the value is in"
            echo "the claude.ai project doc claude/huggingface-access.md."
            exit 1
          fi
          mkdir -p "${WORK}"
          echo "cache mount, as the build will see it:"
          df -h ml/cache
          line=$(df -P ml/cache | tail -1)
          use=$(printf '%s\n' "${line}" | awk '{print $5}' | tr -d '%')
          free_gb=$(printf '%s\n' "${line}" | awk '{print int($4 / 1048576)}')
          echo "usage ${use}% · ${free_gb} GB free on $(printf '%s\n' "${line}" | awk '{print $6}')"
          # 80 GB, for the SEEDED build this workflow now runs. The three
          # inherited groups cost ZERO new bytes (they are hard links into the
          # f7l0 directory on the same filesystem), so what this job has to
          # find room for is the colour group and the publish: 16.6 GB of
          # oc025 float32 + 8.3 GB of oc025 float16 written beside it before
          # the float32 is dropped + <= 3 GB of daily sources in flight (one
          # ~40 MB file at a time, deleted as read) + 3 GB headroom + the
          # restore-verify, which downloads ONE published file at a time and
          # therefore peaks at the largest of them, 45.7 GB. 16.6 + 8.3 + 3 +
          # 3 = 31 GB to build and 45.7 GB transiently to verify; 80 GB covers
          # the worse of the two with room to spare, and a guard sized exactly
          # at the allocation it guards cannot fire in time (ml/CLAUDE.md
          # 5.18). An UNSEEDED build (seed_from `none`) needs ~93 GB instead --
          # the builder's own disk_guard prices that itself and refuses.
          if [ "${use}" -ge 90 ]; then
            echo "::error::cache mount is ${use}% full (>= 90 %). Over 90 % is"
            echo "unusable, not a warning (ml/CLAUDE.md 7): the box computes and"
            echo "silently reports nothing. Free space (scripts/disk_hygiene.sh,"
            echo "or drop an old build directory) and re-dispatch with the same"
            echo "work value -- the finished stages will be skipped."
            exit 1
          fi
          if [ "${free_gb}" -lt 80 ]; then
            echo "::error::only ${free_gb} GB free on the cache mount; this"
            echo "build needs ~31 GB to compute oc025 (16.6 GB float32 +"
            echo "8.3 GB float16 + <= 3 GB of sources in flight + 3 GB"
            echo "headroom) and peaks at ~46 GB transiently while the publish"
            echo "step downloads each file back to verify it."
            echo "Rent a bigger box or free space, then re-dispatch with the"
            echo "same work value to resume."
            exit 1
          fi
          # THE SEED HAS TO BE THERE, AND ON THE SAME FILESYSTEM. A hard link
          # cannot cross one, and `--seed-from` refuses rather than copying
          # 53 GB -- but it refuses four minutes into the job, after checkout
          # and pip install, and this check costs nothing (ml/CLAUDE.md 0.3:
          # a precondition that depends only on the inputs must be checked
          # while the inputs are all it has cost you).
          if [ -n "${SEED}" ]; then
            if [ ! -d "${SEED}" ]; then
              echo "::error::seed_from=${SEED} does not exist. It must be a"
              echo "FINISHED f7l0 build (its three *_X_*.npy group files, its"
              echo ".done markers and its norm.npz). Set seed_from to `none` to"
              echo "build all four groups from scratch instead -- that is"
              echo "about five more hours and it republishes bytes that"
              echo "already exist on the Hub."
              exit 1
            fi
            # THE STEM AND THE GROUP LIST COME FROM THE BUILDER, not from
            # three literals here. They were `family7_global025_pentad_l0` and
            # `g025 g100 rg100` when f7l1 was the build; f7l2 inherits from
            # f7l1 and inherits only THREE of its FOUR groups (g100 is rebuilt
            # with the float64 log1p). A hand-copied stem in a preflight is a
            # check that passes on the wrong directory, or fails on the right
            # one, the first time the recipe moves -- and this preflight is
            # supposed to be the thing that catches a wrong `seed_from` while
            # the inputs are all it has cost (ml/CLAUDE.md 0.3).
            # Read the two constants off the SOURCE TEXT, not by importing the
            # module: this step runs before `Install`, and the builder imports
            # netCDF4/xarray at module scope.
            need=$(python3 -c "import re; src=open('ml/build_family7.py').read(); stem=re.search(r'^BASE_STEM = .([^\"]+).', src, re.M).group(1); gs=re.findall(r'[a-z0-9]+', re.search(r'^INHERITED_GROUPS = \(([^)]*)\)', src, re.M).group(1)); print(' '.join(f'{stem}_X_{g}.npy' for g in gs))")
            echo "seed must hold: ${need}"
            for f in ${need}; do
              if [ ! -f "${SEED}/${f}" ]; then
                echo "::error::${SEED}/${f} is missing -- ${SEED} is not a"
                echo "finished build of the recipe this one inherits from."
                exit 1
              fi
            done
            sd=$(df -P "${SEED}" | tail -1 | awk '{print $1}')
            wd=$(df -P "${WORK}" | tail -1 | awk '{print $1}')
            if [ "${sd}" != "${wd}" ]; then
              echo "::error::seed_from (${SEED}, on ${sd}) and work (${WORK},"
              echo "on ${wd}) are on DIFFERENT filesystems. os.link cannot"
              echo "cross one; put both under /opt/earth-cache."
              exit 1
            fi
            echo "seed ok: ${SEED} on ${sd}, three group files present"
          else
            echo "::warning::seed_from is none -- building all four groups"
            echo "from scratch (~5 h more, and it recomputes 53 GB that f7l0"
            echo "already published)."
          fi
          echo "preflight ok: token present, ${free_gb} GB free, ${use}% used"

      # MEASURE THE TWO HOSTS THIS BOX HAS TO STREAM FROM, before five hours
      # are spent finding out. Neither reading is fatal — the PSL half is now
      # covered by the Hub mirror (ml/mirror_psl.py) and the CEDA half has no
      # fallback at all, so the right answer to a slow host is a number in the
      # log rather than a refused job.
      #
      # PSL: 0.17 MB/s from the UK box on 2026-09-13 (one 477 MB OISST year in
      # 47 minutes; 33 s from another box) is what the mirror exists for. A
      # warning under 2 MB/s says the build DEPENDS on the mirror being
      # complete — a file the mirror lacks falls back to this rate.
      #
      # CEDA: the `occci` stage streams ~10,000 daily files, ~400 GB, and
      # NOBODY HAS MEASURED dap.ceda.ac.uk's rate from a box. So measure it and
      # print the arithmetic: at the measured rate, 400 GB takes N hours, and
      # the job's timeout is 24. `|| true` on the step's last line is not
      # needed — every command here is guarded — but the step must never fail
      # the build, so it ends with `exit 0`.
      #
      # NGDC: added 2026-09-14 after run #10. The `static` stage's ETOPO file
      # is 933 MB from www.ngdc.noaa.gov with NO mirror anywhere, and that box
      # read it at 0.145-0.220 MB/s — the fetch guard aborted all four
      # attempts and `elev` was published as 1,038,240 NaN, green. The builder
      # refuses that now, so the cost of a slow NGDC is a FAILED job five
      # hours in unless somebody read this number first. It is measured and
      # printed with its arithmetic, exactly like CEDA's.
      - name: Source throughput (PSL, CEDA, NGDC)
        continue-on-error: true
        run: |
          probe () {                     # $1 label  $2 bytes  $3 url
            t0=$(date +%s.%N)
            got=$(curl -sS --max-time 60 -r 0-$(( $2 - 1 )) -o /dev/null \
                    -w '%{size_download}' "$3" || echo 0)
            t1=$(date +%s.%N)
            awk -v b="${got}" -v a="${t0}" -v z="${t1}" \
                'BEGIN{d=z-a; if(d<=0)d=0.001; printf "%.2f", b/1000000/d}'
          }
          psl=$(probe psl 104857600 \
            "https://downloads.psl.noaa.gov/Datasets/noaa.oisst.v2.highres/sst.day.mean.1983.nc")
          echo "::notice::PSL ${psl} MB/s (first 100 MB of sst.day.mean.1983.nc, 60 s cap)"
          if awk -v m="${psl}" 'BEGIN{exit !(m < 2)}'; then
            echo "::warning::PSL serves this box at ${psl} MB/s. The sst and"
            echo "ncep stages need ~45 GB from that host, so this build DEPENDS"
            echo "on the Hub mirror (mirrors/psl/) being complete — every file"
            echo "the mirror lacks is fetched at this rate. Run the 'PSL mirror"
            echo "to the Hub' workflow before relying on a full rebuild."
          fi
          ceda=$(probe ceda 52428800 \
            "https://dap.ceda.ac.uk/neodc/esacci/ocean_colour/data/v6.0-release/geographic/netcdf/chlor_a/daily/v6.0/2015/ESACCI-OC-L3S-CHLOR_A-MERGED-1D_DAILY_4km_GEO_PML_OCx-20150702-fv6.0.nc")
          echo "::notice::CEDA ${ceda} MB/s (first 50 MB of one 2015 OC-CCI day, 60 s cap)"
          if awk -v m="${ceda}" 'BEGIN{exit !(m < 5)}'; then
            hrs=$(awk -v m="${ceda}" 'BEGIN{if(m<=0){print "infinity"}else{printf "%.1f", 400000/m/3600}}')
            echo "::warning::CEDA serves this box at ${ceda} MB/s. The occci"
            echo "stage streams ~400 GB of daily files; at this rate that is"
            echo "${hrs} h of transfer alone, against a 24 h job timeout. There"
            echo "is no mirror for CEDA — if this number is real, the colour"
            echo "stage has to be resumed across several dispatches (same work"
            echo "value) or mirrored the way the PSL inputs now are."
          fi
          ngdc=$(probe ngdc 52428800 \
            "https://www.ngdc.noaa.gov/thredds/fileServer/global/ETOPO2022/60s/60s_surface_elev_netcdf/ETOPO_2022_v1_60s_N90W180_surface.nc")
          echo "::notice::NGDC ${ngdc} MB/s (first 50 MB of ETOPO_2022_v1_60s, 60 s cap)"
          if awk -v m="${ngdc}" 'BEGIN{exit !(m < 0.5)}'; then
            mins=$(awk -v m="${ngdc}" 'BEGIN{if(m<=0){print "infinity"}else{printf "%.0f", 933/m/60}}')
            echo "::warning::NGDC serves this box at ${ngdc} MB/s. ETOPO is one"
            echo "933 MB file with NO mirror; at this rate that is ${mins} min."
            echo "Below 0.10 MB/s the builder's own guard aborts it and the"
            echo "static stage REFUSES (it used to publish an all-NaN \`elev\`"
            echo "instead — family7-build #10/#11, 2026-09-14). If this number"
            echo "is under 0.10, run the static stage from a different box, or"
            echo "put the file on the box under ml/cache and use --source-dir."
          fi
          exit 0

      # The builder is stdlib + these. numpy/netCDF4 read every source; xarray
      # for the GLORYS chunks; huggingface_hub pulls the chunks and publishes
      # the result; shapely rasterises the Natural Earth glaciated-areas and
      # lakes polygons into the `sphere` static, the same way
      # scripts/refresh_data.py islands does. If the builder grows a
      # dependency, it is added HERE in the same commit -- a box has no
      # requirements file and an ImportError four hours in is the expensive
      # way to learn about one.
      - name: Install
        run: pip install --quiet numpy netCDF4 xarray huggingface_hub shapely

      # ONE REAL OC-CCI FILE, FETCHED AND OPENED, BEFORE 400 GB IS SPENT.
      # ml/CLAUDE.md 0.3 and 5.16: a precondition that depends only on the
      # inputs must be checked while the inputs are all it has cost you. The
      # expensive half of the colour stage is ~10,000 files and three hours;
      # the cheap half is one ~40 MB file, and it answers every question that
      # can kill the run -- can this box reach the host at all, is the
      # directory listing the shape we parse, is the variable spelled
      # `chlor_a`, is the grid 4320 x 8640 north-first, does 0.25 degrees
      # divide its spacing. MEASURED 2026-09-11: both hosts
      # (www.oceancolour.org, dap.ceda.ac.uk) answer "CONNECT tunnel failed,
      # 403" from the development sandbox's egress proxy, so NONE of the URL
      # shapes in OC_SOURCES could be verified anywhere but here.
      #
      # DEFINITE, THEREFORE FATAL (5.17): if no host will list 2015 and no
      # file will open, the colour stage cannot run and the right answer is to
      # stop now and read the message, which names every host tried and the
      # exact URL it asked for. The GlobColour fallback is a DECISION for the
      # session (E-077 2) -- re-dispatch with extra_args
      # `--oc-source globcolour` -- never an automatic retry, because it is a
      # different merge and would publish a channel nobody chose. Skipped when
      # the dispatch is not going to do colour work at all.
      - name: OC-CCI preflight (one real file)
        if: ${{ (github.event.inputs.stage == '' || github.event.inputs.stage == 'all' || github.event.inputs.stage == 'occci') && !contains(github.event.inputs.extra_args, '--smoke') && !contains(github.event.inputs.extra_args, '--source-dir') }}
        env:
          WORK: ${{ github.event.inputs.work || 'ml/cache/family7_l2' }}
          EXTRA: ${{ github.event.inputs.extra_args }}
          # The preflight first asks whether every pending colour year has a
          # published partial (then CEDA is never read and the check stands
          # down). Listing the Hub needs the token; without it the preflight
          # falls back to fetching one CEDA file, which is what refused #9
          # on 2026-09-14 from a box reading CEDA at 0.2 MB/s. Env, never argv.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p "${WORK}"
          python3 -u ml/build_family7.py --work "${WORK}" --oc-preflight ${EXTRA}

      # The truth series (RAPID, OSNAP, MOVE, SAMBA, Florida Current; ~1.2 MB)
      # are what the `truth` stage writes into the npz, and build_family7.py
      # refuses without them, as build_family4's missing_truth_keys does. The
      # box usually has them already -- ml-train.yml seeds truth/ from the
      # data-cache release -- so this is the fallback for a box that has never
      # run a training job. NOT fatal on its own: the truth stage fails loudly
      # and by name if the files really are absent, and that message is more
      # useful than this step's would be.
      - name: Truth seed
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          dest = pathlib.Path("ml/cache/truth")
          # Count the files the builder READS, not any files: the box already
          # held 47 fc_*.dat files under ml/cache/truth, so a "≥ 4 files"
          # guard passed on run #2 (2026-09-04) while truth_pentad.npz was
          # absent (the 15:30Z fleet check's finding).
          need = ["truth_pentad.npz", "truth_daily.npz"]
          have = [n for n in need if (dest / n).is_file()]
          if len(have) == len(need):
              print(f"truth/ already on the box: {have}")
              raise SystemExit(0)
          from huggingface_hub import HfApi, hf_hub_download
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = f"{api.whoami()['name']}/earth-tensors"
          try:
              files = [f for f in api.list_repo_files(repo, repo_type="dataset")
                       if f.startswith("truth/")]
          except Exception as e:                       # network, auth, 404
              print(f"::warning::could not list {repo}: {e}")
              raise SystemExit(0)
          if not files:
              print(f"::warning::no truth/ folder on {repo} and {len(have)} "
                    f"file(s) in ml/cache/truth -- the truth stage will say "
                    f"which key it is missing")
              raise SystemExit(0)
          dest.mkdir(parents=True, exist_ok=True)
          for f in files:
              p = hf_hub_download(repo, f, repo_type="dataset",
                                  token=os.environ["HF_TOKEN"])
              out = dest / os.path.basename(f)
              out.write_bytes(pathlib.Path(p).read_bytes())
              print(f"  {out} · {out.stat().st_size / 1e3:,.0f} kB")
          print(f"seeded {len(files)} truth file(s) from {repo}")
          PY

      # HF_TOKEN in env, never on the command line: argv is readable by every
      # process on the box and the box's host has root (ml/CLAUDE.md 6).
      # $EXTRA is deliberately unquoted -- it carries whole flags and has to
      # word-split. pipefail because the log is teed: without it `tee`'s exit
      # code (always 0) would become the step's, and a failed build would
      # report success (ml/CLAUDE.md 0.2, and the `| tail` incident in the root
      # CLAUDE.md 1).
      - name: Build
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WORK: ${{ github.event.inputs.work || 'ml/cache/family7_l2' }}
          SEED: ${{ github.event.inputs.seed_from }}
          STAGE: ${{ github.event.inputs.stage || 'all' }}
          EXTRA: ${{ github.event.inputs.extra_args }}
        run: |
          set -o pipefail
          mkdir -p "${WORK}"
          if [ "${SEED}" = "none" ]; then SEED=""; fi
          # `--seed-from` is idempotent: on a resume the three group files are
          # already the same inode as the seed's and it says so and moves on.
          # seed_from=`none` omits the flag entirely and builds all four
          # groups, which is a different and much longer experiment.
          seed_args=""
          if [ -n "${SEED}" ]; then seed_args="--seed-from ${SEED}"; fi
          python3 -u ml/build_family7.py \
              --work "${WORK}" --stage "${STAGE}" ${seed_args} ${EXTRA} \
              2>&1 | tee "${WORK}/build.log"

      # A dead job still tells its story. Everything here is small; the
      # memmaps are not collected and never should be.
      - name: Collect progress and the log tail
        if: always() && steps.preflight.outcome == 'success'
        env:
          WORK: ${{ github.event.inputs.work || 'ml/cache/family7_l2' }}
        run: |
          out="${RUNNER_TEMP}/family7-story"
          rm -rf "${out}"; mkdir -p "${out}"
          [ -f "${WORK}/progress.json" ] && cp "${WORK}/progress.json" "${out}/" \
            || echo "::warning::no ${WORK}/progress.json -- the build did not reach its first phase boundary"
          n=0
          for f in "${WORK}"/*.done; do
            [ -e "${f}" ] || break
            cp "${f}" "${out}/"; n=$((n + 1))
          done
          echo "${n} stage marker(s) collected"
          if [ -f "${WORK}/build.log" ]; then
            tail -n 200 "${WORK}/build.log" > "${out}/build.log.tail"
            echo "--- last 200 lines of the build log ---"
            cat "${out}/build.log.tail"
          else
            echo "::warning::no ${WORK}/build.log"
          fi
          ls -la "${WORK}" || true
          echo "--- disk after the build ---"
          df -h ml/cache

      - name: Upload the story
        if: always() && steps.preflight.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: family7-progress-${{ github.run_number }}
          path: ${{ runner.temp }}/family7-story
          if-no-files-found: warn
          retention-days: 30
