# E-077: reduce ESA OC-CCI daily ocean colour ONE CALENDAR YEAR AT A TIME on
# free hosted runners, and publish each year as a small npz the box's own
# `occci` stage folds instead of streaming the archive again.
#
# WHY THIS EXISTS -- the arithmetic, measured rather than argued. The colour
# stage of ml/build_family7.py walks ~9,980 daily OC-CCI files of ~79 MB each,
# 4 September 1997 to 31 December 2024: about 790 GB. MEASURED 2026-09-13:
# dap.ceda.ac.uk serves ONE CONNECTION at 1.2-1.4 MB/s, and parallel
# connections scale (four parallel range reads aggregated 4.6 MB/s from the
# same host). Sequentially, 790 GB at 1.3 MB/s is 169 hours; even at the
# 4-connection rate it is 48 hours, against the box workflow's own 24 h job
# timeout. There is no box we can rent that changes this, because the limit is
# the host's per-connection rate and not ours.
#
# So the work is split the one way it splits cleanly. Every daily file is read
# ONCE, reduced to two 721x1440 arrays and deleted -- ~29 GB in, ~780 MB out
# per year -- which is exactly what a GitHub-hosted runner can do: 14 GB of
# disk, 7 GB of RAM, a 6 h limit, twenty of them at once and no cost. Twenty
# lanes x 12-18 h of per-lane transfer at 8-12 workers each fits inside 350
# minutes per year. The box then folds 28 npz files (~22 GB of download from
# the Hub at full speed) instead of 790 GB of CEDA.
#
# WHY FOLDING IS EXACT, AND NOT MERELY CLOSE. `acc`, `days_n` and `cells_n` are
# SUMS over days, so a pentad bin that straddles 31 December simply receives a
# contribution from each of the two years' files. The one real hazard is that
# floating-point addition is not associative -- a running sum split at the year
# boundary and re-joined differs in the last bits, and those bits survive into
# the stored float32 -- so the builder makes the YEAR the unit of the
# arithmetic on BOTH paths (`oc_year_reduce` is shared by this workflow's stage
# and by the box's day-by-day fallback) and
# `tests/test_build_family7.py::test_30` asserts the assembled group is
# BIT-IDENTICAL to the sequentially built one, over a fixture containing both a
# bin that straddles 31 December and an archive hole.
#
# THE PARTIALS ARE RE-USABLE. They depend on the source files and on the block
# geometry, and on nothing about the tensor's axis -- so a later rebuild with a
# different --start/--end folds the same files. Run this ONCE for 1997-2024;
# every later family-7.1 build is then a fold, not a stream.
#
# OPERATOR SEQUENCE:
#   1. dispatch this workflow with years = 1997-2024  (28 lanes, <= 6 h each)
#   2. wait for every lane to go green; a failed year is re-dispatched alone
#      (years = 2004), and a year already on the Hub is skipped in one line
#   3. dispatch "Family 7 build" as usual -- its occci stage lists
#      partials/f7l1/occci/ once, folds every year it finds and streams only
#      the years it does not
#
# SECURITY. `workflow_dispatch` ONLY, and `runs-on: ubuntu-latest` only.
# ml/CLAUDE.md 6: never add `pull_request`, `issue_comment`, `workflow_run` or
# `schedule` to any workflow in this repository, and never point a triggered
# workflow at `runs-on: gpu` -- either change would hand code execution on a
# rented box, plus the job token, to anyone who opens a pull request. HF_TOKEN
# reaches the builder as an ENV VAR on the run step and never as a command-line
# argument.
name: OC-CCI per-year partials
run-name: occci partials ${{ github.event.inputs.years || '1997-2024' }}

on:
  workflow_dispatch:
    inputs:
      years:
        description: "which calendar years to reduce: a range like 1997-2024, a list like 2003,2007, or one year. Each year is its own lane; 20 run at once"
        default: "1997-2024"
      workers:
        description: "EARTH_OC_WORKERS -- parallel CEDA downloads per lane. One connection measured 1.2-1.4 MB/s on 2026-09-13 and connections scale; the builder caps files on disk at 3 GB whatever this says"
        default: "12"
      extra_args:
        description: "extra flags for ml/build_family7.py, e.g. --force to rebuild a year already on the Hub, or --no-upload for a dry run. Word-split deliberately"
        default: ""

permissions:
  contents: read          # the partials are published to Hugging Face

concurrency:
  # One wave at a time, never cancelled: a cancelled lane loses up to six hours
  # of transfer whose only durable record is the npz it has not written yet.
  group: occci-partials
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ plan --
  # Expand "1997-2024" / "2003,2007" into the JSON array the matrix needs. It
  # is the SAME parser the builder uses (`build_family7.parse_years`), imported
  # rather than re-implemented, so a range that this step accepts is a range
  # `--years` accepts and there is no second definition to drift.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      years: ${{ steps.expand.outputs.years }}
      count: ${{ steps.expand.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      # build_family7 needs numpy at module scope and nothing else to expose
      # its year parser; importing the real one is what stops this step from
      # becoming a second definition of what "1997-2024" means.
      - name: Install
        run: pip install --quiet numpy
      - name: Expand the year list
        id: expand
        env:
          YEARS: ${{ github.event.inputs.years || '1997-2024' }}
        run: |
          set -o pipefail
          python3 - <<'PY' | tee -a "${GITHUB_OUTPUT}"
          import json, os, sys
          sys.path.insert(0, "ml")
          from build_family7 import parse_years, OC_START, END
          ys = parse_years(os.environ["YEARS"])
          if not ys:
              raise SystemExit("::error::years expanded to nothing")
          lo, hi = OC_START.year, END.year
          out = [y for y in ys if lo <= y <= hi]
          skipped = [y for y in ys if y not in out]
          if skipped:
              # stderr, NOT stdout: stdout is teed into $GITHUB_OUTPUT and a
              # workflow-command line in there is a malformed output file.
              print(f"::warning::{skipped} is outside the colour record "
                    f"({lo}-{hi}) and was dropped", file=sys.stderr)
          if not out:
              raise SystemExit(f"::error::no requested year is inside {lo}-{hi}")
          print(f"years={json.dumps(out)}")
          print(f"count={len(out)}")
          PY

  # ------------------------------------------------------------- the lanes --
  partial:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350          # the hosted limit is 360; leave the upload room
    strategy:
      max-parallel: 20            # the free concurrency ceiling for this account
      fail-fast: false            # one bad year must not cancel twenty good ones
      matrix:
        year: ${{ fromJSON(needs.plan.outputs.years) }}
    steps:
      - uses: actions/checkout@v4

      # numpy and netCDF4 read every daily file; huggingface_hub publishes the
      # partial and downloads it back to verify it. Nothing else -- no xarray,
      # no shapely: this stage touches neither GLORYS nor the statics, and a
      # hosted runner's pip install is on the clock.
      - name: Install
        run: pip install --quiet numpy netCDF4 huggingface_hub

      # MEASURE THE HOST BEFORE THE LANE SPENDS SIX HOURS ON IT, and print the
      # arithmetic. This step does NOT refuse: a slow reading is a number in
      # the log the next dispatch can act on, and CEDA has no mirror to fall
      # back to, so a refusal here would only cost the year that might still
      # have finished. `continue-on-error` plus a trailing `exit 0` means a
      # curl that hangs cannot take the lane with it.
      - name: CEDA throughput (one file, 50 MB, 60 s cap)
        continue-on-error: true
        run: |
          url="https://dap.ceda.ac.uk/neodc/esacci/ocean_colour/data/v6.0-release/geographic/netcdf/chlor_a/daily/v6.0/2015/ESACCI-OC-L3S-CHLOR_A-MERGED-1D_DAILY_4km_GEO_PML_OCx-20150702-fv6.0.nc"
          t0=$(date +%s.%N)
          got=$(curl -sS --max-time 60 -r 0-52428799 -o /dev/null \
                  -w '%{size_download}' "${url}" || echo 0)
          t1=$(date +%s.%N)
          rate=$(awk -v b="${got}" -v a="${t0}" -v z="${t1}" \
                 'BEGIN{d=z-a; if(d<=0)d=0.001; printf "%.2f", b/1000000/d}')
          echo "::notice::CEDA ${rate} MB/s per connection from this runner (${got} bytes)"
          # ~365 files x ~79 MB is ~29 GB for one year; W workers scale it.
          awk -v m="${rate}" -v w="${WORKERS:-12}" 'BEGIN{
            if (m <= 0) { print "::warning::CEDA returned nothing in 60 s — the lane will find out the slow way"; exit }
            printf "::notice::one year is ~29,000 MB; at %.2f MB/s x %d workers that is %.1f h of transfer against a 5.8 h job limit\n", m, w, 29000/(m*w)/3600
            if (29000/(m*w)/3600 > 5.0)
              printf "::warning::this lane is unlikely to finish inside the timeout; raise the workers input or re-dispatch the year — a resumed year restarts from its first file\n"
          }'
          exit 0
        env:
          WORKERS: ${{ github.event.inputs.workers || '12' }}

      # HF_TOKEN in env, never on the command line: argv is world-readable.
      # $EXTRA is deliberately unquoted -- it carries whole flags and has to
      # word-split. pipefail because the log is teed: without it tee's exit
      # code (always 0) would become the step's, and a failed reduction would
      # report success (ml/CLAUDE.md 0.2).
      - name: Reduce ${{ matrix.year }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EARTH_OC_WORKERS: ${{ github.event.inputs.workers || '12' }}
          # The fetch throughput guard (ml/build_family3.py) defaults to a
          # 1 MB/s floor PER CONNECTION, sized for the 0.17 MB/s PSL crawl it
          # was written against. This lane deliberately opens 12 connections
          # per job and 28 jobs at once, and CEDA shares itself out: on the
          # first run (2026-09-14, run 34814440764) the preflight measured
          # 7.66 MB/s on a lone connection, then 10 of the first 14 lanes died
          # with every file "slow transfer aborted: 0.737 MB/s ... floor 1.00"
          # after four attempts, while 1997 (a third of a year, 400 s) sailed
          # through. 0.7 MB/s x 12 workers is ~8 MB/s per lane, an hour a
          # year, well inside the limit -- that is a shared host, not a
          # crawling one. 0.25 still catches the crawl the guard exists for.
          EARTH_FETCH_MIN_RATE_MBPS: "0.25"
          EXTRA: ${{ github.event.inputs.extra_args }}
          WORK: ml/cache/family7_l1
        run: |
          set -o pipefail
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::HF_TOKEN secret is not set. This lane publishes its"
            echo "year to the Hub and verifies the restore; without it the job"
            echo "would spend up to six hours and have nowhere to put the"
            echo "result. Settings -> Secrets and variables -> Actions; the"
            echo "value is in claude/huggingface-access.md."
            exit 1
          fi
          mkdir -p "${WORK}"
          df -h "${WORK}"
          python3 -u ml/build_family7.py \
              --work "${WORK}" --stage occci-partial \
              --years ${{ matrix.year }} ${EXTRA} \
              2>&1 | tee "${WORK}/occci-partial-${{ matrix.year }}.log"

      # A dead lane still tells its story (ml/CLAUDE.md 5.25/5.26). Everything
      # collected here is small: progress.json, the log tail, and a listing of
      # the partials directory. The npz files themselves are NOT collected --
      # they are on the Hub, verified by restore, which is the durable copy.
      - name: Collect progress
        if: always()
        env:
          WORK: ml/cache/family7_l1
          Y: ${{ matrix.year }}
        run: |
          out="${RUNNER_TEMP}/occci-partial-story"
          rm -rf "${out}"; mkdir -p "${out}"
          if [ -f "${WORK}/progress.json" ]; then
            cp "${WORK}/progress.json" "${out}/progress-${Y}.json"
          else
            echo "::warning::no ${WORK}/progress.json — the lane did not reach its first day"
            printf '{"stage":"occci-partial","item":"no progress written","year":%s}\n' "${Y}" \
              > "${out}/progress-${Y}.json"
          fi
          if [ -f "${WORK}/occci-partial-${Y}.log" ]; then
            tail -n 200 "${WORK}/occci-partial-${Y}.log" > "${out}/build-${Y}.log.tail"
            echo "--- last 200 lines ---"
            cat "${out}/build-${Y}.log.tail"
          fi
          ls -la "${WORK}/occci_partial" 2>/dev/null > "${out}/listing-${Y}.txt" || true
          cat "${out}/listing-${Y}.txt" || true
          df -h "${WORK}" || true

      - name: Upload the story
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occci-partial-${{ matrix.year }}-${{ github.run_number }}
          path: ${{ runner.temp }}/occci-partial-story
          if-no-files-found: warn
          retention-days: 30
