# E-082: build a FAMILY 1 TIER-P STORE (families 1.gf, 1.0.tf, 0.9.tf) -- the
# fine-granularity observation stores: weather stations, tide gauges, buoys,
# radiosondes, ship reports, ocean profiles -- or PROBE one month of one.
#
# WHAT IT RUNS. `ml/build_family1_stores.py --store <store>`, which is family
# 10's builder by import (ml/build_family10_stores.py) plus the family-1
# registry (ml/family1/adapters/), the two-track publish and the probe. The
# plan is ml/plans/E082_family1_builds.md; the adapter interface is
# ml/family1/ADAPTER_CONTRACT.md.
#
# TWO KINDS OF DISPATCH.
#   stage=probe, probe_month=YYYY-MM   index + ONE calendar month through the
#       real adapter on a hosted runner. Writes
#       <work>/probe/<store>/<YYYY-MM>.json (rows, rows per day, distinct
#       platforms, NaN fraction and out-of-bounds count per channel, bytes
#       fetched, wall seconds, bytes per row) and uploads it as the Actions
#       artifact `probe-<store>-<YYYY-MM>`. No full build is dispatched without
#       one (E-082 §1.2).
#   stage=all | index,fetch,assemble,publish,check (a comma list)   a build.
#       A hosted lane fetches years (extra_args=--push-parts parks each marked
#       year under partials/<family>/<store>/<year>/ on the Hub); a box
#       assembles them (extra_args=--parts-from-hub) and publishes.
#   stage=publish, extra_args=--verify-hub   the publish's RESTORE CHECK ONLY,
#       for a tier-P store already on the Hub, from a box that does not hold
#       it: every file the Hub's store.json names is downloaded back and
#       hashed, then manifest.json is written and uploaded -- nothing else.
#       No fetch or assemble stage is needed on that box. Added 2026-09-24
#       after the swot upload finished from a Singapore box whose restore ran
#       at < 8 MB/s (family1-build #734); pass a fast box as `runner`.
#
# LANES -- MORE THAN ONE RUNNER FOR ONE YEAR (E-082 wave 7). A lane is one
# hosted runner: six hours and ~86 GB. Some stores need several per year (a
# year of ICESat-2's ATL08 is 35 h of fetching, lai500 is 17.6 h, canopy30 is
# one bin over 261 tiles). The LANE NAME IS DERIVED FROM start/end AND FROM
# THE ADAPTER'S GROUP SUBSET, so THERE IS NO NEW WORKFLOW INPUT: a dispatch
# whose window is one calendar month writes lane `m06`, one calendar quarter
# writes `q3`, any other window writes `d0701-0930`, and a tier-G adapter
# restricted by its own environment knob (CANOPY30_TILES, LOSSYEAR_TILES)
# writes `g-<hash>`. A whole-year window with no group subset is the UNNAMED
# lane and writes what it always wrote. A named lane parks its parts under
# partials/<family>/<store>/<year>/<lane>/ and pushes only that folder, so
# twelve lanes of one year never overwrite each other.
#
#   THE FORM, twelve monthly lanes of ICESat-2 2022 and their assembly:
#     twelve dispatches, one per month, each
#       {"store":"icesat2","stage":"index,fetch",
#        "start":"2022-06-01","end":"2022-06-30",
#        "extra_args":"--push-parts","adapter_env":"ICESAT2_FETCH=whole"}
#     then ONE assembly (a box, because parts + store is ~150 GB)
#       {"store":"icesat2","stage":"all","runner":"gpu-box-NNNNN",
#        "start":"2022-01-01","end":"2022-12-31",
#        "extra_args":"--parts-from-hub --lanes months --assemble streaming"}
#   Four quarter-lanes of lai500 2020 are the same with
#   start/end 2020-01-01..2020-03-31 (lane q1) and so on, and
#   `--lanes quarters` on the assembly. Tile-subset lanes of canopy30 pass
#   adapter_env=CANOPY30_TILES=<a few tile names> and the whole-year window.
#
#   `--lanes months|quarters|<comma list>` in extra_args DECLARES which lanes
#   each year is expected to have (it is written into plan.json at `index`).
#   The assembler then REFUSES a year whose declared lanes did not all arrive,
#   unless --allow-missing-years names the degrade -- and then store.json
#   records the missing lanes BY NAME. Without a declaration the assembler
#   takes the lanes it finds and warns that nothing said the year was whole.
#   Details: ml/family1/ADAPTER_CONTRACT.md, section "Lanes".
#
# CREDENTIALS (ml/CLAUDE.md 6). The source credentials -- Earthdata, FIRMS,
# FLUXNET, Copernicus Marine -- reach GITHUB-HOSTED runners only: every one of
# them is gated on `runner == ubuntu-latest` in the env blocks below, so a
# rented box receives an empty string. HF_TOKEN and HF_PRIVATE_TOKEN are NOT
# gated, because the box that assembles is the box that publishes (the same
# as family10-build.yml's HF_TOKEN). A private adapter publishes to
# chfrank/earth-tensors-private only; the builder refuses any other target.
# The Earthdata .netrc is written on hosted runners only, mode 600, and
# deleted by an always() step at the end. No secret is ever interpolated into
# a run: block (tests/test_workflow_config.py case 7's rule, and
# tests/test_build_family1_stores.py's).
#
# THE EARTHDATA LOGIN CHECK (check_credentials=true, store may be empty): no
# build at all -- `ml/build_family1_stores.py --check-credentials` makes one
# authenticated request to LP DAAC, GES DISC and PO.DAAC and prints, per
# archive, the HTTP status, whether Earthdata Login answered with an
# application-approval or EULA page, the bytes received and the exact URL to
# open. It fails the job only on a definite refusal. Hosted runner only.
#
# TIER T (E-082 wave 3): the eight SCENE CATALOGUE stores (cat_landsat,
# cat_hls, cat_s2, cat_s1, cat_nisar, cat_olci, cat_viirs, cat_ecostress) are
# ordinary tier-P stores whose source is a listing API rather than a file
# archive, and they publish one extra file beside their nine arrays --
# `assets.parquet`, the table that maps a row's hashed scene id back to the
# producer's own identifier and download urls. That is why the install step
# carries `pyarrow`. None of the eight needs an account: every listing
# endpoint (USGS landsatlook, NASA CMR, ASF, the Copernicus Data Space OData
# API) answers anonymously, so these stores run with no credential at all.
#
# TIER G (E-082 wave 2): a sharded gridded store (seaice_asi, lossyear,
# chirps05) runs through the same five stages; its parts are zstd shards,
# pushed and pulled like tier-P parts. A public store whose licence is
# unconfirmed needs extra_args=--allow-unconfirmed-licence to publish or push
# parts. The install step carries `rasterio` because the two GeoTIFF sources
# (Hansen Global Forest Change, CHIRPS) are read with it, and `adapter_env`
# hands a tier-G adapter the environment knobs it reads at construction time
# -- LOSSYEAR_TILES is the one a probe needs, because the lossyear store has
# 4,480 groups and a probe measures five tiles of it. That input is guarded:
# a name that is not a plain upper-case identifier, or one in a credential's
# namespace, is a refusal, and every pair is echoed into the log.
#
# TIER G (E-082 wave 4): the three MODIS Climate Modeling Grid fields (lst05,
# snow05, refl05) are HDF-EOS2 (HDF4) files, and rasterio's GDAL has NO HDF4
# driver (measured in the sandbox: 155 drivers, HDF5 and netCDF among them, no
# HDF4), so the install step also carries `pyhdf`, whose manylinux wheel
# bundles the HDF4 library. It carries `scipy` too, for the nearest-shoreline
# search that makes `static_fine`'s dist_coast. Their adapter_env knobs are
# LST05_GROUPS / SNOW05_GROUPS / REFL05_GROUPS (which satellite's group to
# build) and STATIC_FINE_FIELDS (which of the static store's fields to build).
#
# THE TWO ORBITAL LiDARs (E-082 wave 6): `gedi` and `icesat2` are tier-P
# stores whose granules are HDF5 (Hierarchical Data Format version 5), so the
# install step also carries `h5py` -- rasterio's GDAL has an HDF5 driver but
# these are group-structured swath files, not rasters. Both READ ONLY THE
# DATASETS THEY NEED, over HTTP byte ranges, because one month of GEDI's three
# products is 2.58 TB native and one month of ATL08 is 376 GB (both measured
# on NASA's Common Metadata Repository, 2026-09-20). Both also carry a SIZE
# GATE: every stage past `probe` refuses a window crossing a calendar-year
# boundary unless GEDI_ALLOW_BUILD=1 / ICESAT2_ALLOW_BUILD=1 is passed through
# `adapter_env`, because phase A builds one year (2022) and the probe's
# measured rows and bytes decide the rest. Their other adapter_env knobs are
# GEDI_L4A_VERSION (3 or 2.1), GEDI_FETCH / ICESAT2_FETCH (range or whole) and
# GEDI_MAX_GRANULES / ICESAT2_MAX_GRANULES (how many granules one call reads).
#
# workflow_dispatch ONLY. The `runner` input can point this at a rented box;
# a pull_request / schedule trigger here would hand that box to anyone who
# opens a PR (ml/CLAUDE.md 6). 9 inputs of the 25 GitHub allows.
name: Family 1 build (tier-P observation stores, E-082)
run-name: family1 ${{ github.event.inputs.check_credentials == 'true' && 'check-credentials' || github.event.inputs.store }} ${{ github.event.inputs.check_credentials != 'true' && (github.event.inputs.stage || 'all') || '' }} ${{ github.event.inputs.check_credentials != 'true' && github.event.inputs.stage != 'probe' && format('{0}..{1}', github.event.inputs.start || 'first', github.event.inputs.end || '2024-12-31') || '' }} ${{ github.event.inputs.probe_month }} ${{ github.event.inputs.runner != 'ubuntu-latest' && github.event.inputs.runner || '' }}

on:
  workflow_dispatch:
    inputs:
      store:
        description: "WHICH STORE -- a module name in ml/family1/adapters/ (ghcnd = GHCN-Daily station-days, 1763->, CC0, public; seaice_asi = Bremen daily 6.25 km sea ice, sharded tier G). The builder refuses a name that is not in the registry, before any fetch. May be empty only with check_credentials"
        required: false
        default: ""
        type: string
      stage:
        description: "probe (with probe_month: index + one month, measured) | all (= index,fetch,assemble,publish,check) | a comma list of those. Order is fixed"
        default: "all"
      start:
        description: "first day, YYYY-MM-DD. Empty = the adapter's first year. Ignored by stage=probe"
        default: ""
      end:
        description: "last day, YYYY-MM-DD. Ignored by stage=probe"
        default: "2024-12-31"
      runner:
        description: "runner label. ubuntu-latest (default) for probes and fetch lanes; a Vast box's runner name (gpu-box-NNNNN) to assemble a big store from Hub parts -- a box never receives a source credential, so pass extra_args=--parts-from-hub there"
        default: "ubuntu-latest"
      extra_args:
        description: "extra flags for ml/build_family1_stores.py: --push-parts (a hosted lane parks its years on the Hub), --parts-from-hub (a box assembles from them), --lanes months|quarters|<comma list> (DECLARE which lanes each year is fetched by; the assembler then refuses a year missing one), --allow-missing-years, --assemble streaming|memory|auto, --qc-keep N, --attempts N, --force, --verify-hub (with stage=publish: restore-verify a tier-P store already on the Hub and write its manifest; no local store, nothing else uploaded). The work directory is the adapter's default (ml/cache/family1_<x>; on a box, /opt/earth-cache). Word-split deliberately"
        default: ""
      probe_month:
        description: "YYYY-MM -- the month stage=probe measures (required for a probe, ignored otherwise)"
        default: ""
      adapter_env:
        description: "NAME=VALUE pairs, space-separated, exported for the build step only -- the knobs a tier-G adapter reads from the environment (e.g. LOSSYEAR_TILES=00N_060W,00N_020E,00N_110E,70N_100E,00N_180W to probe five tiles of a 4,480-group store instead of all 280). Names must match [A-Z][A-Z0-9_]* and may not begin with HF_, GITHUB_, EARTHDATA_, FIRMS_, FLUXNET_ or COPERNICUS -- a credential is never settable from a dispatch input. Every pair is echoed into the log, so nothing secret belongs here"
        default: ""
      check_credentials:
        description: "true = build nothing; check the Earthdata Login account against LP DAAC, GES DISC and PO.DAAC (hosted runner only) and print what each archive answered"
        type: boolean
        default: false
      free_cache:
        description: "self-hosted box only: comma-separated <family1_x>/<store> work directories under the box's persistent cache (/opt/earth-cache) to DELETE before the build, e.g. family1_gf/oc4k,family1_gf/swh. Each is deleted only if it carries publish.done AND check.done -- the store is on the Hub and verified -- and the step refuses otherwise. This is how a box with a 420 GB disk assembles a fourth 150 GB store after three published ones (lst05 #292 died on ENOSPC behind oc4k and swh, 2026-09-20)"
        default: ""

permissions:
  contents: write

# The group carries the lane's WINDOW (start, end): E-082's big stores fetch
# on up to a dozen hosted lanes of one store at once, each a disjoint year
# range writing its own partials/<family>/<store>/<year>/ prefixes, and a group
# keyed on store + stage alone would queue them one behind another -- and
# GitHub keeps only ONE pending run per group, cancelling the older pending
# lane each time a new one is dispatched. Two dispatches with the SAME window
# still serialise, which is the collision that matters.
concurrency:
  # The key names the WORK, so two dispatches of the same work queue behind
  # each other and different work runs side by side. `adapter_env` is part of
  # the work: a tile-subset lane (`CANOPY30_TILES=...`) or a sensor group
  # (`LST05_GROUPS=...`) with the same window is a different lane, and on
  # 2026-09-20 fourteen canopy30 tile lanes with one window cancelled each
  # other down to one because the key did not know it. A group name is
  # limited in length and in characters, so the env goes in as its hash.
  group: family1-build-${{ github.event.inputs.store }}-${{ github.event.inputs.stage }}-${{ github.event.inputs.start }}-${{ github.event.inputs.end }}-${{ github.event.inputs.probe_month }}-${{ github.event.inputs.check_credentials }}-${{ github.event.inputs.adapter_env }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4

      - name: Persistent data cache (self-hosted box only)
        if: ${{ github.event.inputs.runner != 'ubuntu-latest' && github.event.inputs.runner != '' }}
        run: |
          mkdir -p /opt/earth-cache
          rm -rf ml/cache
          ln -s /opt/earth-cache ml/cache

      - name: Free published stores from the persistent cache (self-hosted box only)
        if: ${{ github.event.inputs.free_cache != '' && github.event.inputs.runner != 'ubuntu-latest' && github.event.inputs.runner != '' }}
        env:
          FREE_CACHE: ${{ github.event.inputs.free_cache }}
        run: |
          # A published, verified store's work directory is re-derivable
          # from the Hub (its parts AND its store are there, byte-identical),
          # so it is the one thing on a box that is safe to delete -- and the
          # marker is the proof, not the run colour (ml/CLAUDE.md §0.2).
          # publish.done is written only after every file was downloaded back
          # from the Hub and hashed against store.json (plus decoded tiles and
          # HTTP range reads), so it alone proves the Hub copy. check.done is
          # the on-demand full-decode `check` stage (2026-09-23: `stage=all`
          # stops at publish for a tier-G store; the full decode is hours on a
          # box rented by the hour) and is reported when present, not required.
          IFS=',' read -ra items <<< "${FREE_CACHE}"
          for it in "${items[@]}"; do
            it="${it// /}"
            [ -z "${it}" ] && continue
            case "${it}" in
              family1_*/[a-z0-9_]*) ;;
              *) echo "::error::free_cache: '${it}' is not <family1_x>/<store>"; exit 1 ;;
            esac
            d="/opt/earth-cache/${it}"
            if [ ! -d "${d}" ]; then echo "free_cache: ${d} is not there -- nothing to free"; continue; fi
            if [ ! -f "${d}/publish.done" ]; then
              echo "::error::free_cache: ${d} has no publish.done -- not a published-and-restored store; refusing to delete it"
              exit 1
            fi
            echo "free_cache: ${it} published $(cat "${d}/publish.done") checked $(cat "${d}/check.done" 2>/dev/null || echo '(check stage not run)')"
            du -sh "${d}" || true
            rm -rf "${d}"
            echo "freed ${d}"
          done
          df -h /opt/earth-cache

      - name: Install
        run: |
          # A STORE'S ARRAYS MUST BE BYTE-IDENTICAL ACROSS MACHINES
          # (ml/family1/ADAPTER_CONTRACT.md, "Reproducibility"). zstandard is
          # PINNED: 0.23.0 bundles zstd 1.5.6, and 0.25.0 compresses ~10 % of
          # level-15 tiles to different bytes (measured 2026-09-23 against the
          # published oc4k shards). numpy's AVX-512 path is disabled in the
          # build step's env for the same reason.
          pip install --quiet numpy huggingface_hub "zstandard==0.23.0" netCDF4 requests rasterio pyhdf scipy pyarrow h5py
          python3 -c "import importlib.metadata as m, numpy, huggingface_hub, zstandard, netCDF4, requests, rasterio, scipy, pyhdf.SD, pyarrow, h5py; print('deps ok', rasterio.__version__, rasterio.__gdal_version__, 'pyhdf', m.version('pyhdf'), 'scipy', scipy.__version__, 'pyarrow', pyarrow.__version__, 'h5py', h5py.__version__)"

      - name: Earthdata Login check (hosted runner only)
        if: ${{ github.event.inputs.check_credentials == 'true' }}
        env:
          EARTHDATA_USERNAME: ${{ (github.event.inputs.runner == 'ubuntu-latest' || github.event.inputs.runner == '') && secrets.EARTHDATA_USERNAME || '' }}
          EARTHDATA_PASSWORD: ${{ (github.event.inputs.runner == 'ubuntu-latest' || github.event.inputs.runner == '') && secrets.EARTHDATA_PASSWORD || '' }}
          RUNNER_INPUT: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
        run: |
          set -uo pipefail
          if [ "${RUNNER_INPUT}" != "ubuntu-latest" ]; then
            echo "::error::check_credentials runs on a GitHub-hosted runner only (runner=${RUNNER_INPUT}); a rented box never receives Earthdata credentials"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/earthdata"
          rc=0
          python3 -u ml/build_family1_stores.py --check-credentials \
              --check-credentials-out "${RUNNER_TEMP}/earthdata/earthdata_check.json" || rc=$?
          echo "earthdata check exited ${rc}"
          exit $rc

      - name: Upload the Earthdata report
        if: ${{ always() && github.event.inputs.check_credentials == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: earthdata-check-${{ github.run_number }}
          path: ${{ runner.temp }}/earthdata
          if-no-files-found: warn
          retention-days: 30

      - name: Preflight
        id: preflight
        if: ${{ github.event.inputs.check_credentials != 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_PRIVATE_TOKEN: ${{ secrets.HF_PRIVATE_TOKEN }}
          STORE: ${{ github.event.inputs.store }}
          STAGE: ${{ github.event.inputs.stage || 'all' }}
          PROBE_MONTH: ${{ github.event.inputs.probe_month }}
          RUNNER_INPUT: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
          EXTRA: ${{ github.event.inputs.extra_args }}
        run: |
          set -euo pipefail
          echo "store=${STORE} stage=${STAGE} probe_month=${PROBE_MONTH:-} runner=${RUNNER_NAME:-?}"
          # The store must be in the registry, and the registry must import:
          # a broken adapter module refuses here, not an hour in.
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "ml")
          import build_family1_stores as b
          s = os.environ["STORE"]
          if not s:
              sys.exit("::error::store is empty -- name a store, or dispatch with check_credentials=true")
          if s not in b.REGISTRY:
              sys.exit(f"::error::store {s!r} is not in ml/family1/adapters/ "
                       f"(registry: {sorted(b.REGISTRY)})")
          ad = b.REGISTRY[s]()
          lay = b.layout_for(ad)
          info = {"store": s, "family": lay.family, "distribution": ad.distribution,
                  "repo": lay.repo_id, "prefix": lay.prefix(s),
                  "work": os.path.relpath(b.default_work(ad)),
                  "credentials": list(ad.credentials)}
          print(json.dumps(info))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"work={info['work']}\n")
              fh.write(f"distribution={ad.distribution}\n")
              fh.write(f"credentials={' '.join(ad.credentials)}\n")
          PY
          fail=0
          if [ "${STAGE}" = "probe" ]; then
            if ! printf '%s' "${PROBE_MONTH}" | grep -Eq '^[0-9]{4}-(0[1-9]|1[0-2])$'; then
              echo "::error::stage=probe needs probe_month=YYYY-MM (got '${PROBE_MONTH}')"
              fail=1
            fi
          fi
          case ",${STAGE}," in
            *,publish,*|*,all,*)
              if [ -z "${HF_TOKEN}" ] && [ -z "${HF_PRIVATE_TOKEN}" ]; then
                echo "::error::stage ${STAGE} publishes and neither HF_TOKEN nor HF_PRIVATE_TOKEN is set"
                fail=1
              fi ;;
          esac
          case "${EXTRA}" in
            *--push-parts*)
              if [ -z "${HF_TOKEN}" ] && [ -z "${HF_PRIVATE_TOKEN}" ]; then
                echo "::error::--push-parts needs a Hugging Face token"
                fail=1
              fi ;;
          esac
          if [ "${RUNNER_INPUT}" != "ubuntu-latest" ] && [ -n "${RUNNER_INPUT}" ]; then
            case "${STAGE}" in
              probe)
                echo "::error::a probe fetches the source and belongs on a hosted runner"
                fail=1 ;;
            esac
          fi
          [ "${fail}" = "1" ] && exit 1
          echo "preflight ok"

      - name: Earthdata .netrc (hosted runner only)
        if: ${{ github.event.inputs.runner == 'ubuntu-latest' || github.event.inputs.runner == '' }}
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          set -eu
          if [ -z "${EARTHDATA_USERNAME}" ] || [ -z "${EARTHDATA_PASSWORD}" ]; then
            echo "::notice::EARTHDATA_USERNAME / EARTHDATA_PASSWORD are not set -- no .netrc written (only Earthdata stores need it)"
            exit 0
          fi
          umask 077
          printf 'machine urs.earthdata.nasa.gov login %s password %s\n' \
            "${EARTHDATA_USERNAME}" "${EARTHDATA_PASSWORD}" > "${HOME}/.netrc"
          chmod 600 "${HOME}/.netrc"
          mode=$(stat -c '%a' "${HOME}/.netrc")
          [ "${mode}" = "600" ] || { echo "::error::.netrc mode is ${mode}, not 600"; exit 1; }
          echo ".netrc written for urs.earthdata.nasa.gov (mode ${mode})"

      - name: Build or probe
        if: ${{ github.event.inputs.check_credentials != 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_PRIVATE_TOKEN: ${{ secrets.HF_PRIVATE_TOKEN }}
          EARTHDATA_USERNAME: ${{ (github.event.inputs.runner == 'ubuntu-latest' || github.event.inputs.runner == '') && secrets.EARTHDATA_USERNAME || '' }}
          EARTHDATA_PASSWORD: ${{ (github.event.inputs.runner == 'ubuntu-latest' || github.event.inputs.runner == '') && secrets.EARTHDATA_PASSWORD || '' }}
          FIRMS_MAP_KEY: ${{ (github.event.inputs.runner == 'ubuntu-latest' || github.event.inputs.runner == '') && secrets.FIRMS_MAP_KEY || '' }}
          FLUXNET_USERNAME: ${{ (github.event.inputs.runner == 'ubuntu-latest' || github.event.inputs.runner == '') && secrets.FLUXNET_USERNAME || '' }}
          FLUXNET_PASSWORD: ${{ (github.event.inputs.runner == 'ubuntu-latest' || github.event.inputs.runner == '') && secrets.FLUXNET_PASSWORD || '' }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ (github.event.inputs.runner == 'ubuntu-latest' || github.event.inputs.runner == '') && secrets.COPERNICUSMARINE_SERVICE_USERNAME || '' }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ (github.event.inputs.runner == 'ubuntu-latest' || github.event.inputs.runner == '') && secrets.COPERNICUSMARINE_SERVICE_PASSWORD || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          # THE CLASSIC LFS UPLOAD PATH, NOT XET. Measured 2026-09-18 on one
          # rented box: ghcnd's 46.91 GB published first time, and icoads'
          # 52.07 GB timed out inside `_upload_xet_files` ->
          # `session.new_upload_commit` on every attempt of two runs (#91 as
          # one commit, #92 in batches of three files), 63 and 75 minutes of
          # backoff, while a 1 KB commit to the SAME repository from the
          # sandbox returned 200 in 1.0 s -- so the repository was healthy and
          # the Xet content-addressed uploader was not. Classic LFS is the
          # path family 10.1's 67 GB slatrack store went up by.
          HF_HUB_DISABLE_XET: "1"
          # NUMPY ON THE AVX2 PATH, WHATEVER THE HOST'S CPU. numpy's AVX-512
          # log10 differs from the AVX2 one by one float16 step in 950 of
          # 18.9 M values (measured 2026-09-23), and pace4k stores a
          # logarithm, so an AVX-512 box wrote different bytes from the same
          # source. ml/family1/ADAPTER_CONTRACT.md, "Reproducibility".
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
          STORE: ${{ github.event.inputs.store }}
          STAGE: ${{ github.event.inputs.stage || 'all' }}
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end || '2024-12-31' }}
          EXTRA: ${{ github.event.inputs.extra_args }}
          PROBE_MONTH: ${{ github.event.inputs.probe_month }}
          ADAPTER_ENV: ${{ github.event.inputs.adapter_env }}
          WORK: ${{ steps.preflight.outputs.work }}
          LIVE_BRANCH: ml-live-f1-${{ github.event.inputs.store }}-${{ github.run_number }}
        run: |
          set -o pipefail
          # ADAPTER KNOBS, ONE AT A TIME AND ALL OF THEM PRINTED. A tier-G
          # adapter can be asked for a subset of its groups (the lossyear
          # probe cannot fetch all 280 Hansen tiles) and the mechanism is an
          # environment variable it reads at construction time. The guard
          # below is the whole security of it: a name that is not a plain
          # upper-case identifier, or one in a credential's namespace, is a
          # REFUSAL rather than an export.
          for kv in ${ADAPTER_ENV}; do
            name="${kv%%=*}"
            val="${kv#*=}"
            if ! printf '%s' "${name}" | grep -Eq '^[A-Z][A-Z0-9_]*$'; then
              echo "::error::adapter_env: ${name} is not a plain upper-case name"
              exit 1
            fi
            case "${name}" in
              HF_*|GITHUB_*|EARTHDATA_*|FIRMS_*|FLUXNET_*|COPERNICUS*)
                echo "::error::adapter_env may not set ${name} -- credentials come from repository secrets only (ml/CLAUDE.md 6)"
                exit 1 ;;
            esac
            if [ "${name}" = "${kv}" ]; then
              echo "::error::adapter_env: ${kv} is not NAME=VALUE"
              exit 1
            fi
            export "${name}=${val}"
            echo "::notice::adapter env ${name}=${val}"
          done
          mkdir -p "${WORK}/${STORE}"
          LOG="${WORK}/${STORE}/build.log"
          : > "${LOG}"
          ship() {
            tail -n 80 "${LOG}" > "${RUNNER_TEMP}/log_tail.txt" 2>/dev/null || true
            bash scripts/publish_live_files.sh "${LIVE_BRANCH}" \
                 "${WORK}/${STORE}/progress.json" \
                 "${WORK}/${STORE}/plan.json" \
                 "${RUNNER_TEMP}/log_tail.txt" || echo "::warning::live ship failed (best-effort; the build continues)"
          }
          if [ "${STAGE}" = "probe" ]; then
            ARGS="--stage probe --probe-month ${PROBE_MONTH} --work ${WORK}"
          else
            ARGS="--stage ${STAGE} --work ${WORK} --end ${END}"
            [ -n "${START}" ] && ARGS="${ARGS} --start ${START}"
          fi
          python3 -u ml/build_family1_stores.py --store "${STORE}" ${ARGS} ${EXTRA} \
              > "${LOG}" 2>&1 &
          BUILD_PID=$!
          tail -f -n +1 "${LOG}" &
          TAIL_PID=$!
          TICK=0
          while kill -0 $BUILD_PID 2>/dev/null; do
            sleep 30
            TICK=$((TICK + 1))
            if [ $((TICK % 6)) -eq 0 ]; then ship; fi
          done
          rc=0
          wait $BUILD_PID || rc=$?
          sleep 2
          kill $TAIL_PID 2>/dev/null || true
          ship
          if [ "${STAGE}" = "probe" ]; then
            P="${WORK}/probe/${STORE}/${PROBE_MONTH}.json"
            if [ ! -s "${P}" ]; then
              echo "::error::the probe wrote no ${P}"
              rc=1
            else
              mkdir -p "${RUNNER_TEMP}/probe"
              cp "${P}" "${RUNNER_TEMP}/probe/"
            fi
          fi
          echo "build exited ${rc}"
          exit $rc

      - name: Upload the probe
        if: ${{ always() && github.event.inputs.stage == 'probe' && steps.preflight.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.event.inputs.store }}-${{ github.event.inputs.probe_month }}
          path: ${{ runner.temp }}/probe
          if-no-files-found: error
          retention-days: 90

      - name: Collect progress and the log tail
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        env:
          STORE: ${{ github.event.inputs.store }}
          WORK: ${{ steps.preflight.outputs.work }}
        run: |
          out="${RUNNER_TEMP}/family1-story"
          rm -rf "${out}"; mkdir -p "${out}"
          root="${WORK}/${STORE}"
          for f in progress.json plan.json manifest.json check.json; do
            if [ -f "${root}/${f}" ]; then cp "${root}/${f}" "${out}/"; else echo "no ${root}/${f}"; fi
          done
          if [ -f "${root}/${STORE}/store.json" ]; then cp "${root}/${STORE}/store.json" "${out}/"; else echo "no store.json (not assembled in this job)"; fi
          n=0
          for f in "${root}"/*.done "${root}"/parts/*.done; do
            [ -e "${f}" ] || continue
            cp "${f}" "${out}/marker_$(basename "${f}")"
            n=$((n + 1))
          done
          echo "${n} marker(s) collected"
          if [ -f "${root}/build.log" ]; then
            tail -n 200 "${root}/build.log" > "${out}/build.log.tail"
          else
            echo "::warning::no ${root}/build.log"
          fi
          df -h "${WORK}" || df -h .

      - name: Upload the story
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: family1-${{ github.event.inputs.store }}-${{ github.run_number }}
          path: ${{ runner.temp }}/family1-story
          if-no-files-found: warn
          retention-days: 30

      - name: Remove the .netrc
        if: ${{ always() }}
        run: |
          rm -f "${HOME}/.netrc"
          if [ -e "${HOME}/.netrc" ]; then
            echo "::error::${HOME}/.netrc still exists after rm"
            exit 1
          fi
          echo "no .netrc left on the runner"
