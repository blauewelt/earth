# Credential-free training: runs PixelMAE on GitHub's own runners, using only
# the workflow's automatic GITHUB_TOKEN — no user credentials anywhere.
#
# Public-repo Actions minutes are free; one job may run up to 6 hours, and a
# 4-core runner does ~45-55k training steps in that window (the in-sandbox
# pilot did 1.8k). GPU larger runners exist but are a paid team/enterprise
# feature, and TPUs aren't offered at all — for those, the Colab CLI path in
# ml/README.md remains the route (it needs a one-time browser auth).
#
# The RG-Argo download (~2 GB) and the built tensor are cached between runs,
# so only the first run pays the fetch.
name: ml-train
# The run NAME is the run's documentation: dispatches pass a one-line `doc`
# and it becomes display_title, which the status page and the Actions list
# show. Historical runs (pre-doc) are backfilled in ml/run_docs.json.
run-name: ${{ inputs.doc || 'ml-train' }}
on:
  workflow_dispatch:
    inputs:
      doc:
        description: "one line: what this run is and why (shows as the run name and on status.html)"
        default: ""
      steps:
        description: "training steps"
        default: "40000"
      batch:
        description: "batch size"
        default: "512"
      d_z:
        description: "bottleneck dimensions"
        default: "32"
      anomaly:
        description: "train in anomaly space (protocol v2; state space is disqualified from ranking)"
        default: "true"
      temporal_steps:
        description: "stage-2 steps (0 = skip). Prefix joint: (e.g. joint:4000) to run the JOINT stage-1+2 fine-tune instead, backpropagating the forecast loss into the codec — no new input, because workflow_dispatch caps at 25 and a 26th breaks every dispatch"
        default: "6000"
      temporal_d_model:
        description: "stage-2 width (96=mid, 192=large, 256=xlarge, 320=xxlarge)"
        default: "96"
      temporal_layers:
        description: "stage-2 depth (3=mid, 4=large, 5=xlarge, 6=xxlarge)"
        default: "3"
      eval_every:
        description: "FULL trainprobe cadence in steps. MEASURED on #419 (daily, T=15,706): 1,683 s per probe after the 2026-08-21 probe-cost work, of which 1,641 s is the ~864-pixel embedding — ~371 s at pentad, ~96 s at monthly. The stale '~300 s on the 10M codec' was a family-3 figure and wrong for every tensor now in use. This cadence does NOT set the collapse guard's latency (the light probe fires it too), so it is cut hard and light_probe_every is not: 25,000 gives 9 full probes over a 200k run. 0 = off, which ALSO disables the guard; requires anomaly"
        default: "25000"
      resume:
        description: "continue from a checkpoint: a tag under /opt/earth-cache/ckpt (e.g. orphan-latest) or a path. Empty = fresh run. Prefix ! (e.g. !run-62) to REQUIRE it: the job exits in seconds if this box does not hold that checkpoint, instead of silently retraining from scratch"
        default: ""
      head_probe:
        description: "run the UNPOOLED attention-head probe (top rung of the ladder) plus its matched raw-3x3 and wind-only end-to-end controls. DEFAULT TRUE since 2026-08-21 (Chris: 'we should not do pooled evals anywhere'). The mechanism is the justification: geostrophic transport at 26.5N is the east-minus-west contrast ACROSS the section, and probe_kfold's ridge reads Z.mean(1) over it — ml/project_amoc.py measures z correlating r 0.99 at one cell, 0.88 at five, 0.35 at eighty, so the section mean averages ~2.5 effective independent pixels of 265. This default being 'false' is the documented cause of every missing head number in the current wave (#414, #415, #416, #419); probe_head has produced output in 3 of 183 archived bundles. Set 'false' only to deliberately reproduce a legacy pooled-only bundle. Targets beyond rapid: the recipe-only key head_targets"
        default: "true"
      light_probe_every:
        description: "CHEAP probe cadence in steps (linear 26.5N section probe only, over the RAPID timesteps thinned to one sample per decorrelation time). MEASURED on #419: ~17 s at daily, ~22 s at pentad, ~7 s at monthly — the old '~30 s' was a family-3 figure and the daily light probe actually cost 611 s. THE COLLAPSE GUARD FIRES ON THIS PROBE, so its worst-case detection span is 2 x this value: keep it at 2,000 (= 4,000 steps) and cut eval_every instead. 0 = off, which also blinds the guard"
        default: "2000"
      window:
        description: "spatial window (global | na) for the family2 recipe. Doubles as a modifier: on a joint: run the loss mode (lse | max | sum, optionally mode@ref or mode@twin), on a stage-2 run unroll:N for the autoregressive unroll, resume2:<tag>[@lr] to CONTINUE an existing stage-2 head (needs optimiser state: only heads written after 2026-08-10 have it), or warm2:<tag>[@lr] for a WARM RESTART from its weights alone with a fresh cosine, where temporal_steps is the EXTRA steps rather than the total (both seeded from the model-checkpoints release if the box lacks the file) — reusing an input the quarter-degree recipe ignores, again because of the 25-input cap"
        default: "global"
      tensor:
        description: "tensor recipe: family2 (build_dataset + fetchers, 1°) | family3_na025 (0.25° NA monthly) | family4_na025_pentad (0.25° NA 5-day, E-034/E-038) | family5_na025_daily (0.25° NA 1-day, E-038 Phase B; sidecar layout, needs a 400+ GB disk) | family4_na025_pentad_r2 and family5_na025_daily_r2 (E-042: the same tensors plus an appended 40th channel, daily OISST SST — recipes f4r2/f5r2, their own file names, so an r1 build in flight is never overwritten). family4_na025_pentad_r3 (E-069: r2 plus appended cur_u, cur_v — the binned mean GLORYS12 current components cur_speed is the hypotenuse of, which the cone codec needs because advection is a vector — recipe f4r3, its own file name again). family6_na025_cmip6 (E-061: CMIP6 piControl ocean output regridded onto the family-3 axes — an UNLABELLED pretraining corpus of 800 model-years, recipe f6r1, SPARSE sidecar with 3 live channels of 40; it trains nothing by itself and the Train and Probes steps skip it). A VALUE on an existing input, never a 26th input — this file sits at the 25-input ceiling and a 26th makes the WHOLE workflow unparseable."
        default: "family2"
      sst_channel:
        description: "append monthly OISST as channel 15 (true | false)"
        default: "false"
      patch:
        description: "codec receptive field per channel token (1 | 3); 3 = 3x3 neighbourhood, true compression"
        default: "1"
      max_minutes:
        description: "wall-clock budget for the training loop (0 = off); the cosine schedule re-fits to the steps that fit. The job dies at 350 min with NO checkpoint otherwise."
        default: "0"
      runner:
        # DEFAULTS TO gpu, not ubuntu-latest. Omitting this input used to
        # send the job to a free GitHub-hosted 4-core CPU box, where the
        # torch install picks the CPU wheel and a 40M codec trains at a
        # speed that is not a speed — and nothing in the run's own output
        # says "wrong hardware" until you read the runner name. Run #99 went
        # that way purely because the dispatch JSON left the field out.
        # With the GPU default, a fleet that is down leaves the job queued
        # and visibly pending, which is the honest failure. Pass
        # "ubuntu-latest" explicitly for the small CPU-sized jobs.
        description: "gpu (the Vast boxes) | ubuntu-latest (free 4-core CPU, small jobs only)"
        default: "gpu"
      job_timeout:
        description: "job timeout-minutes; hosted runners die at 360 regardless, self-hosted can run for days"
        default: "350"
      lr_floor:
        description: "decay-then-constant LR: hold at floor*peak after lr_decay_steps (0 = plain cosine). On a joint: run this is instead the CODEC learning rate — set 1e-12 for the frozen-codec control that isolates how much of the forecast gain is just the fresh temporal head learning"
        default: "0"
      lr_decay_steps:
        description: "initial decay length when lr_floor > 0"
        default: "0"
      codec_d_model:
        description: "encoder width (128 = 0.92M pilot; 320 with 8 layers = 10.3M Chinchilla anchor)"
        default: ""
      codec_layers:
        description: "encoder depth (4 pilot; 8 at the 10M size)"
        default: ""
      codec_heads:
        description: "attention heads (4 pilot; 8 at the 10M size)"
        default: ""
      codec_d_dec:
        description: "decoder width (256 pilot; 512 at the 10M size)"
        default: ""

# ---- RECIPE-ONLY KEYS ------------------------------------------------------
# THE INPUT LIST ABOVE IS FULL. workflow_dispatch takes at most 25 inputs and
# there are exactly 25; a 26th does not fail gracefully — GitHub refuses to
# parse this file and EVERY dispatch in the repo 422s (§7).
#
# A recipe key does not have to be a dispatch input to be safe. The guard that
# matters is the OTHER one: a key the job never reads as $RECIPE_<KEY> is a
# setting that appears to apply and does nothing, and that is refused, at
# dispatch, by scripts/resolve_recipe.sh. A key declared here is exempt from
# the "must be a dispatch input" half and subject to the consumption half in
# full — so it can only exist if something reads it, and it can only be set by
# NAMING A RECIPE, which is what §1 asks a dispatch to do anyway.
#
# Declare one line per key. scripts/resolve_recipe.sh and
# tests/test_workflow_config.py both parse these markers out of this file, so
# this comment is the single source of truth rather than a list kept in step
# with one by hand.
#
#   recipe-only: holdout_lon      -> ml/train.py --holdout-lon   (Train step)
#       "lo,hi" | "none". The longitude block excluded from STAGE-1 training.
#       Unset = train.py's own default, -45,-25, unchanged for every dispatch
#       that does not name a recipe carrying this key.
#   recipe-only: holdout_years    -> ml/train.py --holdout-years (Train step)
#       "2009,2017,2023" | any comma list of years. The years excluded from
#       STAGE-1 training, and therefore from the anomaly statistics and from
#       every stage that reads the checkpoint's own args. Unset = train.py's
#       own default, "2009,2017,2023", unchanged for every dispatch that does
#       not name a recipe carrying this key. E-067: CONSECUTIVE years group
#       into BLOCKS and a roll is truncated at the end of its block rather
#       than of its year, so a codec held out on "2008,2009,2016,2017" can be
#       rolled 730 days where one held out on single years caps every roll at
#       365 whatever --horizon asks for. It is recipe-only for the usual two
#       reasons: the 25-input list is full, AND it is a property of a CODEC
#       rather than of a dispatch — ml/temporal.py and ml/rollout_spatial.py
#       both read the years back out of the checkpoint's args, never from a
#       flag of their own (a stage-2 run may hold out MORE, through the
#       window's `hold:` token, and refuses to hold out less).
#   recipe-only: time_block       -> ml/train.py --time-block     (Train step)
#       "" | "month" | "<N>". E-047: embed a BLOCK of consecutive bins as ONE
#       z instead of one bin as one z. "month" groups the pentad axis by
#       calendar month (6 or 7 bins, k_max 7, short months padded) so the
#       embedding axis is MONTHLY while every input stays 5-day; an integer
#       takes fixed N-bin blocks. Unset = "" = the per-bin codec every
#       archived checkpoint is, bit-identical. It is recipe-only because the
#       25-input list is full AND because it is a property of a CODEC, not of
#       a dispatch: ml/temporal.py reads k_time back out of the checkpoint,
#       never from a flag. See ml/plans/E047_block_codec.md.
#   recipe-only: fsq_levels       -> ml/train.py --fsq-levels     (Train step)
#       "" | "<N>" | "<L1,...,Ld_z>". E-046: quantize the CODEC's bottleneck
#       with FSQ (arxiv 2309.15505) instead of leaving it continuous. A single
#       integer puts that many levels on every d_z dimension; a comma list
#       gives per-dimension counts and must be exactly d_z long. Unset = "" =
#       the continuous bottleneck every archived checkpoint has, bit-identical
#       — no branch runs. Recipe-only for the same two reasons time_block is:
#       the 25-input list is full, AND it is a property of a CODEC rather than
#       of a dispatch — ml/model.py:codec_from_ckpt reads the levels back out
#       of the checkpoint for every eval, never from a flag, and refuses a
#       checkpoint whose fsq_* args it does not implement. The dispatched arm
#       is "8" at d_z 32; see ml/plans/E046_fsq_codec.md and the reasoning in
#       ml/model.py for why NOT the plan's 5-dimensional option A.
#   recipe-only: fsq_ladder       -> ml/train.py --fsq-ladder     (Train step)
#       "uniform" | "exp" | "auto". E-048: WHERE the fsq_levels levels sit.
#       Unset = "uniform" = E-046's evenly spaced lattice, bit-identical.
#       "exp" puts the same L levels on a symmetric geometric ladder inside
#       the same +/-2*sigma bound; "auto" MEASURES the choice per z-dimension
#       at --fsq-auto-step and writes the fitted lattice into the checkpoint,
#       from which every loader rebuilds it and none re-fits. Recipe-only for
#       the same two reasons fsq_levels is: the 25-input list is full, and the
#       ladder is a property of a CODEC rather than of a dispatch —
#       ml/model.py:codec_from_ckpt reads it (and the fit) back out of the
#       checkpoint for every eval. The base of the exp ladder is
#       --fsq-exp-base, which no recipe sets: 'auto' fits it per dimension out
#       of ml/fsq_ladder.py:AUTO_BASES, and a deliberate 'exp' arm gets the
#       default 2.0 until an experiment needs otherwise. See
#       ml/plans/E048_fsq_block_sweep.md.
#   recipe-only: fsq_auto_step    -> ml/train.py --fsq-auto-step  (Train step)
#       "<N>" | "<N1,N2,...>". The step(s) at which fsq_ladder "auto" MEASURES
#       and re-installs the per-dimension ladder and saturation radius. Unset
#       = train.py's own default "2000", unchanged for every dispatch that
#       does not name a recipe carrying this key. A LIST because the fit now
#       measures the radius as well, and where to_z's output sits is exactly
#       what moves while the encoder trains: one early fit bounds an encoder
#       that no longer exists, one late fit leaves most of the run quantizing
#       into a constant bound (e048a2: std_med 0.73 -> 20 across 28k steps,
#       each fitted lattice outgrown within ~10k). The LAST fit is what the
#       checkpoint carries. Recipe-only for the same two reasons fsq_ladder
#       is: the 25-input list is full, and the schedule is a property of the
#       CODEC that produced the recorded lattice. It existed in ml/train.py
#       since a1de68f with no torch dispatch able to set it, which is exactly
#       the "a setting that cannot be reached" gap E-049 closes.
#   recipe-only: fsq_bound        -> ml/train.py --fsq-bound      (Train step)
#       "" | "ln". E-049: an INTRINSIC BOUND on the pre-quantization
#       activation — LayerNorm without affine (zero-mean, unit-RMS per vector,
#       no parameter added) on to_z's output BEFORE the lattice. Unset = "" =
#       today's behaviour, bit-identical, no branch runs. It is load-bearing
#       rather than cosmetic: the straight-through estimator gives to_z no
#       gradient toward the bound, so nothing pushes a free linear map's
#       output inside it — e048a collapsed to a constant encoder at |v| ~ 87
#       against R = 2, and run-455, a HEALTHY codec, sits at |v| ~ 3e4, an
#       eight-level ladder worn as a one-bit SIGN CODE while its log claimed
#       3 bits/dim. The bound makes the fitted ladder's target stationary.
#       Refused without fsq_levels (there would be no lattice to bound the
#       activation for). Recipe-only for the same two reasons fsq_levels is:
#       the 25-input list is full, AND it is a property of a CODEC rather
#       than of a dispatch — ml/model.py:codec_from_ckpt reads it back out of
#       the checkpoint for every eval and refuses a checkpoint whose fsq_*
#       args it does not implement, and the JAX trainer refuses it outright
#       rather than running the unbounded codec under the bound's name.
#       Measure what it bought with ml/fsq_usage.py (effective bits per token
#       from the per-dimension digit entropy). See
#       ml/plans/E049_roadB_token.md §3.
#   recipe-only: fsq_warmstart    -> ml/train.py --fsq-warmstart  (Train step)
#       Any non-empty value (true) passes the bare flag; unset passes nothing
#       and is bit-identical to before it existed. E-050, approved by Chris
#       2026-08-25: it permits EXACTLY ONE transition the resume guard
#       otherwise refuses — a CONTINUOUS checkpoint resumed with the FSQ
#       lattice switched ON. The guard is right in general (fsq_levels decides
#       what a `z` IS, so a resume that contradicts it would continue a
#       quantized codec as a continuous one with every tensor loading
#       cleanly), and it also blocks the one transition now worth running:
#       E-046 measured a lattice z FORECASTING BETTER (ratio 0.4394 vs 0.5056
#       continuous), while every COLD-START codec-side FSQ run has collapsed
#       or degenerated (e048a and #481/#482 to a constant encoder, run-455 to
#       a one-bit sign code). It is safe because the lattice and --fsq-bound
#       ln are PARAMETER-FREE — E-049 measured 37,956,471 parameters on both
#       arms, identical state_dicts — so the warm start loads every weight
#       exactly and only the bottleneck's function changes. A recipe that
#       sets it MUST also set resume and fsq_levels: ml/train.py refuses the
#       flag without --resume, without an explicit --fsq-levels, when the
#       named checkpoint is not on the box, and when that checkpoint already
#       carries fsq_levels (FSQ->FSQ is a changed lattice, not a warm start).
#       It also rebases fsq_auto_step onto the resumed step, because a warm
#       start begins past every absolute fit step. Recipe-only for the same
#       two reasons fsq_levels is: the 25-input list is full, AND the
#       transition is a property of the CODEC being built rather than of a
#       dispatch. Recorded in the checkpoint as `fsq_warmstart_from`
#       ("run-480.pt@200000"), which ml/model.py:codec_from_ckpt reads as
#       informational and never refuses on.
#   recipe-only: collapse_r       -> ml/train.py --collapse-r     (Train step)
#       The collapse guard's threshold (default 0.05 on the light probe's
#       pooled linear_r_deseas). Exists because #481 (E-049b) measured the
#       guard's FALSE-POSITIVE mode: on a bounded FSQ codec the light probe
#       finally reads numbers instead of NaN (#455 read NaN all run, so no
#       FSQ codec had ever been under this guard), and its 0.05 threshold —
#       calibrated on continuous d_z-32/64 pooled z, a threshold ml/CLAUDE.md
#       §3 already says "does not transfer" across instruments — killed a
#       demonstrably input-dependent encoder at step 10,000/200,000 (fit
#       records: per-dim std 0.355 across 4,096 real vectors; a constant
#       encoder reads ~0). A recipe that sets 0 must name its REPLACEMENT
#       monitor in its _description; unset keeps the calibrated default.
#   recipe-only: train_lon_hold   -> ml/temporal.py --train-lon-hold
#       "inherit" | "none" | "lo,hi". Which longitudes are excluded from the
#       STAGE-2 training pool, read in scripts/probes_run.sh. "inherit" is the
#       default and reproduces every head trained before 2026-08-19.
#   recipe-only: head_targets     -> ml/probe_head.py --target (probes_run.sh)
#       Comma-separated subset of ml/probe_kfold.py's TARGETS
#       (rapid | fc | move | osnap | samba). Unset = "rapid", which is what
#       every head-probe dispatch before 2026-08-21 did. Each named target
#       costs a full head fit plus its two unpooled controls, so this is a
#       COST knob, not a correctness one: probe_kfold scores all five for
#       free off one embedding pass, probe_head trains a read-out per target.
#       A target whose section falls outside the tensor window is skipped by
#       name, exactly as probe_kfold skips it.
#
# ---- E-069, the cone-native codec (ml/train_cone.py) -----------------------
# ml/train_cone.py is a SECOND trainer, reached by putting the token `cone` on
# the window input (`window: recipe:<name>,cone[,seed:N]`). Its geometry knobs
# are recipe-only for the usual reason — the 25-input list is full — and for
# the sharper one: they describe a CODEC, and every downstream reader
# (ml/cone_codec.py's loader, the JAX port) takes them back out of
# cone_codec.pt's own `args`, never from a flag of its own. Each is consumed
# EXACTLY ONCE, in the Train step's cone branch, as ${RECIPE_<KEY>:-<default>};
# the defaults below are ml/train_cone.py's own, restated here so a reader can
# see what a recipe that omits a key gets. `steps`, `batch`, `d_z`, the
# holdout years and the seed are NOT here — they come from the existing inputs,
# the holdout_years recipe key and the window's `seed:` token, exactly as
# stage 1 and stage 2 take them.
#
#   recipe-only: cone_l_in            -> ml/train_cone.py --L-in          (6)
#       Inner-window depth in PENTADS. 0 is the SNAPSHOT ablation (the lag-0
#       patch only, no dots) — H1's control arm, which is also reachable in
#       the same job as cone_snapshot_ablation. Do not shorten 6 without
#       re-deriving it: E-069 §2 fixes it from v_B = 0.3 m/s and the 0.25°
#       cell, and a shorter window silently changes what the hypothesis says.
#   recipe-only: cone_n_latents       -> ml/train_cone.py --n-latents     (64)
#       Perceiver latent count. With cone_d_model and cone_layers this is the
#       parameter count: 64 x 256 x 6 measures 7,048,994 at 42 channels.
#   recipe-only: cone_layers          -> ml/train_cone.py --n-layers      (6)
#   recipe-only: cone_d_model         -> ml/train_cone.py --d-model       (256)
#   recipe-only: cone_heads           -> ml/train_cone.py --n-heads       (8)
#       NOT codec_heads: that input reaches ml/train.py's PixelMAE and a
#       dispatch may legitimately set both in one recipe.
#   recipe-only: cone_d_dec           -> ml/train_cone.py --d-dec         (256)
#   recipe-only: cone_dec_layers      -> ml/train_cone.py --dec-layers    (2)
#   recipe-only: cone_aux_w           -> ml/train_cone.py --aux-latent-w  (0.25)
#       Weight of the auxiliary loss through the decoder's FULL memory. The
#       headline term always goes through z alone; ConeMAE.decode's docstring
#       has the degeneracy this split closes.
#   recipe-only: cone_dot_queries     -> ml/train_cone.py --n-dot-queries (256)
#   recipe-only: cone_future_lags     -> ml/train_cone.py --future-lags   ("1,2")
#       Comma list, passed in the =VALUE form for the same reason
#       --holdout-years is.
#   recipe-only: cone_eval_every      -> ml/train_cone.py --eval-every    (1000)
#       The cone trainer's OWN eval cadence. Deliberately not the eval_every
#       input: that one means "full trainprobe ladder" and is read by
#       ml/train.py and by the probes phase, neither of which a cone run uses.
#   recipe-only: cone_velocity_probe  -> ml/train_cone.py --velocity-probe (true)
#       H1's read-out, run INSIDE the trainer (there is no Z to probe, so the
#       Probes step is skipped for a cone run). Any value but "true" omits the
#       flag; the default is on, because a codec trained with no probe is a
#       run that answers nothing.
#   recipe-only: cone_snapshot_ablation -> ml/train_cone.py --snapshot-ablation (false)
#       Also train the L_in = 0 twin in-process and probe it on the SAME
#       anchors — the cheap H1 control. Doubles the job's wall clock.
#   recipe-only: cone_lr              -> ml/train_cone.py --lr            (3e-4)
#       The cone trainer's peak learning rate. NOT lr_floor, which already
#       means two different things depending on whether the run is joint.

# contents: write ONLY for the live-metrics side channel — the training
# step pushes metrics.jsonl to an orphan ml-live-<run_number> branch every
# 5 minutes so curves are plottable mid-run (ml/live_curve.py). The branch
# is deleted in the cleanup step; nothing ever touches main.
permissions:
  contents: write

jobs:
  train:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(inputs.job_timeout || '350') }}
    steps:
      # BEFORE checkout, because actions/checkout cleans the workspace and
      # would delete the very thing we are rescuing. A cancelled or crashed
      # job leaves its last checkpoint in ml/runs/actions/pixelmae.pt; that
      # file is an hour of GPU time, and until now the next job silently
      # erased it. Moving it into the box-persistent cache makes a cancel
      # survivable and is what `--resume` reads.
      - name: Rescue an orphaned checkpoint from the previous job
        if: inputs.runner != 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # BEFORE checkout, because actions/checkout cleans the workspace and
          # would delete the very thing being rescued. A cancelled or crashed
          # job leaves its last checkpoint in ml/runs/actions/pixelmae.pt —
          # an hour of GPU time that the next job used to erase silently.
          # Moving it into the box-persistent cache is what makes a cancel
          # survivable, and it is what `--resume orphan-latest` reads.
          # No introspection here on purpose: this step runs before the repo
          # exists and torch may not be installed yet. --resume prints the
          # checkpoint's step and architecture when it loads it, which is the
          # place that decision is actually made.
          orphan=ml/runs/actions/pixelmae.pt
          if [ -f "$orphan" ]; then
            mkdir -p /opt/earth-cache/ckpt
            stamp=$(date -u +%Y%m%dT%H%M%SZ)
            cp "$orphan" "/opt/earth-cache/ckpt/orphan-$stamp.pt" || true
            cp "$orphan" /opt/earth-cache/ckpt/orphan-latest.pt || true
          fi
          # THE STAGE-2 HEAD TOO. temporal.pt / temporal_joint.pt are uploaded
          # only by a step that runs AFTER the probe ladder finishes, so a job
          # that hits its timeout loses the head entirely — and a 60,000-step
          # head is seven hours of GPU. It was not rescued here because this
          # step was written when only the codec mattered. Same reasoning as
          # the codec: the file on disk is real whether or not the job that
          # made it survived to upload it.
          REL_ID=$(curl -s --connect-timeout 15 --max-time 60 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/model-checkpoints-v1" \
            | sed -n 's/.*"id": *\([0-9]*\).*/\1/p' | head -1)
          # metrics.jsonl TOO — and it may matter more than the weights.
          # temporal.py writes its stage2_result (the held-out data-space
          # skill, the number the experiment exists to produce) at the END of
          # its own run, which is long before the probe ladder finishes and
          # the archive step publishes anything. A job killed in that window
          # loses the RESULT while the weights are still on disk. Rescuing the
          # weights and not the numbers would have been a very silly way to
          # learn this.
          if [ -f ml/runs/actions/metrics.jsonl ]; then
            mkdir -p /opt/earth-cache/ckpt
            cp ml/runs/actions/metrics.jsonl \
               /opt/earth-cache/ckpt/orphan-metrics-latest.jsonl || true
            echo "rescued metrics.jsonl ($(wc -l < ml/runs/actions/metrics.jsonl) lines)"
          fi
          for t in temporal temporal_joint; do
            f="ml/runs/actions/$t.pt"
            if [ -f "$f" ]; then
              mkdir -p /opt/earth-cache/ckpt
              stamp=$(date -u +%Y%m%dT%H%M%SZ)
              cp "$f" "/opt/earth-cache/ckpt/orphan-$t-$stamp.pt" || true
              cp "$f" "/opt/earth-cache/ckpt/orphan-$t-latest.pt" || true
              echo "rescued $f -> /opt/earth-cache/ckpt/orphan-$t-latest.pt"
            fi
          done
          # AND GET IT OFF THE BOX. Rescuing into /opt/earth-cache keeps a
          # file alive on the machine that made it, which is not durability —
          # it is the same single point of failure one directory over. Anything
          # rescued here is pushed to the model-checkpoints release, which
          # outlives the box, the container and any job timeout, and is
          # fetchable by `node scripts/fetch_ckpt.mjs`. Best effort and loud:
          # a failed upload prints its status rather than vanishing.
          # AND THEN REMOVE IT. `cp` alone leaves the previous job's
          # metrics.jsonl and checkpoints in the workspace, where the NEXT
          # run's temporal.py appends to them — so a run's metrics file can
          # begin with a previous run's records. That is not a display
          # nuisance: it fooled the status page, the live monitor and a
          # verification script simultaneously on 2026-08-10, when #123's
          # branch reported a stage-2 step that belonged to #120 (caught only
          # because its stage2_wall_s exceeded #123's entire lifetime).
          # Everything of value has just been copied to /opt/earth-cache;
          # leaving the originals behind buys nothing and costs correctness.
          rm -rf ml/runs/actions
          echo "cleared ml/runs/actions (rescued copies are in /opt/earth-cache/ckpt)"
          # orphan-latest.pt (the CODEC, 466 MB) is in this list since
          # 2026-08-11: it was the one rescued file the loop never uploaded,
          # so every rescue left a single-copy 466 MB file hygiene correctly
          # refused to delete — the pile the fleet-notes 12:30 entry
          # diagnosed. And `-T` streams the body; `--data-binary "@f"`
          # buffers the whole file (the OOM that kept the embed cache
          # unpublished for a day — ml/CLAUDE.md).
          for f in /opt/earth-cache/ckpt/orphan-latest.pt \
                   /opt/earth-cache/ckpt/orphan-temporal-latest.pt \
                   /opt/earth-cache/ckpt/orphan-temporal_joint-latest.pt \
                   /opt/earth-cache/ckpt/orphan-metrics-latest.jsonl; do
            [ -f "$f" ] || continue
            base=$(basename "$f"); ext="${base##*.}"
            asset="rescued-${base%.*}-${{ github.run_number }}.${ext}"
            # BOUNDED. These curls carried no timeout at all, and #405 sat
            # 45 minutes on this step with the box at 0% CPU before anyone
            # looked — against a job_timeout of 1000 minutes, i.e. a
            # best-effort rescue could have burned sixteen hours of a rented
            # GPU without ever reaching checkout. A step that cannot fail
            # must still be able to GIVE UP; "best effort" is a promise about
            # delivery, not a licence to hang. 900 s is generous for the
            # 466 MB codec on a slow box and still bounds the wedge.
            up=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              --connect-timeout 15 --max-time 900 \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              -T "$f" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$REL_ID/assets?name=$asset" \
              2>/dev/null || echo 000)
            echo "rescue upload $asset -> HTTP $up"
          done
          # The timestamped copies duplicate bytes that now exist twice over
          # (as *-latest.pt on this disk, and on the release once the upload
          # lands) — they were unbounded history on a bounded disk, ~0.5 GB
          # per rescue cycle. The *-latest working copies stay.
          rm -f /opt/earth-cache/ckpt/orphan-2*T*Z.pt \
                /opt/earth-cache/ckpt/orphan-temporal-2*T*Z.pt \
                /opt/earth-cache/ckpt/orphan-temporal_joint-2*T*Z.pt 2>/dev/null || true
          ls -la /opt/earth-cache/ckpt 2>/dev/null || true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # RESOLVE THE RECIPE, if the window names one. Must run before ANY step
      # that reads $WINDOW or $RECIPE_*, and after checkout (it reads
      # ml/recipes/ and this file). On a window with no `recipe:` prefix it
      # exports WINDOW unchanged and nothing else — a no-op on every dispatch
      # written before recipes existed, which is the point.
      - name: Resolve recipe
        env:
          # THE ONE PLACE that still reads inputs.window directly — this step
          # is what DEFINES $WINDOW for every step after it, so referring to
          # $WINDOW here would be circular (and empty).
          IN_WINDOW: ${{ inputs.window }}
        run: bash scripts/resolve_recipe.sh "$IN_WINDOW"


      # PHASE 2 STEP 1 of retiring the overloaded `window` field: SHADOW MODE.
      # This decodes `window` with ml/dispatch_config.py and PRINTS what it
      # makes of it. It decides nothing — the eight shell decode sites below
      # are untouched and still govern the run. Every real dispatch therefore
      # produces both readings, so a disagreement between the new decoder and
      # the shell shows up in a log rather than in a retracted result.
      # `|| true`: this step must never be able to fail a training run, and it
      # says so rather than pretending it did something (§4.6).
      - name: Decode dispatch config (shadow — decides nothing)
        run: |
          python3 ml/dispatch_config.py --window "${WINDOW}" || true
      - name: Install deps (torch matches the hardware)
        run: |
          # A C COMPILER, BEFORE ANYTHING THAT CAN BACKPROP. torch 2.13's
          # _native eager router dispatches some backward kernels (measured:
          # bmm_outer_product, which is what SectionHead's cross-attention
          # backward lands on) through TRITON, and triton JIT-COMPILES C at
          # first use. The Vast box image ships no `cc`, so the very first
          # loss.backward() in ml/probe_head.py:fold_fit died with
          #   triton/runtime/build.py: RuntimeError: Failed to find C compiler.
          #   Please specify via CC environment variable or set
          #   triton.knobs.build.impl
          # — #397, BOTH invocations (head 20:14:54, raw-3x3 control 20:26:23),
          # after the run had already spent ~2.5 min embedding. It is the third
          # death of probe_head in one day and the first with this cause.
          #
          # Why it only ever bit probe_head: eval-only runs do no codec
          # backward at all, and probe_sequence's temporal transformer
          # backward does not route through that op. That is an observation,
          # not a guarantee — a codec architecture that happens to route
          # through triton would die at step 1 of a fourteen-hour run — so the
          # guard is set HERE, in the step every later step inherits from,
          # rather than next to the probe ladder.
          #
          # INSTALL-IF-MISSING, not install: a warm box already carrying gcc
          # skips apt entirely in well under a second, and ubuntu-latest
          # never enters the branch at all. The boxes run as root
          # (RUNNER_ALLOW_RUNASROOT=1), same as gpu_box.mjs's onstart, so no
          # sudo. NOT FATAL on failure (§5.17: only a definite answer may be
          # fatal — most runs never touch a triton path, and killing them for
          # a transient apt mirror would cost more than it protects), but it
          # asserts the EFFECT (§0.2): it re-checks for the binary afterwards
          # and prints the version, so "installed gcc" can never be a log
          # line about nothing.
          if ! command -v cc >/dev/null 2>&1 && ! command -v gcc >/dev/null 2>&1; then
            echo "no C compiler on this box — installing gcc for triton's JIT"
            (apt-get update -qq && apt-get install -y -qq gcc) \
              || echo "::warning::gcc install failed — a triton JIT path will still die at first use"
          fi
          CC_BIN="$(command -v cc || command -v gcc || true)"
          if [ -n "$CC_BIN" ]; then
            # Exported to $GITHUB_ENV, so TRAIN and the PROBE LADDER both
            # inherit it. triton reads $CC before it goes looking, and a box
            # where gcc exists but /usr/bin/cc was never alternatives-linked
            # would otherwise still fail the lookup.
            echo "CC=$CC_BIN" >> "${GITHUB_ENV:-/dev/null}"
            export CC="$CC_BIN"
            echo "C compiler: $CC_BIN — $("$CC_BIN" --version 2>&1 | head -1)"
          else
            echo "::warning::no C compiler and none could be installed — any triton JIT kernel (e.g. probe_head's backward) will fail"
          fi
          pip install --quiet numpy netCDF4 matplotlib
          # FAMILY 6 ONLY (E-061). The CMIP6 corpus is the first build to read
          # the Pangeo catalogue and the public zarr stores, and that path
          # imports six modules nothing else in this workflow does. #514 died
          # six minutes in on `ModuleNotFoundError: No module named 'pandas'`
          # (build_family6.py:276, resolve_stores) — and pandas is only the
          # FIRST of them: fixing it alone would have bought one more box start
          # and the same death at `import fsspec` on line 312, then zarr, then
          # scipy.spatial in build_regrid_map, then huggingface_hub in
          # preflight_hf. Same shape as #402, which died on `import yaml`.
          #
          # Gated on the recipe so that NO training run's environment changes:
          # a dependency added for one build must not silently move a number in
          # a run that never asked for it. RECIPE_TENSOR is set by the "Resolve
          # recipe" step, which runs before this one.
          #
          # Then ASSERT the imports (ml/CLAUDE.md 0.3): a precondition checked
          # where the inputs are all it has cost, rather than an hour into the
          # download it guards.
          if [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family6_na025_cmip6" ]; then
            pip install --quiet pandas fsspec aiohttp xarray zarr scipy huggingface_hub
            for m in pandas fsspec aiohttp xarray zarr scipy huggingface_hub; do
              python -c "import $m" || {
                echo "::error::family-6 build dep still missing after install: $m"
                exit 1
              }
            done
            python -c "import scipy.spatial" || {
              echo "::error::scipy.spatial unavailable — build_regrid_map cannot run"
              exit 1
            }
            echo "family 6 deps present: pandas fsspec aiohttp xarray zarr scipy huggingface_hub"
          fi
          # CUDA wheel when the runner has a GPU, CPU wheel otherwise —
          # train.py auto-selects the device, so the same dispatch works on both.
          #
          # The wheel must MATCH THE HOST DRIVER, and a mismatch is silent:
          # default torch (cu130) on gpu-box-45318655's 12.6 driver printed a
          # UserWarning, reported cuda:False, and run #36 trained a 10M codec
          # on CPU at 0.5 steps/s — a 17-minute GPU job restated as 17 hours,
          # discovered only because the live loss curve crawled. So: try the
          # default wheel, fall back to cu126 for older drivers, and REFUSE
          # to proceed if a GPU is present that torch cannot reach — failing
          # in 3 minutes beats silently burning a box for a day.
          if command -v nvidia-smi >/dev/null 2>&1; then
            pip install --quiet torch
            ok=$(python -c "import torch; print(int(torch.cuda.is_available()))" 2>/dev/null || echo 0)
            if [ "$ok" != "1" ]; then
              echo "default torch wheel cannot use this driver — falling back to cu126"
              pip install --quiet --force-reinstall torch --index-url https://download.pytorch.org/whl/cu126
              ok=$(python -c "import torch; print(int(torch.cuda.is_available()))" 2>/dev/null || echo 0)
            fi
            if [ "$ok" != "1" ]; then
              echo "::error::GPU present but no torch wheel can reach it — refusing to train on CPU"
              nvidia-smi | head -4
              exit 1
            fi
            python -c "import torch; print('torch', torch.__version__, 'cuda: True', torch.cuda.get_device_name(0))"
          else
            pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          fi

      # On OUR box the data cache is a directory on the box, not a GitHub
      # cache. The sources total ~13 GB (8.9 GB Argo RG + 4.1 GB NCEP daily
      # wind), GitHub evicts caches once a repo passes 10 GB, and the eviction
      # is silent: the restore "succeeds" from a restore-key that predates the
      # wind files and the build then re-downloads all 13 GB. That is what
      # stalled runs #19 and #20 for 80 and 92 minutes — the log at cancel
      # showed uflx/vflx.sfc.gauss.YYYY.nc being fetched one year at a time.
      # A directory outside the workspace survives actions/checkout's clean,
      # so the box pays the download once, ever.
      - name: Phase · seeding
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish_phase.sh "ml-live-${{ github.run_number }}" "seeding the data cache" "downloading RG-Argo + wind from the data-cache release (first run on a box only)"

      - name: Persistent data cache (self-hosted box)
        if: inputs.runner != 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # DISK HYGIENE FIRST. gpu-box-46045353 hit 50/50 GB on 2026-08-08:
          # the runner worker could not write its own _diag log, run #39 died
          # AFTER a successful train+upload, and the runner process went
          # offline — a full disk turns a healthy box into a poison pill that
          # eats jobs. Below 8 GB free, drop the reclaimable tiers: runner
          # diagnostic logs, pip's wheel cache (~3 GB of torch), actions'
          # _temp staging, and stage-2 embedding caches in the persistent
          # cache (Z_*.npy are ~4 GB each and re-derive from checkpoints).
          # BACKED UP OR UNTOUCHED. The rule used to delete by SIZE, which
          # meant it always reached for the embedding cache first — the most
          # expensive artefact on the box and, until today, the only one with
          # nowhere else to live. Chris: "do _never_ cleanup the embeddings
          # unless these are backed up (similar to checkpoints)."
          # scripts/disk_hygiene.sh frees scratch, then frees only what a
          # release CONFIRMS it can re-fetch, and keeps everything else while
          # saying why.
          # EXIT 2 = the scratch the job is about to write will not fit even
          # after every reclaimable tier — refuse now, while it has cost
          # nothing (#530 and #532 both died 30–60 s into that write on
          # 2026-09-02). Any other failure of the script stays best-effort.
          bash scripts/disk_hygiene.sh 16; rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::disk hygiene could not free enough for this job's scratch copy — rent a box with more disk, or clear it by hand"
            exit 1
          fi
          mkdir -p /opt/earth-cache
          rm -rf ml/cache
          ln -s /opt/earth-cache ml/cache
          # COLD-START SEED from the data-cache release instead of the origin
          # archives (SIO 504s/timeouts killed five runs on 2026-08-08). The
          # check is COMPLETENESS, not existence: failed origin fetches leave
          # partial directories that must not suppress seeding — that exact
          # bug sent runs #36/#37 back to the dead origin while the release
          # sat unused at zero downloads.
          # Every curl carries a hard --max-time. The first version streamed
          # `curl -sL | tar x` with no time limit — one stalled connection
          # hangs the pipe FOREVER, which is what parked run #42 in this step
          # for 90+ minutes on the Brazil box (release download counts showed
          # chunks ac/ad/ae were never even requested). Still streamed (a
          # chunks-to-disk variant would double peak disk on 50 GB boxes),
          # and deliberately NO --retry inside the stream: a mid-body retry
          # restarts the chunk from byte 0 and corrupts the tar. A stall now
          # kills the seed loudly; the completeness check re-seeds next run.
          seed() {
            d="$1"
            echo "seeding $d from release data-cache-v1 …"
            rm -rf "/opt/earth-cache/$d"
            assets=$(curl -s --max-time 120 -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/data-cache-v1" \
              | python3 -c "import json,sys;[print(a['browser_download_url']) for a in json.load(sys.stdin).get('assets',[]) if a['name'].startswith('$d.tar.')]")
            if [ -n "$assets" ]; then
              if echo "$assets" | sort | while read u; do
                   echo "  chunk $(basename "$u") …" >&2
                   curl -sL --max-time 1800 "$u" || exit 1
                 done | tar x -C /opt/earth-cache; then
                echo "  seeded: $(du -sh /opt/earth-cache/$d | cut -f1)"
              else
                echo "::warning::seed $d failed (stall/timeout) — partial dir stays, completeness check re-seeds next run"
              fi
            else
              echo "  (no release assets — fetchers will hit the origin)"
            fi
          }
          { [ -f /opt/earth-cache/rg/RG_S.nc.gz ] && \
            [ -f /opt/earth-cache/rg/RG_T.nc.gz ]; } || seed rg
          [ "$(ls /opt/earth-cache/wind_daily/*.nc 2>/dev/null | wc -l)" -ge 60 ] \
            || seed wind_daily
          # Family-3 needs the 1982-92 NCEP dailies too. They are NOT in the
          # wind_daily tar (1993+ only): build_family3.py used to fetch them
          # from downloads.psl.noaa.gov on first build, and that host 504'd
          # run #47 to death on 2026-08-08. They live in their own asset
          # (wind_daily_8292.tar.aa, one chunk) that extracts ADDITIVELY into
          # wind_daily/ — so no rm -rf and no seed(): the shared dir must
          # survive a failed extension seed.
          if [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family3_na025" ] || \
             [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family4_na025_pentad" ] || \
             [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family4_na025_pentad_r2" ] || \
             [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family4_na025_pentad_r3" ] || \
             [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family5_na025_daily" ] || \
             [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family5_na025_daily_r2" ]; then
            n8292=$(ls /opt/earth-cache/wind_daily/*.sfc.gauss.198[2-9].nc \
                       /opt/earth-cache/wind_daily/*.sfc.gauss.199[0-2].nc \
                       2>/dev/null | wc -l)
            if [ "$n8292" -lt 22 ]; then
              echo "seeding wind_daily 1982-92 extension ($n8292/22 present) …"
              if curl -sL --max-time 1800 \
                   "https://github.com/${GITHUB_REPOSITORY}/releases/download/data-cache-v1/wind_daily_8292.tar.aa" \
                   | tar x -C /opt/earth-cache; then
                echo "  seeded: $(ls /opt/earth-cache/wind_daily/*.nc | wc -l) files total"
              else
                echo "::warning::8292 seed failed — build_family3.py will try the PSL origin + thredds mirror"
              fi
            fi
          fi
          # Truth series (1.2 MB): OSNAP's repository server timed out from
          # two boxes on 2026-08-08 and killed the whole build step. With the
          # files present, fetch_truth.py never opens a connection.
          { [ -f /opt/earth-cache/truth/osnap_moc.nc ] && \
            [ -f /opt/earth-cache/truth/move.nc ] && \
            [ -f /opt/earth-cache/truth/samba.asc ] && \
            [ "$(ls /opt/earth-cache/truth/fc_* 2>/dev/null | wc -l)" -ge 40 ]; } \
            || seed truth
          # The family-3 base tensor is a single (non-tar) release asset;
          # build_family3.py can fetch it itself, but seeding it here keeps
          # the build step offline like everything else.
          if [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family3_na025" ] || \
             [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family4_na025_pentad" ] || \
             [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family4_na025_pentad_r2" ] || \
             [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family4_na025_pentad_r3" ] || \
             [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family5_na025_daily" ] || \
             [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family5_na025_daily_r2" ] || \
             [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family6_na025_cmip6" ]; then
            [ -f /opt/earth-cache/base025_na.npz ] || curl -sL \
              --max-time 900 --retry 3 --retry-delay 10 \
              -o /opt/earth-cache/base025_na.npz \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/data-cache-v1/base025_na.npz" \
              || rm -f /opt/earth-cache/base025_na.npz
          fi
          echo "persistent cache: $(du -sh /opt/earth-cache | cut -f1)"

      - name: Restore data cache (GitHub-hosted only)
        if: inputs.runner == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: ml/cache
          key: ml-cache-v2-${{ inputs.window }}-${{ inputs.sst_channel }}-${{ hashFiles('ml/build_dataset.py', 'ml/fetch_rg_channels.py', 'ml/fetch_wind_channels.py', 'ml/fetch_sst_channel.py', 'ml/fetch_truth.py', 'ml/fetch_wind_stats.py', 'ml/build_family3.py') }}
          # Fall back across generations and windows: the expensive part of
          # the cache is the raw RG/NCEP downloads, which are window- and
          # version-independent (the tensor itself is rebuilt every run).
          restore-keys: |
            ml-cache-v2-${{ inputs.window }}-
            ml-cache-v2-
            ml-cache-v1-

      - name: Phase · building
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish_phase.sh "ml-live-${{ github.run_number }}" "building the tensor" "assembling channels into the pixel tensor"

      - name: Build dataset (repo channels + RG-Argo depth + NCEP wind stress)
        env:
          # Only the family-6 branch reads this, and only to decide whether it
          # can publish the corpus it just built. Absent (the secret is not
          # set) the builder says so and leaves the artefact on the box's disk,
          # which is a warning and not a failure — but a rented box is not an
          # archive, so setting the secret is what makes the corpus durable.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # E-042 recipe r2 = the same tensor plus an appended `sst` channel,
          # from the DAILY OISST artifact ml/fetch_sst_na.py bakes onto this
          # window's own grid (.github/workflows/sst-na-bake.yml publishes it
          # to the Hub's sst_na025/). Public files, so no credential reaches a
          # stranger's machine (§6) — the same posture as pentad025/daily025.
          #
          # FATAL on failure, exactly like the truth files and for the same
          # reason: build_family4.py warns and leaves the channel entirely
          # missing tokens if the artifact is absent, so a silent fetch
          # failure would produce a run that TRAINS, goes green, and reports
          # E-042 numbers for an experiment in which SST never appeared.
          SD=/opt/earth-cache/sst_na025
          seed_sst() {
            mkdir -p "$SD"
            SSTB="https://huggingface.co/datasets/chfrank/earth-tensors/resolve/main/sst_na025"
            for f in index.npz sst_daily_na.npy; do
              if [ ! -s "$SD/$f" ]; then
                echo "fetching sst_na025/$f …"
                curl -fsSL --max-time 3600 -o "$SD/$f.part" "$SSTB/$f" || {
                  echo "::error::could not fetch sst_na025/$f from the Hub — an"
                  echo "r2 tensor with no SST would train and report anyway"
                  exit 1; }
                mv -f "$SD/$f.part" "$SD/$f"
              fi
            done
            python3 - <<'PY'
          import numpy as np, os
          d = np.load(os.path.join(os.environ.get("SD", "/opt/earth-cache/sst_na025"), "index.npz"))
          has = np.asarray(d["has_data"], bool)
          print(f"sst_na025: {has.sum():,}/{len(has):,} rows with data "
                f"({100.0 * has.mean():.1f}%), "
                f"grid {len(d['lat'])}x{len(d['lon'])}, epoch {str(d['epoch'])}")
          if not has.any():
              raise SystemExit("::error::the SST artifact has NO rows with data")
          PY
          }
          export SD
          if [ "${RECIPE_TENSOR:-${{ inputs.tensor || 'family2' }}}" = "family3_na025" ]; then
            # PULL THE PUBLISHED TENSOR BEFORE BUILDING ONE. Boxes building
            # their own produced different bytes under one filename (b40f5b0b
            # vs adcbe700, measured 2026-08-11) and the tensor moves the head
            # k-fold by 0.041 — the box-effect confound. Since #150 the
            # canonical build is on data-cache-v1; a SECOND box (2026-08-11,
            # Chris: "get a second box") is only cross-comparable because
            # this pull makes every box hold the same bytes. sha256-verified;
            # a failed pull falls back to building, LOUDLY, and provenance
            # still records whatever tensor the run really used.
            TPIN="adcbe700fb6e160b1c84d7acd8dc0333b34d07829db9abd62c721aab278b4848"
            TF="ml/cache/family3_na025.npz"
            if [ -f "$TF" ] && [ "$(sha256sum "$TF" | cut -d' ' -f1)" = "$TPIN" ]; then
              echo "tensor already present and matches pin ${TPIN:0:10}"
            else
              echo "pulling pinned tensor ${TPIN:0:10} from data-cache-v1 …"
              ok=1
              for sfx in aa ab; do
                # --retry 3: #437 lost this pull to a single transient
                # "curl (56) connection reset", then spent 45 min on a doomed
                # fallback build that died on disk. One retry saves the job.
                curl -fsSL --max-time 1800 --retry 3 --retry-delay 10 -o "$TF.$sfx.part" \
                  "https://github.com/${GITHUB_REPOSITORY}/releases/download/data-cache-v1/family3_na025_${TPIN:0:10}.npz.$sfx" \
                  || { ok=0; break; }
              done
              if [ "$ok" = 1 ]; then
                cat "$TF.aa.part" "$TF.ab.part" > "$TF.new" && rm -f "$TF".*.part
                got=$(sha256sum "$TF.new" | cut -d' ' -f1)
                if [ "$got" = "$TPIN" ]; then
                  mv "$TF.new" "$TF"
                  echo "tensor seeded from the release, sha verified"
                else
                  rm -f "$TF.new"
                  echo "::warning::pulled tensor sha $got != pin — discarded, will build"
                fi
              else
                rm -f "$TF".*.part
                echo "::warning::tensor pull failed — this box will BUILD its own, which may not hash ${TPIN:0:10}"
              fi
            fi
            python -u ml/build_family3.py
          elif [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family4_na025_pentad" ] || \
               [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family4_na025_pentad_r2" ] || \
               [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family4_na025_pentad_r3" ]; then
            # E-034 step 4 / E-038. The 5-day fields are published PUBLICLY on
            # the Hub, so this needs no credential on the box — deliberately:
            # the box is a stranger's machine whose host has root (§6), and
            # nothing here requires a secret, so nothing here gets one.
            # PULL THE PUBLISHED TENSOR BEFORE BUILDING ONE, exactly as the
            # family-3 branch above does and for a sharper reason. np.savez
            # stamps zip timestamps, so a REBUILT family-4 tensor never hashes
            # the same as the published one even from identical inputs — and
            # the embed cache is keyed by (codec weight hash, TENSOR sha256).
            # The 16.24 GiB pentad Z on embed-cache-v1 is 8.5 h of a 4090
            # (#423/#427) and is named Z_8b639abe36_37e146384b: a box that
            # builds its own tensor gets a different fingerprint, misses that
            # cache, and re-spends the 8.5 h — or, on the sroll path, fails
            # outright with "no embed cache published for ...". So on family 4
            # the pull is not a convenience, it is what makes the published Z
            # and every cross-box pentad number reachable at all.
            TPIN=37e146384b6f622fefe3c7e18ad9bab0389c9538be79536899fe8729bb2d0826
            TF="ml/cache/${RECIPE_TENSOR:-${{ inputs.tensor }}}.npz"
            PULLED=0
            if [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family4_na025_pentad_r2" ]; then
              if [ -f "$TF" ] && [ "$(sha256sum "$TF" | cut -d' ' -f1)" = "$TPIN" ]; then
                echo "tensor already present and matches pin ${TPIN:0:10}"
                PULLED=1
              else
                echo "pulling pinned tensor ${TPIN:0:10} from data-cache-v1 …"
                ok=1
                for sfx in aa ab ac; do
                  # --retry 3: see the family-3 pull above (#437's lesson).
                  curl -fsSL --max-time 1800 --retry 3 --retry-delay 10 -o "$TF.$sfx.part" \
                    "https://github.com/${GITHUB_REPOSITORY}/releases/download/data-cache-v1/family4_na025_pentad_r2_${TPIN:0:10}.npz.$sfx" \
                    || { ok=0; break; }
                done
                if [ "$ok" = 1 ]; then
                  cat "$TF.aa.part" "$TF.ab.part" "$TF.ac.part" > "$TF.new" && rm -f "$TF".*.part
                  got=$(sha256sum "$TF.new" | cut -d' ' -f1)
                  if [ "$got" = "$TPIN" ]; then
                    mv "$TF.new" "$TF"; PULLED=1
                    echo "tensor seeded from the release, sha verified ${TPIN:0:10}"
                  else
                    rm -f "$TF.new"
                    echo "::warning::pulled tensor sha $got != pin — discarded, will build"
                  fi
                else
                  rm -f "$TF".*.part
                  echo "::warning::tensor pull failed — this box will BUILD its own, which may not hash ${TPIN:0:10}. The published embed cache is keyed on that hash, so this run will also re-spend the 8.5 h embed."
                fi
              fi
            fi
            # ------------------------------------------------------------ r3
            # THE r3 PULL BLOCK GOES HERE, AND IT IS DELIBERATELY ABSENT.
            # E-069's family4_na025_pentad_r3 has not been built or published
            # yet, so there is no sha256 to pin, and an unpinned pull is a
            # pull of nothing: it would fetch a 404, warn, and build anyway —
            # a step that reports a decision it did not make (ml/CLAUDE.md
            # §0.2). Until Phase A has run, an r3 dispatch BUILDS, which is
            # what the build case below now does.
            #
            # WHEN THE PIN EXISTS (Phase A route A1 prints the full sha256 in
            # its "Record provenance" output and in provenance.json), paste
            # the r2 block above verbatim with three substitutions and
            # nothing else changed:
            #
            #   TPIN3=<the full 64-char sha256 of family4_na025_pentad_r3.npz>
            #   if [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family4_na025_pentad_r3" ]; then
            #     ... identical body, with TPIN -> TPIN3 and the asset stem
            #     family4_na025_pentad_r3_${TPIN3:0:10}.npz.$sfx ...
            #   fi
            #
            # Keep the chunk list `aa ab ac` unless publish_tensor.py reports
            # a different part count for the r3 file (it chunks at 1.5 GiB, and
            # r3 is two channels larger than r2's three-part file — a fourth
            # part would make the `cat` above assemble a truncated tensor whose
            # sha then fails the verify, loudly, which is the safe failure).
            # Pin it in the same commit as ml/jaxport/tpu_train_cone.sh's
            # TENSOR_SHA and claude/expectations.md §2b (handover §4).
            if [ "$PULLED" = 1 ]; then
              # SKIP THE BUILD INPUTS TOO, and say what was skipped. The npz
              # is complete and self-describing: build_family4.py's own skip
              # guard reads the RECIPE STRING AND THE TRUTH KEYS OUT OF THE
              # FILE, and the truth npz, the pentad025 means and the SST
              # artifact are BUILD inputs only — nothing downstream opens
              # them. Fetching ~GB of them to run a builder that returns at
              # its first check is cost with no effect (#391's lesson, one
              # level up: a precondition may only be demanded by work that
              # still has to happen).
              echo "family 4: tensor is the published ${TPIN:0:10} — skipping the pentad025/truth/SST fetch and the build entirely"
              ls -l "$TF"
            else
            PD=/opt/earth-cache/glorys_pentad
            mkdir -p "$PD"
            HFB="https://huggingface.co/datasets/chfrank/earth-tensors/resolve/main/pentad025"
            # The pentad TRUTH, without which the tensor is built with no
            # transport labels at all and the probe dies on KeyError:'rapid'.
            # Run #365 hit exactly that: truth_pentad.npz existed only in a
            # sandbox and had never been published anywhere a box can reach.
            if [ ! -s /opt/earth-cache/truth_pentad.npz ]; then
              curl -fsSL --max-time 600 -o /opt/earth-cache/truth_pentad.npz.part \
                "https://huggingface.co/datasets/chfrank/earth-tensors/resolve/main/truth/truth_pentad.npz" || {
                  echo "::error::could not fetch truth_pentad.npz — the tensor "
                  echo "would be built with no labels, which is worse than failing"
                  exit 1; }
              mv -f /opt/earth-cache/truth_pentad.npz.part /opt/earth-cache/truth_pentad.npz
            fi
            for f in index.npz pentad_mean_uo.npy pentad_mean_vo.npy \
                     pentad_mean_mlotst.npy pentad_mean_zos.npy; do
              if [ ! -s "$PD/$f" ]; then
                echo "fetching pentad025/$f …"
                curl -fsSL --max-time 1800 -o "$PD/$f.part" "$HFB/$f" || {
                  echo "::error::could not fetch pentad025/$f from the Hub"
                  exit 1; }
                mv -f "$PD/$f.part" "$PD/$f"
              fi
            done
            REV=""
            if [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family4_na025_pentad_r2" ]; then
              REV="--rev r2 --sst-dir $SD"
              seed_sst
            fi
            # E-069 recipe r3 = r2 plus the two appended current components
            # cur_u/cur_v. It still needs the SST artifact, because r3's
            # channel list CONTAINS r2's: dropping seed_sst here would build a
            # 42-channel tensor whose channel 40 is entirely missing tokens
            # and train on it silently, which is the exact failure the r2
            # branch's FATAL seed_sst exists to prevent.
            if [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family4_na025_pentad_r3" ]; then
              REV="--rev r3 --sst-dir $SD"
              seed_sst
            fi
            # build_family4.py checks the grid against base025_na.npz and
            # REFUSES a mismatch before writing any of the 33 GB.
            python -u ml/build_family4.py --pentad-dir "$PD" $REV
            fi
          elif [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family6_na025_cmip6" ]; then
            # E-061. NOT a training tensor: an UNLABELLED pretraining corpus of
            # CMIP6 piControl ocean output, 800 model-years against the 43 the
            # reanalysis gives us. It seeds NOTHING from the GLORYS/truth/SST
            # path above — a free-running control run has no real calendar, so
            # there is no truth to attach and attaching one would be a lie.
            # base025_na.npz is the one seed it wants, and only so
            # build_family6.py can verify the grid against family 3 before
            # writing (ml/CLAUDE.md 0.3).
            #
            # Reads the public Google Cloud CMIP6 zarr store over anonymous
            # HTTPS — no credential reaches this box for the source. The HF
            # token comes from the repo's Actions secret, never this file.
            # SPARSE sidecar: 3 live channels of 40, 7.8 GB rather than the
            # naive 103.8 GB, with channel_index recording where each belongs.
            # DEPS. #514 died here with ModuleNotFoundError: pandas, after
            # verifying the grid and fetching the 80.8 MB catalogue — a
            # dependency gap, not a design fault, but it cost a whole
            # dispatch. The training path never needed any of these: the
            # catalogue is a CSV (pandas), the source is a remote zarr store
            # (xarray + zarr + fsspec + aiohttp for its HTTP filesystem), the
            # regrid map is a KD-tree (scipy), and h5netcdf is what reads a
            # NetCDF without the netCDF4 C library. Pinned nowhere on purpose:
            # this is a read-only ingest and a newer reader is fine.
            python -m pip install -q pandas xarray zarr fsspec aiohttp \
              scipy h5netcdf
            python -c "import pandas, xarray, zarr, fsspec, aiohttp, scipy, h5netcdf; print('family6 deps ok')"
            python -u ml/build_family6.py --layout sparse \
              --out /opt/earth-cache/family6_na025_cmip6.npz \
              ${HF_TOKEN:+--hf-repo chfrank/earth-tensors}
          elif [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family5_na025_daily" ] || \
               [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family5_na025_daily_r2" ]; then
            # E-038 Phase B. Same shape as the family-4 branch, daily inputs:
            # public Hub fetch (no credential on a stranger's machine, §6),
            # labels FATAL (a tensor with no labels is worse than a failed
            # build — #365/#367), and the shared builder behind --days 1.
            # The output is the SIDECAR layout: family5_na025_daily.npz +
            # family5_na025_daily_X.npy (165.6 GB, memmappable) — this branch
            # belongs on the 700 GB box; a 100 GB box will refuse in the
            # builder's own disk check before writing anything. At r2 the
            # names carry the rev and the 40th channel costs 4.2 GB more
            # (169.8 GB), plus the 4.25 GB SST artifact itself.
            DD=/opt/earth-cache/glorys_daily025
            mkdir -p "$DD"
            HFB="https://huggingface.co/datasets/chfrank/earth-tensors/resolve/main/daily025"
            if [ ! -s /opt/earth-cache/truth_daily.npz ]; then
              curl -fsSL --max-time 600 -o /opt/earth-cache/truth_daily.npz.part \
                "https://huggingface.co/datasets/chfrank/earth-tensors/resolve/main/truth/truth_daily.npz" || {
                  echo "::error::could not fetch truth_daily.npz — the tensor "
                  echo "would be built with no labels, which is worse than failing"
                  exit 1; }
              mv -f /opt/earth-cache/truth_daily.npz.part /opt/earth-cache/truth_daily.npz
            fi
            for f in index.npz daily_mean_uo.npy daily_mean_vo.npy \
                     daily_mean_mlotst.npy daily_mean_zos.npy; do
              if [ ! -s "$DD/$f" ]; then
                echo "fetching daily025/$f …"
                curl -fsSL --max-time 3600 -o "$DD/$f.part" "$HFB/$f" || {
                  echo "::error::could not fetch daily025/$f from the Hub"
                  exit 1; }
                mv -f "$DD/$f.part" "$DD/$f"
              fi
            done
            REV=""
            if [ "${RECIPE_TENSOR:-${{ inputs.tensor }}}" = "family5_na025_daily_r2" ]; then
              REV="--rev r2 --sst-dir $SD"
              seed_sst
            fi
            python -u ml/build_family5.py --pentad-dir "$DD" $REV
          else
            python ml/build_dataset.py --window "${WINDOW}"
            python ml/fetch_rg_channels.py
            python ml/fetch_wind_channels.py
            if [ "${RECIPE_SST_CHANNEL:-${{ inputs.sst_channel }}}" = "true" ]; then python ml/fetch_sst_channel.py; fi
            python ml/fetch_wind_stats.py
            python ml/fetch_truth.py
          fi

      # PROVENANCE MANIFEST — the answer to "we thought this run tested X
      # but a bug made the param something else". Three claims, three
      # independent recorders, written AFTER the build so they describe what
      # the training loop will actually see, not what the dispatch intended:
      #   code    -> the exact commit SHA (immutable; tree browsable at
      #              github.com/<repo>/tree/<sha> — better than a branch,
      #              which is a mutable pointer someone can push to)
      #   intent  -> the verbatim dispatch inputs
      #   reality -> the BUILT tensor's own shape, channel list, and axis,
      #              read back from the npz. The C=24 mislabelling incident
      #              (a run named patch14 that silently carried 24 channels
      #              because a fetcher default had moved) is exactly the gap
      #              between intent and reality this file closes.
      # It ships inside the checkpoint artifact, so harvest_run.mjs lands it
      # in ml/runs/<name>/provenance.json next to the numbers it certifies.
      - name: Record provenance
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
          IN_TENSOR: ${{ inputs.tensor }}
        run: |
          # TENSOR is derived HERE rather than in the step's env:, because
          # env: is a YAML expression context that ${RECIPE_TENSOR} cannot
          # reach — a recipe naming family4 would have switched the data-cache
          # branch and left this path on family3, i.e. trained on the wrong
          # file while every log line said otherwise. EXPORTED, because the
          # python heredocs below read os.environ["TENSOR"] — a plain shell
          # assignment is invisible to them, which is how #403 died.
          T="${RECIPE_TENSOR:-$IN_TENSOR}"
          [ "$T" = "family2" ] && T=na_pixels
          export TENSOR="ml/cache/${T}.npz"
          mkdir -p ml/runs/actions
          python - <<'EOF'
          import hashlib, json, os, subprocess, sys
          import numpy as np

          def _tensor_hash(path, chunk=1 << 24):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for b in iter(lambda: f.read(chunk), b""):
                      h.update(b)
              return h.hexdigest()

          sys.path.insert(0, "ml")
          from tensor_io import load_tensor, sidecar_path
          d = load_tensor(os.environ["TENSOR"], allow_pickle=False)
          # A corpus with no real calendar has no `months`, and family 6 does
          # not write one ON PURPOSE — a reader must not be able to mistake a
          # model-year of a free-running control run for a calendar year.
          # #517 built the whole 7.79 GB artefact and then died HERE, which is
          # a bookkeeping step failing after the thing it describes already
          # exists. Report what the tensor actually carries instead.
          months = ([str(m) for m in d["months"]] if "months" in d
                    else [str(b) for b in d["bins"]] if "bins" in d else [])
          # For the sidecar layout the meta npz alone would fingerprint 1% of
          # the artefact; hash the X file too so cross-box divergence in the
          # DATA cannot hide behind identical metadata.
          _xp = sidecar_path(os.environ["TENSOR"])
          _extra = ({"X_sha256": _tensor_hash(_xp),
                     "X_bytes": os.path.getsize(_xp)}
                    if os.path.exists(_xp) else {})
          try:
              import torch
              tv, cuda = torch.__version__, (torch.cuda.get_device_name(0)
                  if torch.cuda.is_available() else "cpu")
          except Exception:
              tv, cuda = "?", "?"
          json.dump({
              "run_number": int(os.environ.get("GITHUB_RUN_NUMBER", 0)),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "code": "https://github.com/%s/tree/%s" % (
                  os.environ.get("GITHUB_REPOSITORY", ""),
                  os.environ.get("GITHUB_SHA", "")),
              "inputs": json.loads(os.environ["INPUTS_JSON"]),
              "tensor": {
                  "file": os.environ["TENSOR"],
                  # FINGERPRINT. Each box builds and caches its own tensor, and
                  # on 2026-08-10 two of them had DIVERGED: the channel-space
                  # persistence baseline — a data-only quantity that cannot
                  # depend on the model — read 1.2046650648 on gpu-box-45318655
                  # (runs #88 and #112, identical to 16 digits) and 1.1540812254
                  # on gpu-box-35586926 (#110). 4.2% apart, 350,000x float32
                  # epsilon. It tracked the BOX, not the run. Without a
                  # fingerprint, cross-box comparisons silently compare two
                  # different datasets, and nothing anywhere says so.
                  "sha256": _tensor_hash(os.environ["TENSOR"]),
                  "bytes": os.path.getsize(os.environ["TENSOR"]),
                  **_extra,
                  "X_shape": list(d["X"].shape),
                  "C": int(d["X"].shape[-1]),
                  "chan": [str(c) for c in d["chan"]],
                  "months": ([months[0], months[-1]] if months else None),
                  "months_are_calendar": bool("months" in d),
                  "T": len(months),
              },
              "torch": tv, "device": cuda,
              "runner": os.environ.get("RUNNER_NAME", ""),
          }, open("ml/runs/actions/provenance.json", "w"), indent=1)
          print(open("ml/runs/actions/provenance.json").read())
          EOF

      # SEED A MISSING CHECKPOINT FROM THE RELEASE. Checkpoint mirrors are
      # box-local, and with three boxes a resume job lands on the right one by
      # luck. Worse, the box that CANNOT serve the job fails fast and is
      # therefore first back in the queue to grab the next attempt — a
      # livelock that ate runs #87, #89 and #90, all on gpu-box-35586926.
      # Publishing the codec as a release asset makes it fetchable anywhere;
      # the box-local mirror stays as the fast path.
      - name: Seed resume checkpoint from the release
        if: always() && inputs.resume != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAGS="${RECIPE_RESUME:-${{ inputs.resume }}}"; TAGS="${TAGS#!}"
          mkdir -p /opt/earth-cache/ckpt
          for TAG in ${TAGS//,/ }; do
            case "$TAG" in */*) continue;; esac        # a path, not a tag
            [ -f "/opt/earth-cache/ckpt/$TAG.pt" ] && { echo "$TAG already on this box"; continue; }
            # ${TAG}__… with BRACES. Underscores are legal in a bash
            # identifier, so "$TAG__pixelmae.pt" expands the variable
            # $TAG__pixelmae — unset, therefore empty — and the pattern
            # became a bare ".pt". Run #98's log says it plainly:
            # "trying release asset .pt for run-62". Second occurrence of
            # this family of quoting bug in two days.
            for ASSET in "${TAG}__pixelmae.pt" "f3_anchor41M__pixelmae.pt"; do
              echo "trying release asset $ASSET for $TAG …"
              # curl, not `gh`: the Vast boxes have no gh CLI, so every
              # `gh release download` returned 127 in under a millisecond
              # with its stderr swallowed by 2>/dev/null, and the step
              # reported success having downloaded nothing. The data-cache
              # seed above already fetches release assets this way and has
              # worked on these boxes since #47.
              if curl -fsSL --max-time 1800 --retry 3 --retry-delay 10 \
                   -o "/opt/earth-cache/ckpt/$TAG.pt.part" \
                   "https://github.com/${GITHUB_REPOSITORY}/releases/download/model-checkpoints-v1/${ASSET}"; then
                mv "/opt/earth-cache/ckpt/$TAG.pt.part" "/opt/earth-cache/ckpt/$TAG.pt"
                echo "  seeded /opt/earth-cache/ckpt/$TAG.pt from $ASSET ($(du -h /opt/earth-cache/ckpt/$TAG.pt | cut -f1))"
                break
              fi
              rm -f "/opt/earth-cache/ckpt/$TAG.pt.part"
            done
          done
          ls -la /opt/earth-cache/ckpt/ 2>/dev/null || true

      - name: Phase · training
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # A joint: run passes through Train only to reload the parent codec
        # and write it out — the real work is the fine-tune step below. Saying
        # "stage-1 codec; curves appear within a few minutes" there was simply
        # false, and it is what made #97 look stuck for 45 minutes when it was
        # doing exactly what it was told.
        run: |
          case "${RECIPE_TEMPORAL_STEPS:-${{ inputs.temporal_steps }}}" in
            joint:*) bash scripts/publish_phase.sh "ml-live-${{ github.run_number }}" \
                       "reloading the parent codec" \
                       "a joint run trains in the fine-tune step; no stage-1 curve for this one" ;;
            *)       bash scripts/publish_phase.sh "ml-live-${{ github.run_number }}" \
                       "training" "stage-1 codec; curves appear within a few minutes" ;;
          esac

      - name: Train
        # family 6 is a pretraining CORPUS, not a training run: it carries no
        # truth series, so every probe below would die on KeyError:'rapid' and
        # the trainer has nothing to be trained against. The build step IS the
        # whole job.
        if: inputs.tensor != 'family6_na025_cmip6'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Every N-step checkpoint is mirrored to /opt/earth-cache/ckpt
          # under this tag, so a cancel leaves something to resume FROM.
          CKPT_TAG: run-${{ github.run_number }}
          IN_TENSOR: ${{ inputs.tensor }}
        run: |
          # TENSOR is derived HERE rather than in the step's env:, because
          # env: is a YAML expression context that ${RECIPE_TENSOR} cannot
          # reach — a recipe naming family4 would have switched the data-cache
          # branch and left this path on family3, i.e. trained on the wrong
          # file while every log line said otherwise. EXPORTED, because the
          # python heredocs below read os.environ["TENSOR"] — a plain shell
          # assignment is invisible to them, which is how #403 died.
          T="${RECIPE_TENSOR:-$IN_TENSOR}"
          [ "$T" = "family2" ] && T=na_pixels
          export TENSOR="ml/cache/${T}.npz"
          # E-069 · THE CONE TRAINER. `window: recipe:<name>,cone[,seed:N]`
          # switches this step to ml/train_cone.py, a SECOND trainer with its
          # own model (ConeMAE), its own checkpoint (cone_codec.pt) and its own
          # probe (--velocity-probe, run in-process because there is no Z to
          # probe afterwards — the Probes phase skips a cone run for exactly
          # that reason, in scripts/probes_run.sh).
          #
          # A TOKEN ON `window`, not a 26th input: the list is at 25 and a 26th
          # makes the whole file unparseable (§7). `recipe:` must come first —
          # scripts/resolve_recipe.sh matches recipe:* and hands the rest on as
          # $WINDOW — so what reaches here is "cone" or "cone,seed:1".
          #
          # SEED rides the same window input and is parsed the same way stage
          # 2's is (scripts/probes_run.sh): anywhere-match on *seed:*, then
          # first-comma strip, default 0. One grammar, one default.
          case "${WINDOW}" in
            cone|cone,*|*,cone|*,cone,*) IS_CONE=1;;
            *) IS_CONE=0;;
          esac
          CONE_SEED=0
          case "${WINDOW}" in
            *seed:*) CONE_SEED="${WINDOW}"; CONE_SEED="${CONE_SEED##*seed:}"
                     CONE_SEED="${CONE_SEED%%,*}";;
          esac
          # An `if`, not `[ ... ] && echo`: the job runs under `bash -e {0}`,
          # where a false test as the LAST command of a && list is the step's
          # exit status, so the one-liner would kill every non-cone dispatch.
          if [ "$IS_CONE" = 1 ]; then
            echo "cone trainer: seed ${CONE_SEED}, tensor ${TENSOR}"
          fi
          # E-019b: `window` may carry a recw: token with the codec's
          # copy-reconstruction knobs, e.g.
          #   recw:vis=0.3;upw=3;chans=rg_[ts](900|1100|1300|1500|1700|1900);declayers=4
          # Semicolon-separated k=v pairs, no spaces (token ends at the first
          # space). Built as a bash ARRAY because the chans value is a regex
          # whose (|) would be glob-fodder in an unquoted $VAR expansion.
          # Unknown keys are FATAL: a typo'd knob silently ignored is the
          # reports-success-does-nothing failure this file keeps relearning.
          RECW=()
          case "${WINDOW}" in *recw:*)
            SPEC="${WINDOW}"; SPEC="${SPEC#*recw:}"; SPEC="${SPEC%% *}"
            IFS=';' read -ra KV <<< "$SPEC"
            for kv in "${KV[@]}"; do
              case "$kv" in
                vis=*)       RECW+=(--rec-w-visible "${kv#vis=}");;
                upw=*)       RECW+=(--upweight "${kv#upw=}");;
                chans=*)     RECW+=(--upweight-chans "${kv#chans=}");;
                declayers=*) RECW+=(--dec-layers "${kv#declayers=}");;
                *) echo "::error::unknown recw key: $kv"; exit 1;;
              esac
            done
            echo "recw flags: ${RECW[*]}"
          ;; esac
          # --holdout-lon and --holdout-years are passed ONLY when a recipe
          # sets them (recipe-only keys), so a dispatch that names no recipe
          # gets train.py's own defaults and is bit-identical to one from
          # before either existed.
          # WRITTEN AS --holdout-lon=VALUE, one word: argparse reads a bare
          # "-45,-25" in the next argv slot as an OPTION STRING (it starts
          # with "-" and does not match argparse's negative-number pattern)
          # and exits 2 with "expected one argument" before a line of this
          # trainer runs. The =form is the only one that survives a value
          # that opens with a minus sign.
          # ONE background launch, ONE live-metrics loop, TWO trainers. The
          # cone arm is an `else` rather than an early exit so the publisher
          # loop below is shared: train_cone.py writes ml/train.py's own
          # record family into the same metrics.jsonl, so the curve and the
          # ETA appear on status.html mid-run with no page change (§0d, "a
          # new trainer format must teach the status page its records" — this
          # one is not a new format, which is why nothing is owed).
          if [ "$IS_CONE" = 0 ]; then
          python -u ml/train.py \
            --data "$TENSOR" \
            --steps "${RECIPE_STEPS:-${{ inputs.steps }}}" \
            --batch "${RECIPE_BATCH:-${{ inputs.batch }}}" \
            --d-z "${RECIPE_D_Z:-${{ inputs.d_z }}}" \
            --patch "${RECIPE_PATCH:-${{ inputs.patch || '1' }}}" \
            --max-minutes "${RECIPE_MAX_MINUTES:-${{ inputs.max_minutes || '0' }}}" \
            --lr-floor "${RECIPE_LR_FLOOR:-${{ inputs.lr_floor || '0' }}}" \
            --lr-decay-steps "${RECIPE_LR_DECAY_STEPS:-${{ inputs.lr_decay_steps || '0' }}}" \
            --light-probe-every "${RECIPE_LIGHT_PROBE_EVERY:-${{ inputs.light_probe_every || '2000' }}}" \
            --resume "${RECIPE_RESUME:-${{ inputs.resume }}}" \
            --d-model "${RECIPE_CODEC_D_MODEL:-${{ inputs.codec_d_model }}}" \
            --n-layers "${RECIPE_CODEC_LAYERS:-${{ inputs.codec_layers }}}" \
            --n-heads "${RECIPE_CODEC_HEADS:-${{ inputs.codec_heads }}}" \
            --d-dec "${RECIPE_CODEC_D_DEC:-${{ inputs.codec_d_dec }}}" \
            "${RECW[@]}" \
            $([ -n "${RECIPE_HOLDOUT_LON:-}" ] && echo "--holdout-lon=${RECIPE_HOLDOUT_LON}") \
            $([ -n "${RECIPE_HOLDOUT_YEARS:-}" ] && echo "--holdout-years=${RECIPE_HOLDOUT_YEARS}") \
            $([ -n "${RECIPE_TIME_BLOCK:-}" ] && echo "--time-block=${RECIPE_TIME_BLOCK}") \
            $([ -n "${RECIPE_FSQ_LEVELS:-}" ] && echo "--fsq-levels=${RECIPE_FSQ_LEVELS}") \
            $([ -n "${RECIPE_FSQ_LADDER:-}" ] && echo "--fsq-ladder=${RECIPE_FSQ_LADDER}") \
            $([ -n "${RECIPE_FSQ_AUTO_STEP:-}" ] && echo "--fsq-auto-step=${RECIPE_FSQ_AUTO_STEP}") \
            $([ -n "${RECIPE_FSQ_BOUND:-}" ] && echo "--fsq-bound=${RECIPE_FSQ_BOUND}") \
            $([ -n "${RECIPE_FSQ_WARMSTART:-}" ] && echo "--fsq-warmstart") \
            $([ -n "${RECIPE_COLLAPSE_R:-}" ] && echo "--collapse-r=${RECIPE_COLLAPSE_R}") \
            $([ "${RECIPE_ANOMALY:-${{ inputs.anomaly }}}" = "true" ] && echo --anomaly) \
            $([ "${RECIPE_ANOMALY:-${{ inputs.anomaly }}}" = "true" ] && [ "${RECIPE_EVAL_EVERY:-${{ inputs.eval_every }}}" != "0" ] \
              && echo --eval-every "${RECIPE_EVAL_EVERY:-${{ inputs.eval_every }}}") \
            --out ml/runs/actions &
          else
            # THE CONE ARM (E-069). Every geometry flag is a recipe-only key
            # consumed exactly once, here, as ${RECIPE_<KEY>:-<default>}; the
            # defaults are ml/train_cone.py's own, restated so a dispatch that
            # names no recipe still runs the configuration the plan describes.
            # --holdout-years is passed ONLY when a recipe sets it, exactly as
            # ml/train.py's branch above does it and in the same =VALUE form.
            # It is not cosmetic here either: train_cone.py writes the years
            # into its {"config": ...} record and into cone_codec.pt's `norm`,
            # and every later stage reads them back out of the checkpoint
            # rather than from a flag — a codec trained on the wrong years is
            # invisible from the dispatch.
            python -u ml/train_cone.py \
              --tensor "$TENSOR" \
              --steps "${RECIPE_STEPS:-${{ inputs.steps }}}" \
              --batch "${RECIPE_BATCH:-${{ inputs.batch }}}" \
              --d-z "${RECIPE_D_Z:-${{ inputs.d_z }}}" \
              --seed "$CONE_SEED" \
              --lr "${RECIPE_CONE_LR:-3e-4}" \
              --L-in "${RECIPE_CONE_L_IN:-6}" \
              --n-latents "${RECIPE_CONE_N_LATENTS:-64}" \
              --n-layers "${RECIPE_CONE_LAYERS:-6}" \
              --d-model "${RECIPE_CONE_D_MODEL:-256}" \
              --n-heads "${RECIPE_CONE_HEADS:-8}" \
              --d-dec "${RECIPE_CONE_D_DEC:-256}" \
              --dec-layers "${RECIPE_CONE_DEC_LAYERS:-2}" \
              --aux-latent-w "${RECIPE_CONE_AUX_W:-0.25}" \
              --n-dot-queries "${RECIPE_CONE_DOT_QUERIES:-256}" \
              --future-lags="${RECIPE_CONE_FUTURE_LAGS:-1,2}" \
              --eval-every "${RECIPE_CONE_EVAL_EVERY:-1000}" \
              $([ "${RECIPE_CONE_VELOCITY_PROBE:-true}" = "true" ] && echo --velocity-probe) \
              $([ "${RECIPE_CONE_SNAPSHOT_ABLATION:-false}" = "true" ] && echo --snapshot-ablation) \
              $([ -n "${RECIPE_HOLDOUT_YEARS:-}" ] && echo "--holdout-years=${RECIPE_HOLDOUT_YEARS}") \
              --out ml/runs/actions &
          fi
          # `$!` survives the `fi` — it is the last backgrounded PID of the
          # shell, not of the compound command — so both arms are waited on
          # and published by the identical loop below.
          TRAIN_PID=$!
          # Live-metrics side channel: publish curves every ~5 min while
          # training. Poll at 30s and publish every 10th tick rather than
          # sleeping 300s outright — a bare `sleep 300` also delays NOTICING
          # that training finished, which added a five-minute tail to every
          # job. That was invisible against a 6-hour CPU run and is 25% of a
          # 20-minute GPU one.
          TICK=0
          while kill -0 $TRAIN_PID 2>/dev/null; do
            sleep 30
            TICK=$((TICK + 1))
            if [ $((TICK % 10)) -eq 0 ]; then
              bash scripts/publish_live_metrics.sh "ml-live-${{ github.run_number }}" || true
            fi
          done
          wait $TRAIN_PID
          # Say what the run actually left on disk. The cone arm's artefacts
          # are cone_codec.pt and velocity_probe.json, and neither is named by
          # any step above this one, so a listing here is the first place a
          # reader can see whether they exist at all (§0.1: verify the
          # ARTEFACT). `|| true` because an ordinary run has neither.
          ls -l ml/runs/actions/cone_codec.pt \
                ml/runs/actions/velocity_probe.json 2>/dev/null || true

      # ALWAYS upload. #62/#63 trained all 60,000 steps, passed every
      # probe, and then died in the final evaluation — and because this step
      # was conditional on the Train step succeeding, six hours of GPU and a
      # finished 40M codec were thrown away with it. The checkpoint on disk is
      # real whether or not the last line of the job raised.
      - name: Upload checkpoint + eval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelmae-${{ github.run_number }}
          path: |
            ml/runs/actions/pixelmae.pt
            ml/runs/actions/eval.json
            ml/runs/actions/metrics.jsonl
            ml/runs/actions/curve.png
            ml/runs/actions/provenance.json
            # E-069: a cone run writes NEITHER pixelmae.pt NOR eval.json, so
            # without these two lines its artifact would carry the curve and
            # nothing else. if-no-files-found is `warn` and the list is a set
            # of names, so naming them costs an ordinary run nothing.
            ml/runs/actions/cone_codec.pt
            ml/runs/actions/velocity_probe.json
          retention-days: 30
          if-no-files-found: warn

      # Protocol v2 verdicts ride along: the seasonality-proof K-sweep and the
      # stage-2 temporal transformer over the frozen codec. Both only make
      # sense on an anomaly-space codec (temporal.py refuses otherwise).
      # Same reasoning: the probes read the checkpoint, so a late Train
      # failure must not skip them.
      # JOINT stage-1+2 fine-tune. Writes to ml/runs/actions/pixelmae.pt on
      # purpose: the probe ladder below then scores the JOINT codec with no
      # extra wiring, and the pre-joint weights stay safe in /opt/earth-cache.
      # The joint step is the longest thing a joint run does and it published
      # NOTHING until it finished, so the status page kept showing whatever
      # phase the Train step had left behind. Announce it up front, and let
      # train_joint.py push its own curves as it goes (--publish-branch).
      - name: Phase · joint fine-tune
        if: always() && startsWith(inputs.temporal_steps, 'joint:')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish_phase.sh "ml-live-${{ github.run_number }}" "joint stage-1+2 fine-tune" "codec and forecaster trained together; both curves appear within a few minutes"

      - name: Joint stage-1+2 fine-tune
        if: always() && startsWith(inputs.temporal_steps, 'joint:')
        env:
          # WITHOUT THIS the live-metrics publisher below pushes to
          # https://x-access-token:@github.com/... — an empty credential —
          # fails, and is swallowed by its own `|| true`. Run #100 ticked its
          # publisher loop ninety-odd times over 48 minutes and put not one
          # curve point on the branch. Every other step that publishes has
          # this line; the joint step was added later and never got it.
          GITHUB_TOKEN: ${{ github.token }}
          CKPT_TAG: run-${{ github.run_number }}
          IN_TENSOR: ${{ inputs.tensor }}
        run: |
          # TENSOR is derived HERE rather than in the step's env:, because
          # env: is a YAML expression context that ${RECIPE_TENSOR} cannot
          # reach — a recipe naming family4 would have switched the data-cache
          # branch and left this path on family3, i.e. trained on the wrong
          # file while every log line said otherwise. EXPORTED, because the
          # python heredocs below read os.environ["TENSOR"] — a plain shell
          # assignment is invisible to them, which is how #403 died.
          T="${RECIPE_TENSOR:-$IN_TENSOR}"
          [ "$T" = "family2" ] && T=na_pixels
          export TENSOR="ml/cache/${T}.npz"
          JS="${RECIPE_TEMPORAL_STEPS:-${{ inputs.temporal_steps }}}"; JS="${JS#joint:}"
          # window carries "mode" or "mode@ref_fore" — e.g. lse@0.29. The
          # second field is the FROZEN-CODEC control's forecast loss in
          # persistence units, and it is what puts both terms of the loss on
          # the same footing. Without it reconstruction sits at ~1.0 and
          # forecast at ~0.3, the smooth max is always reconstruction, and 95%
          # of every gradient step goes to the wrong objective (measured on
          # #94). Packed into an existing input because workflow_dispatch caps
          # at 25 and this file is at the ceiling.
          W="${WINDOW}"
          MODE="${W%%@*}"
          case "$W" in *@*) REF="${W#*@}";; *) REF=0;; esac
          # "twin" -> -1, which selects the SELF-NORMALISING reference: a
          # second temporal head trained in this same job on the FROZEN
          # codec's embeddings, same batches, same init. It abolishes the
          # hand-copied constant entirely. That constant turned out not to
          # be a property of anything: #101's control curve was still
          # falling ~0.018 per 1200 steps at step 12,000, so its "converged"
          # 0.44 was really a function of how long the control ran.
          case "$REF" in twin) REF=-1;; esac
          python -u ml/train_joint.py \
            --data "$TENSOR" \
            --resume "${RECIPE_RESUME:-${{ inputs.resume }}}" \
            --steps "$JS" \
            --loss-mode "$MODE" \
            --ref-fore="$REF" \
            --lr "${{ inputs.lr_floor != '0' && inputs.lr_floor || '3e-5' }}" \
            --temporal-d-model "${RECIPE_TEMPORAL_D_MODEL:-${{ inputs.temporal_d_model }}}" \
            --temporal-layers "${RECIPE_TEMPORAL_LAYERS:-${{ inputs.temporal_layers }}}" \
            --out ml/runs/actions &
          JOINT_PID=$!
          # Same side channel as the Train step. Without it a 12,000-step
          # joint run published exactly once — at the end — so the status
          # page showed an empty chart under a stale phase for its whole
          # life, which is indistinguishable from a hung job.
          TICK=0
          while kill -0 $JOINT_PID 2>/dev/null; do
            sleep 30
            TICK=$((TICK + 1))
            if [ $((TICK % 10)) -eq 0 ]; then
              bash scripts/publish_live_metrics.sh "ml-live-${{ github.run_number }}" || true
            fi
          done
          wait $JOINT_PID
          bash scripts/publish_live_metrics.sh "ml-live-${{ github.run_number }}" || true

      - name: Phase · probes
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish_phase.sh "ml-live-${{ github.run_number }}" "probes and stage 2" "k-fold ladder, stage-2 temporal transformer, head probe"

      - name: Probes (K-sweep + stage 2)
        # The anomaly gate moved INTO probes_run.sh: an `if:` is a YAML
        # expression context, so a recipe setting `anomaly` could never have
        # reached it — it would have governed the trainer and not whether this
        # phase ran, which is precisely the half-applied setting that recipes
        # exist to abolish.
        if: always() && inputs.tensor != 'family6_na025_cmip6'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IN_TENSOR: ${{ inputs.tensor }}
          # The four dispatch inputs the phase reads. They come through env
          # rather than being interpolated into the body, because the body is
          # now a FILE — see scripts/probes_run.sh for why (the 21,000-char
          # run-block ceiling that 422s every dispatch in the repo). Recipe
          # precedence is applied inside the script as ${RECIPE_X:-$IN_X};
          # it cannot be written here, because env: is a YAML expression
          # context where a shell variable is only ever literal text.
          IN_TEMPORAL_STEPS: ${{ inputs.temporal_steps }}
          IN_TEMPORAL_D_MODEL: ${{ inputs.temporal_d_model }}
          IN_TEMPORAL_LAYERS: ${{ inputs.temporal_layers }}
          IN_HEAD_PROBE: ${{ inputs.head_probe }}
          IN_ANOMALY: ${{ inputs.anomaly }}
        run: bash scripts/probes_run.sh

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probes-${{ github.run_number }}
          path: |
            ml/runs/actions/probe_sequence.json
            ml/runs/actions/temporal.json
            ml/runs/probe_kfold.json
            ml/runs/actions/dip_check.json
            # A GLOB, not three names. --target and --wind-only (2026-08-21)
            # multiply these files by target, and the RAPID names are only the
            # default case: probe_head_move.json and probe_head_wind.json are
            # the head's own BAR and would have been dropped silently by a
            # hand-kept list — an unpooled number arriving with no unpooled
            # control is exactly what ml/CLAUDE.md §3 now forbids quoting.
            ml/runs/actions/probe_head*.json
            ml/runs/actions/rollout.json
            ml/runs/actions/rollout_eval.json
            ml/runs/actions/temporal.pt
            # Milestone checkpoints (--milestone-steps, E-031/E-032): weights-only
            # saves at named steps, so a single 200k run retains its 60k/120k
            # rungs — release snapshots fail silently over 2 GiB, so for xl-tier
            # heads the artifact is the ONLY off-box carrier of intermediates.
            ml/runs/actions/temporal_ms*.pt
            # PROVENANCE RIDES WITH THE RESULTS. It carries the sha256 of the
            # tensor the run actually used, added after E-007 found that two
            # boxes had silently diverged caches — and it was only in the
            # CHECKPOINT artifact, which the probe bundle does not read. So on
            # 2026-08-11 a three-way schedule comparison had to be caught by
            # its persistence baseline (3.139 on one box, 3.343 on the other)
            # instead of by the hash that exists precisely to say so.
            ml/runs/actions/provenance.json
            # THE ROLL-FORWARD SEQUENCES (`sroll:...,dumproll`, 2026-08-22).
            # ml/rollout_spatial.py --dump-roll writes one .npz per (head,
            # holdout year, staggered start) holding the FULL-window z
            # trajectory the roll advanced, for the UI's animation. This
            # `path:` is a LIST OF NAMES, not a directory — rollout_spatial.json
            # itself is not in it — so "written into the bundle dir" would NOT
            # have carried them: without this line the dumps die with the box.
            # ~411 MB per pentad trajectory, ~3.7 GB for one head at horizon
            # 73 / starts 3, against the 4.55 GB this repo has already uploaded
            # in one artifact (probes-427). They are deliberately NOT archived
            # to ml-metrics: scripts/archive_probes.py takes named JSONs, and a
            # gigabyte on a git branch is forever.
            ml/runs/actions/roll_dump/*
          retention-days: 30
          if-no-files-found: ignore

      # Archive BEFORE deleting: the per-run ml-live branch is scratch, but
      # the curves it carried are the record of the experiment. They move to
      # the long-lived ml-metrics branch as run-<n>.jsonl so a finished run
      # keeps its charts on status.html.
      - name: Archive metrics, then clean up the live branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/archive_run_metrics.sh "${{ github.run_number }}" || \
            echo "::warning::metrics archive failed — live branch kept for recovery"
          # THE RESULTS, not just the curves. probe_kfold, probe_head, its
          # raw-3x3 control and dip_check are the numbers this programme argues
          # from, and until now they existed ONLY in an Actions artifact, which
          # GitHub deletes after 30 days. The training curves outlived the
          # results. #116's had to be rescued by hand on 2026-08-10 with three
          # weeks to spare.
          # PYTHON, NOT NODE. The .mjs version of this ran on every job from
          # 19:23 on 2026-08-10 and died each time with `node: command not
          # found` — the Vast boxes have no node, exactly as they have no `gh`
          # (ml/CLAUDE.md §7). It was a best-effort step, so it warned and the
          # job went green, and not one probe result was ever archived by it.
          # The sandbox has the opposite constraint (node writes fine, python
          # is blocked by the egress proxy), which is why both versions exist.
          # --dir IS the cone trainer's --out, so velocity_probe.json (E-069's
          # only result: H1's ridge from z to cur_u/cur_v) rides this call
          # with no second invocation — scripts/archive_probes.py names it in
          # WANT. A cone run produces none of the other names, so this is the
          # whole of its probe archive.
          python3 scripts/archive_probes.py --run-number "${{ github.run_number }}" \
            --dir ml/runs/actions || \
            echo "::warning::probe archive failed — results are only in the artifact, which expires"
          # E-069 · THE CONE CODEC, off the box. cone_codec.pt is what a cone
          # run produces and it is not pixelmae.pt, so no step above ships it:
          # the orphan-rescue loop at the top of this file names three files by
          # hand and this is not one of them, and the Actions artifact expires
          # in 30 days. Published under the same run-<n>__ convention
          # ml/CLAUDE.md and scripts/fetch_ckpt.mjs already read.
          #
          # `-T` STREAMS the body. NEVER --data-binary "@f": it buffers the
          # whole file and that is the OOM that left #358 publishing nothing
          # for fifteen hours (the same note stands in the rescue loop above
          # and in scripts/snapshot_head.sh). The blob is weights + args +
          # norm and NO optimiser state (ml/train_cone.py::save), so ~28 MB of
          # fp32 at the 7.05M size — far under the 2 GiB release-asset cap,
          # and no split path is needed. Re-read this line if the geometry
          # grows: over 2 GiB the upload 422s at HEADERS time, instantly and
          # quietly, which is the cliff snapshot_head.sh had to learn.
          #
          # BEST EFFORT AND LOUD, and read the RELEASE rather than this step's
          # colour (§0.2): the `|| echo` keeps a failed upload from taking the
          # cleanup with it, which also means a green step proves nothing.
          if [ -f ml/runs/actions/cone_codec.pt ]; then
            REL_ID=$(curl -s --connect-timeout 15 --max-time 60 \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/model-checkpoints-v1" \
              | sed -n 's/.*"id": *\([0-9]*\).*/\1/p' | head -1)
            if [ -n "$REL_ID" ]; then
              CA="run-${{ github.run_number }}__cone_codec.pt"
              up=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                --connect-timeout 15 --max-time 900 \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                -T ml/runs/actions/cone_codec.pt \
                "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$REL_ID/assets?name=$CA" \
                2>/dev/null || echo 000)
              echo "cone codec upload $CA -> HTTP $up ($(du -h ml/runs/actions/cone_codec.pt | cut -f1))"
              [ "$up" = "201" ] || echo "::warning::$CA did NOT reach model-checkpoints-v1 (HTTP $up) — list the release before believing this run archived its codec"
            else
              echo "::warning::could not resolve the model-checkpoints-v1 release id — cone_codec.pt is only on this box"
            fi
          fi
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            ":refs/heads/ml-live-${{ github.run_number }}" 2>/dev/null || true
