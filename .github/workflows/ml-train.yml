# Credential-free training: runs PixelMAE on GitHub's own runners, using only
# the workflow's automatic GITHUB_TOKEN — no user credentials anywhere.
#
# Public-repo Actions minutes are free; one job may run up to 6 hours, and a
# 4-core runner does ~45-55k training steps in that window (the in-sandbox
# pilot did 1.8k). GPU larger runners exist but are a paid team/enterprise
# feature, and TPUs aren't offered at all — for those, the Colab CLI path in
# ml/README.md remains the route (it needs a one-time browser auth).
#
# The RG-Argo download (~2 GB) and the built tensor are cached between runs,
# so only the first run pays the fetch.
name: ml-train
# The run NAME is the run's documentation: dispatches pass a one-line `doc`
# and it becomes display_title, which the status page and the Actions list
# show. Historical runs (pre-doc) are backfilled in ml/run_docs.json.
run-name: ${{ inputs.doc || 'ml-train' }}
on:
  workflow_dispatch:
    inputs:
      doc:
        description: "one line: what this run is and why (shows as the run name and on status.html)"
        default: ""
      steps:
        description: "training steps"
        default: "40000"
      batch:
        description: "batch size"
        default: "512"
      d_z:
        description: "bottleneck dimensions"
        default: "32"
      anomaly:
        description: "train in anomaly space (protocol v2; state space is disqualified from ranking)"
        default: "true"
      temporal_steps:
        description: "stage-2 steps (0 = skip). Prefix joint: (e.g. joint:4000) to run the JOINT stage-1+2 fine-tune instead, backpropagating the forecast loss into the codec — no new input, because workflow_dispatch caps at 25 and a 26th breaks every dispatch"
        default: "6000"
      temporal_d_model:
        description: "stage-2 width (96=mid, 192=large, 256=xlarge, 320=xxlarge)"
        default: "96"
      temporal_layers:
        description: "stage-2 depth (3=mid, 4=large, 5=xlarge, 6=xxlarge)"
        default: "3"
      eval_every:
        description: "FULL trainprobe cadence in steps (~300 s each on the 10M codec; 0 = off; requires anomaly)"
        default: "7500"
      resume:
        description: "continue from a checkpoint: a tag under /opt/earth-cache/ckpt (e.g. orphan-latest) or a path. Empty = fresh run. Prefix ! (e.g. !run-62) to REQUIRE it: the job exits in seconds if this box does not hold that checkpoint, instead of silently retraining from scratch"
        default: ""
      head_probe:
        description: "run the UNPOOLED attention-head probe (top rung of the ladder) plus its matched raw-3x3 end-to-end control. The decisive test of whether a pooled-probe decline is a read-out artifact or real information loss"
        default: "false"
      light_probe_every:
        description: "CHEAP probe cadence in steps (linear section probe only, ~30 s; the headline r at high cadence so a bad run shows early). 0 = off"
        default: "2000"
      window:
        description: "spatial window (global | na) for the family2 recipe. Doubles as a modifier: on a joint: run the loss mode (lse | max | sum), on a stage-2 run unroll:N for the autoregressive unroll — reusing an input the quarter-degree recipe ignores, again because of the 25-input cap"
        default: "global"
      tensor:
        description: "tensor recipe: family2 (build_dataset + fetchers, 1°) | family3_na025 (0.25° NA builder)"
        default: "family2"
      sst_channel:
        description: "append monthly OISST as channel 15 (true | false)"
        default: "false"
      patch:
        description: "codec receptive field per channel token (1 | 3); 3 = 3x3 neighbourhood, true compression"
        default: "1"
      max_minutes:
        description: "wall-clock budget for the training loop (0 = off); the cosine schedule re-fits to the steps that fit. The job dies at 350 min with NO checkpoint otherwise."
        default: "0"
      runner:
        # DEFAULTS TO gpu, not ubuntu-latest. Omitting this input used to
        # send the job to a free GitHub-hosted 4-core CPU box, where the
        # torch install picks the CPU wheel and a 40M codec trains at a
        # speed that is not a speed — and nothing in the run's own output
        # says "wrong hardware" until you read the runner name. Run #99 went
        # that way purely because the dispatch JSON left the field out.
        # With the GPU default, a fleet that is down leaves the job queued
        # and visibly pending, which is the honest failure. Pass
        # "ubuntu-latest" explicitly for the small CPU-sized jobs.
        description: "gpu (the Vast boxes) | ubuntu-latest (free 4-core CPU, small jobs only)"
        default: "gpu"
      job_timeout:
        description: "job timeout-minutes; hosted runners die at 360 regardless, self-hosted can run for days"
        default: "350"
      lr_floor:
        description: "decay-then-constant LR: hold at floor*peak after lr_decay_steps (0 = plain cosine). On a joint: run this is instead the CODEC learning rate — set 1e-12 for the frozen-codec control that isolates how much of the forecast gain is just the fresh temporal head learning"
        default: "0"
      lr_decay_steps:
        description: "initial decay length when lr_floor > 0"
        default: "0"
      codec_d_model:
        description: "encoder width (128 = 0.92M pilot; 320 with 8 layers = 10.3M Chinchilla anchor)"
        default: "128"
      codec_layers:
        description: "encoder depth (4 pilot; 8 at the 10M size)"
        default: "4"
      codec_heads:
        description: "attention heads (4 pilot; 8 at the 10M size)"
        default: "4"
      codec_d_dec:
        description: "decoder width (256 pilot; 512 at the 10M size)"
        default: "256"

# contents: write ONLY for the live-metrics side channel — the training
# step pushes metrics.jsonl to an orphan ml-live-<run_number> branch every
# 5 minutes so curves are plottable mid-run (ml/live_curve.py). The branch
# is deleted in the cleanup step; nothing ever touches main.
permissions:
  contents: write

jobs:
  train:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(inputs.job_timeout || '350') }}
    steps:
      # BEFORE checkout, because actions/checkout cleans the workspace and
      # would delete the very thing we are rescuing. A cancelled or crashed
      # job leaves its last checkpoint in ml/runs/actions/pixelmae.pt; that
      # file is an hour of GPU time, and until now the next job silently
      # erased it. Moving it into the box-persistent cache makes a cancel
      # survivable and is what `--resume` reads.
      - name: Rescue an orphaned checkpoint from the previous job
        if: inputs.runner != 'ubuntu-latest'
        run: |
          # BEFORE checkout, because actions/checkout cleans the workspace and
          # would delete the very thing being rescued. A cancelled or crashed
          # job leaves its last checkpoint in ml/runs/actions/pixelmae.pt —
          # an hour of GPU time that the next job used to erase silently.
          # Moving it into the box-persistent cache is what makes a cancel
          # survivable, and it is what `--resume orphan-latest` reads.
          # No introspection here on purpose: this step runs before the repo
          # exists and torch may not be installed yet. --resume prints the
          # checkpoint's step and architecture when it loads it, which is the
          # place that decision is actually made.
          orphan=ml/runs/actions/pixelmae.pt
          if [ -f "$orphan" ]; then
            mkdir -p /opt/earth-cache/ckpt
            stamp=$(date -u +%Y%m%dT%H%M%SZ)
            cp "$orphan" "/opt/earth-cache/ckpt/orphan-$stamp.pt" || true
            cp "$orphan" /opt/earth-cache/ckpt/orphan-latest.pt || true
            echo "rescued $(du -h "$orphan" | cut -f1) -> orphan-$stamp.pt (also orphan-latest.pt)"
          else
            echo "no orphaned checkpoint on this box"
          fi
          ls -la /opt/earth-cache/ckpt 2>/dev/null || true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (torch matches the hardware)
        run: |
          pip install --quiet numpy netCDF4 matplotlib
          # CUDA wheel when the runner has a GPU, CPU wheel otherwise —
          # train.py auto-selects the device, so the same dispatch works on both.
          #
          # The wheel must MATCH THE HOST DRIVER, and a mismatch is silent:
          # default torch (cu130) on gpu-box-45318655's 12.6 driver printed a
          # UserWarning, reported cuda:False, and run #36 trained a 10M codec
          # on CPU at 0.5 steps/s — a 17-minute GPU job restated as 17 hours,
          # discovered only because the live loss curve crawled. So: try the
          # default wheel, fall back to cu126 for older drivers, and REFUSE
          # to proceed if a GPU is present that torch cannot reach — failing
          # in 3 minutes beats silently burning a box for a day.
          if command -v nvidia-smi >/dev/null 2>&1; then
            pip install --quiet torch
            ok=$(python -c "import torch; print(int(torch.cuda.is_available()))" 2>/dev/null || echo 0)
            if [ "$ok" != "1" ]; then
              echo "default torch wheel cannot use this driver — falling back to cu126"
              pip install --quiet --force-reinstall torch --index-url https://download.pytorch.org/whl/cu126
              ok=$(python -c "import torch; print(int(torch.cuda.is_available()))" 2>/dev/null || echo 0)
            fi
            if [ "$ok" != "1" ]; then
              echo "::error::GPU present but no torch wheel can reach it — refusing to train on CPU"
              nvidia-smi | head -4
              exit 1
            fi
            python -c "import torch; print('torch', torch.__version__, 'cuda: True', torch.cuda.get_device_name(0))"
          else
            pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          fi

      # On OUR box the data cache is a directory on the box, not a GitHub
      # cache. The sources total ~13 GB (8.9 GB Argo RG + 4.1 GB NCEP daily
      # wind), GitHub evicts caches once a repo passes 10 GB, and the eviction
      # is silent: the restore "succeeds" from a restore-key that predates the
      # wind files and the build then re-downloads all 13 GB. That is what
      # stalled runs #19 and #20 for 80 and 92 minutes — the log at cancel
      # showed uflx/vflx.sfc.gauss.YYYY.nc being fetched one year at a time.
      # A directory outside the workspace survives actions/checkout's clean,
      # so the box pays the download once, ever.
      - name: Phase · seeding
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish_phase.sh "ml-live-${{ github.run_number }}" "seeding the data cache" "downloading RG-Argo + wind from the data-cache release (first run on a box only)"

      - name: Persistent data cache (self-hosted box)
        if: inputs.runner != 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # DISK HYGIENE FIRST. gpu-box-46045353 hit 50/50 GB on 2026-08-08:
          # the runner worker could not write its own _diag log, run #39 died
          # AFTER a successful train+upload, and the runner process went
          # offline — a full disk turns a healthy box into a poison pill that
          # eats jobs. Below 8 GB free, drop the reclaimable tiers: runner
          # diagnostic logs, pip's wheel cache (~3 GB of torch), actions'
          # _temp staging, and stage-2 embedding caches in the persistent
          # cache (Z_*.npy are ~4 GB each and re-derive from checkpoints).
          free_gb() { df -BG --output=avail / | tail -1 | tr -dc 0-9; }
          echo "disk free: $(free_gb) GB"
          if [ "$(free_gb)" -lt 8 ]; then
            echo "low disk — pruning …"
            rm -rf /opt/runner/_diag/*.log /opt/runner/_work/_temp/* || true
            pip cache purge || true
            find /opt/earth-cache -maxdepth 1 -name 'Z_*.npy*' -delete || true
            # a crashed family-3 build leaves its 11 GB memmap behind
            rm -f /opt/earth-cache/family3_na025_build.npy || true
            echo "after prune: $(free_gb) GB"
          fi
          mkdir -p /opt/earth-cache
          rm -rf ml/cache
          ln -s /opt/earth-cache ml/cache
          # COLD-START SEED from the data-cache release instead of the origin
          # archives (SIO 504s/timeouts killed five runs on 2026-08-08). The
          # check is COMPLETENESS, not existence: failed origin fetches leave
          # partial directories that must not suppress seeding — that exact
          # bug sent runs #36/#37 back to the dead origin while the release
          # sat unused at zero downloads.
          # Every curl carries a hard --max-time. The first version streamed
          # `curl -sL | tar x` with no time limit — one stalled connection
          # hangs the pipe FOREVER, which is what parked run #42 in this step
          # for 90+ minutes on the Brazil box (release download counts showed
          # chunks ac/ad/ae were never even requested). Still streamed (a
          # chunks-to-disk variant would double peak disk on 50 GB boxes),
          # and deliberately NO --retry inside the stream: a mid-body retry
          # restarts the chunk from byte 0 and corrupts the tar. A stall now
          # kills the seed loudly; the completeness check re-seeds next run.
          seed() {
            d="$1"
            echo "seeding $d from release data-cache-v1 …"
            rm -rf "/opt/earth-cache/$d"
            assets=$(curl -s --max-time 120 -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/data-cache-v1" \
              | python3 -c "import json,sys;[print(a['browser_download_url']) for a in json.load(sys.stdin).get('assets',[]) if a['name'].startswith('$d.tar.')]")
            if [ -n "$assets" ]; then
              if echo "$assets" | sort | while read u; do
                   echo "  chunk $(basename "$u") …" >&2
                   curl -sL --max-time 1800 "$u" || exit 1
                 done | tar x -C /opt/earth-cache; then
                echo "  seeded: $(du -sh /opt/earth-cache/$d | cut -f1)"
              else
                echo "::warning::seed $d failed (stall/timeout) — partial dir stays, completeness check re-seeds next run"
              fi
            else
              echo "  (no release assets — fetchers will hit the origin)"
            fi
          }
          { [ -f /opt/earth-cache/rg/RG_S.nc.gz ] && \
            [ -f /opt/earth-cache/rg/RG_T.nc.gz ]; } || seed rg
          [ "$(ls /opt/earth-cache/wind_daily/*.nc 2>/dev/null | wc -l)" -ge 60 ] \
            || seed wind_daily
          # Family-3 needs the 1982-92 NCEP dailies too. They are NOT in the
          # wind_daily tar (1993+ only): build_family3.py used to fetch them
          # from downloads.psl.noaa.gov on first build, and that host 504'd
          # run #47 to death on 2026-08-08. They live in their own asset
          # (wind_daily_8292.tar.aa, one chunk) that extracts ADDITIVELY into
          # wind_daily/ — so no rm -rf and no seed(): the shared dir must
          # survive a failed extension seed.
          if [ "${{ inputs.tensor }}" = "family3_na025" ]; then
            n8292=$(ls /opt/earth-cache/wind_daily/*.sfc.gauss.198[2-9].nc \
                       /opt/earth-cache/wind_daily/*.sfc.gauss.199[0-2].nc \
                       2>/dev/null | wc -l)
            if [ "$n8292" -lt 22 ]; then
              echo "seeding wind_daily 1982-92 extension ($n8292/22 present) …"
              if curl -sL --max-time 1800 \
                   "https://github.com/${GITHUB_REPOSITORY}/releases/download/data-cache-v1/wind_daily_8292.tar.aa" \
                   | tar x -C /opt/earth-cache; then
                echo "  seeded: $(ls /opt/earth-cache/wind_daily/*.nc | wc -l) files total"
              else
                echo "::warning::8292 seed failed — build_family3.py will try the PSL origin + thredds mirror"
              fi
            fi
          fi
          # Truth series (1.2 MB): OSNAP's repository server timed out from
          # two boxes on 2026-08-08 and killed the whole build step. With the
          # files present, fetch_truth.py never opens a connection.
          { [ -f /opt/earth-cache/truth/osnap_moc.nc ] && \
            [ -f /opt/earth-cache/truth/move.nc ] && \
            [ -f /opt/earth-cache/truth/samba.asc ] && \
            [ "$(ls /opt/earth-cache/truth/fc_* 2>/dev/null | wc -l)" -ge 40 ]; } \
            || seed truth
          # The family-3 base tensor is a single (non-tar) release asset;
          # build_family3.py can fetch it itself, but seeding it here keeps
          # the build step offline like everything else.
          if [ "${{ inputs.tensor }}" = "family3_na025" ]; then
            [ -f /opt/earth-cache/base025_na.npz ] || curl -sL \
              --max-time 900 --retry 3 --retry-delay 10 \
              -o /opt/earth-cache/base025_na.npz \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/data-cache-v1/base025_na.npz" \
              || rm -f /opt/earth-cache/base025_na.npz
          fi
          echo "persistent cache: $(du -sh /opt/earth-cache | cut -f1)"

      - name: Restore data cache (GitHub-hosted only)
        if: inputs.runner == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: ml/cache
          key: ml-cache-v2-${{ inputs.window }}-${{ inputs.sst_channel }}-${{ hashFiles('ml/build_dataset.py', 'ml/fetch_rg_channels.py', 'ml/fetch_wind_channels.py', 'ml/fetch_sst_channel.py', 'ml/fetch_truth.py', 'ml/fetch_wind_stats.py', 'ml/build_family3.py') }}
          # Fall back across generations and windows: the expensive part of
          # the cache is the raw RG/NCEP downloads, which are window- and
          # version-independent (the tensor itself is rebuilt every run).
          restore-keys: |
            ml-cache-v2-${{ inputs.window }}-
            ml-cache-v2-
            ml-cache-v1-

      - name: Phase · building
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish_phase.sh "ml-live-${{ github.run_number }}" "building the tensor" "assembling channels into the pixel tensor"

      - name: Build dataset (repo channels + RG-Argo depth + NCEP wind stress)
        run: |
          if [ "${{ inputs.tensor || 'family2' }}" = "family3_na025" ]; then
            python -u ml/build_family3.py
          else
            python ml/build_dataset.py --window "${{ inputs.window }}"
            python ml/fetch_rg_channels.py
            python ml/fetch_wind_channels.py
            if [ "${{ inputs.sst_channel }}" = "true" ]; then python ml/fetch_sst_channel.py; fi
            python ml/fetch_wind_stats.py
            python ml/fetch_truth.py
          fi

      # PROVENANCE MANIFEST — the answer to "we thought this run tested X
      # but a bug made the param something else". Three claims, three
      # independent recorders, written AFTER the build so they describe what
      # the training loop will actually see, not what the dispatch intended:
      #   code    -> the exact commit SHA (immutable; tree browsable at
      #              github.com/<repo>/tree/<sha> — better than a branch,
      #              which is a mutable pointer someone can push to)
      #   intent  -> the verbatim dispatch inputs
      #   reality -> the BUILT tensor's own shape, channel list, and axis,
      #              read back from the npz. The C=24 mislabelling incident
      #              (a run named patch14 that silently carried 24 channels
      #              because a fetcher default had moved) is exactly the gap
      #              between intent and reality this file closes.
      # It ships inside the checkpoint artifact, so harvest_run.mjs lands it
      # in ml/runs/<name>/provenance.json next to the numbers it certifies.
      - name: Record provenance
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
          TENSOR: ml/cache/${{ inputs.tensor == 'family3_na025' && 'family3_na025' || 'na_pixels' }}.npz
        run: |
          mkdir -p ml/runs/actions
          python - <<'EOF'
          import json, os, subprocess
          import numpy as np
          d = np.load(os.environ["TENSOR"], allow_pickle=False)
          months = [str(m) for m in d["months"]]
          try:
              import torch
              tv, cuda = torch.__version__, (torch.cuda.get_device_name(0)
                  if torch.cuda.is_available() else "cpu")
          except Exception:
              tv, cuda = "?", "?"
          json.dump({
              "run_number": int(os.environ.get("GITHUB_RUN_NUMBER", 0)),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "code": "https://github.com/%s/tree/%s" % (
                  os.environ.get("GITHUB_REPOSITORY", ""),
                  os.environ.get("GITHUB_SHA", "")),
              "inputs": json.loads(os.environ["INPUTS_JSON"]),
              "tensor": {
                  "file": os.environ["TENSOR"],
                  "X_shape": list(d["X"].shape),
                  "C": int(d["X"].shape[-1]),
                  "chan": [str(c) for c in d["chan"]],
                  "months": [months[0], months[-1]],
                  "T": len(months),
              },
              "torch": tv, "device": cuda,
              "runner": os.environ.get("RUNNER_NAME", ""),
          }, open("ml/runs/actions/provenance.json", "w"), indent=1)
          print(open("ml/runs/actions/provenance.json").read())
          EOF

      # SEED A MISSING CHECKPOINT FROM THE RELEASE. Checkpoint mirrors are
      # box-local, and with three boxes a resume job lands on the right one by
      # luck. Worse, the box that CANNOT serve the job fails fast and is
      # therefore first back in the queue to grab the next attempt — a
      # livelock that ate runs #87, #89 and #90, all on gpu-box-35586926.
      # Publishing the codec as a release asset makes it fetchable anywhere;
      # the box-local mirror stays as the fast path.
      - name: Seed resume checkpoint from the release
        if: always() && inputs.resume != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAGS="${{ inputs.resume }}"; TAGS="${TAGS#!}"
          mkdir -p /opt/earth-cache/ckpt
          for TAG in ${TAGS//,/ }; do
            case "$TAG" in */*) continue;; esac        # a path, not a tag
            [ -f "/opt/earth-cache/ckpt/$TAG.pt" ] && { echo "$TAG already on this box"; continue; }
            # ${TAG}__… with BRACES. Underscores are legal in a bash
            # identifier, so "$TAG__pixelmae.pt" expands the variable
            # $TAG__pixelmae — unset, therefore empty — and the pattern
            # became a bare ".pt". Run #98's log says it plainly:
            # "trying release asset .pt for run-62". Second occurrence of
            # this family of quoting bug in two days.
            for ASSET in "${TAG}__pixelmae.pt" "f3_anchor41M__pixelmae.pt"; do
              echo "trying release asset $ASSET for $TAG …"
              # curl, not `gh`: the Vast boxes have no gh CLI, so every
              # `gh release download` returned 127 in under a millisecond
              # with its stderr swallowed by 2>/dev/null, and the step
              # reported success having downloaded nothing. The data-cache
              # seed above already fetches release assets this way and has
              # worked on these boxes since #47.
              if curl -fsSL --max-time 1800 --retry 3 --retry-delay 10 \
                   -o "/opt/earth-cache/ckpt/$TAG.pt.part" \
                   "https://github.com/${GITHUB_REPOSITORY}/releases/download/model-checkpoints-v1/${ASSET}"; then
                mv "/opt/earth-cache/ckpt/$TAG.pt.part" "/opt/earth-cache/ckpt/$TAG.pt"
                echo "  seeded /opt/earth-cache/ckpt/$TAG.pt from $ASSET ($(du -h /opt/earth-cache/ckpt/$TAG.pt | cut -f1))"
                break
              fi
              rm -f "/opt/earth-cache/ckpt/$TAG.pt.part"
            done
          done
          ls -la /opt/earth-cache/ckpt/ 2>/dev/null || true

      - name: Phase · training
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # A joint: run passes through Train only to reload the parent codec
        # and write it out — the real work is the fine-tune step below. Saying
        # "stage-1 codec; curves appear within a few minutes" there was simply
        # false, and it is what made #97 look stuck for 45 minutes when it was
        # doing exactly what it was told.
        run: |
          case "${{ inputs.temporal_steps }}" in
            joint:*) bash scripts/publish_phase.sh "ml-live-${{ github.run_number }}" \
                       "reloading the parent codec" \
                       "a joint run trains in the fine-tune step; no stage-1 curve for this one" ;;
            *)       bash scripts/publish_phase.sh "ml-live-${{ github.run_number }}" \
                       "training" "stage-1 codec; curves appear within a few minutes" ;;
          esac

      - name: Train
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Every N-step checkpoint is mirrored to /opt/earth-cache/ckpt
          # under this tag, so a cancel leaves something to resume FROM.
          CKPT_TAG: run-${{ github.run_number }}
          TENSOR: ml/cache/${{ inputs.tensor == 'family3_na025' && 'family3_na025' || 'na_pixels' }}.npz
        run: |
          python -u ml/train.py \
            --data "$TENSOR" \
            --steps "${{ inputs.steps }}" \
            --batch "${{ inputs.batch }}" \
            --d-z "${{ inputs.d_z }}" \
            --patch "${{ inputs.patch || '1' }}" \
            --max-minutes "${{ inputs.max_minutes || '0' }}" \
            --lr-floor "${{ inputs.lr_floor || '0' }}" \
            --lr-decay-steps "${{ inputs.lr_decay_steps || '0' }}" \
            --light-probe-every "${{ inputs.light_probe_every || '2000' }}" \
            --resume "${{ inputs.resume }}" \
            --d-model "${{ inputs.codec_d_model || '128' }}" \
            --n-layers "${{ inputs.codec_layers || '4' }}" \
            --n-heads "${{ inputs.codec_heads || '4' }}" \
            --d-dec "${{ inputs.codec_d_dec || '256' }}" \
            $([ "${{ inputs.anomaly }}" = "true" ] && echo --anomaly) \
            $([ "${{ inputs.anomaly }}" = "true" ] && [ "${{ inputs.eval_every }}" != "0" ] \
              && echo --eval-every "${{ inputs.eval_every }}") \
            --out ml/runs/actions &
          TRAIN_PID=$!
          # Live-metrics side channel: publish curves every ~5 min while
          # training. Poll at 30s and publish every 10th tick rather than
          # sleeping 300s outright — a bare `sleep 300` also delays NOTICING
          # that training finished, which added a five-minute tail to every
          # job. That was invisible against a 6-hour CPU run and is 25% of a
          # 20-minute GPU one.
          TICK=0
          while kill -0 $TRAIN_PID 2>/dev/null; do
            sleep 30
            TICK=$((TICK + 1))
            if [ $((TICK % 10)) -eq 0 ]; then
              bash scripts/publish_live_metrics.sh "ml-live-${{ github.run_number }}" || true
            fi
          done
          wait $TRAIN_PID

      # ALWAYS upload. #62/#63 trained all 60,000 steps, passed every
      # probe, and then died in the final evaluation — and because this step
      # was conditional on the Train step succeeding, six hours of GPU and a
      # finished 40M codec were thrown away with it. The checkpoint on disk is
      # real whether or not the last line of the job raised.
      - name: Upload checkpoint + eval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelmae-${{ github.run_number }}
          path: |
            ml/runs/actions/pixelmae.pt
            ml/runs/actions/eval.json
            ml/runs/actions/metrics.jsonl
            ml/runs/actions/curve.png
            ml/runs/actions/provenance.json
          retention-days: 30
          if-no-files-found: warn

      # Protocol v2 verdicts ride along: the seasonality-proof K-sweep and the
      # stage-2 temporal transformer over the frozen codec. Both only make
      # sense on an anomaly-space codec (temporal.py refuses otherwise).
      # Same reasoning: the probes read the checkpoint, so a late Train
      # failure must not skip them.
      # JOINT stage-1+2 fine-tune. Writes to ml/runs/actions/pixelmae.pt on
      # purpose: the probe ladder below then scores the JOINT codec with no
      # extra wiring, and the pre-joint weights stay safe in /opt/earth-cache.
      # The joint step is the longest thing a joint run does and it published
      # NOTHING until it finished, so the status page kept showing whatever
      # phase the Train step had left behind. Announce it up front, and let
      # train_joint.py push its own curves as it goes (--publish-branch).
      - name: Phase · joint fine-tune
        if: always() && startsWith(inputs.temporal_steps, 'joint:')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish_phase.sh "ml-live-${{ github.run_number }}" "joint stage-1+2 fine-tune" "codec and forecaster trained together; both curves appear within a few minutes"

      - name: Joint stage-1+2 fine-tune
        if: always() && startsWith(inputs.temporal_steps, 'joint:')
        env:
          CKPT_TAG: run-${{ github.run_number }}
          TENSOR: ml/cache/${{ inputs.tensor == 'family3_na025' && 'family3_na025' || 'na_pixels' }}.npz
        run: |
          JS="${{ inputs.temporal_steps }}"; JS="${JS#joint:}"
          # window carries "mode" or "mode@ref_fore" — e.g. lse@0.29. The
          # second field is the FROZEN-CODEC control's forecast loss in
          # persistence units, and it is what puts both terms of the loss on
          # the same footing. Without it reconstruction sits at ~1.0 and
          # forecast at ~0.3, the smooth max is always reconstruction, and 95%
          # of every gradient step goes to the wrong objective (measured on
          # #94). Packed into an existing input because workflow_dispatch caps
          # at 25 and this file is at the ceiling.
          W="${{ inputs.window }}"
          MODE="${W%%@*}"
          case "$W" in *@*) REF="${W#*@}";; *) REF=0;; esac
          python -u ml/train_joint.py \
            --data "$TENSOR" \
            --resume "${{ inputs.resume }}" \
            --steps "$JS" \
            --loss-mode "$MODE" \
            --ref-fore "$REF" \
            --lr "${{ inputs.lr_floor != '0' && inputs.lr_floor || '3e-5' }}" \
            --temporal-d-model "${{ inputs.temporal_d_model }}" \
            --temporal-layers "${{ inputs.temporal_layers }}" \
            --out ml/runs/actions &
          JOINT_PID=$!
          # Same side channel as the Train step. Without it a 12,000-step
          # joint run published exactly once — at the end — so the status
          # page showed an empty chart under a stale phase for its whole
          # life, which is indistinguishable from a hung job.
          TICK=0
          while kill -0 $JOINT_PID 2>/dev/null; do
            sleep 30
            TICK=$((TICK + 1))
            if [ $((TICK % 10)) -eq 0 ]; then
              bash scripts/publish_live_metrics.sh "ml-live-${{ github.run_number }}" || true
            fi
          done
          wait $JOINT_PID
          bash scripts/publish_live_metrics.sh "ml-live-${{ github.run_number }}" || true

      - name: Phase · probes
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish_phase.sh "ml-live-${{ github.run_number }}" "probes and stage 2" "k-fold ladder, stage-2 temporal transformer, head probe"

      - name: Probes (K-sweep + stage 2)
        if: always() && inputs.anomaly == 'true'
        continue-on-error: true
        env:
          TENSOR: ml/cache/${{ inputs.tensor == 'family3_na025' && 'family3_na025' || 'na_pixels' }}.npz
        run: |
          python -u ml/probe_sequence.py --run actions --anomaly --data "$TENSOR"
          # A joint: run has ALREADY trained a temporal model inside
          # train_joint.py, and "joint:4000" is not an integer — passing it to
          # temporal.py --steps aborts the step, and with it every probe after
          # it. That is why #94 finished a clean joint run and produced no
          # k-fold number at all. Skip stage 2 here on joint runs; the ladder
          # below still scores the resulting codec, which is the whole point.
          case "${{ inputs.temporal_steps }}" in joint:*) SKIP_S2=1;; *) SKIP_S2=0;; esac
          if [ "${{ inputs.temporal_steps }}" != "0" ] && [ "$SKIP_S2" = "0" ]; then
            # `window` doubles as a stage-2 modifier here, same reuse as on a
            # joint: run — "unroll:4" turns on the autoregressive unroll that
            # matches training to how rollout.py actually scores the model.
            # Another input is not available: workflow_dispatch caps at 25 and
            # this file is exactly at the ceiling.
            UNROLL=1
            case "${{ inputs.window }}" in unroll:*) UNROLL="${{ inputs.window }}"; UNROLL="${UNROLL#unroll:}";; esac
            python -u ml/temporal.py --run actions --K 24 \
              --data "$TENSOR" \
              --steps "${{ inputs.temporal_steps }}" \
              --unroll "$UNROLL" \
              --d-model "${{ inputs.temporal_d_model }}" \
              --layers "${{ inputs.temporal_layers }}"
            # Publish so the stage-2 curve appears on the status page WHILE
            # the ladder finishes, not only after the archive step at the very
            # end. temporal.py writes into the same metrics.jsonl, but nothing
            # in this step pushed it — so the panel existed and stayed empty
            # for the whole probe stage.
            bash scripts/publish_live_metrics.sh "ml-live-${{ github.run_number }}" || true
          fi
          # The decisive numbers, computed HERE rather than locally. The
          # k-fold is the only probe figure we argue from, and running it
          # afterwards on a laptop-sized box means holding a second global
          # tensor next to whatever else is running — which OOM-killed it
          # on 2026-08-07. The runner already has the matching tensor built
          # and the memory to probe it, so the run ships its own verdict.
          # Section-only embeddings, so this is minutes, not hours.
          python -u ml/probe_kfold.py --runs actions --data "$TENSOR"
          python -u ml/dip_check.py --run actions --data "$TENSOR"
          # The TOP RUNG. Every other probe mean-pools the section before
          # reading it, and geostrophic transport is the east-minus-west
          # density difference ACROSS the section — the one statistic a mean
          # destroys. Runs the head on the embeddings and, immediately after,
          # the SAME head on raw 3x3 tokens: the pair is what separates "the
          # codec knows this" from "any read-out with spatial structure knows
          # this". Matched to a patch codec via --raw-patch.
          if [ "${{ inputs.head_probe }}" = "true" ]; then
            python -u ml/probe_head.py --run actions --data "$TENSOR" --K 1
            python -u ml/probe_head.py --run actions --data "$TENSOR" --K 1 \
              --raw --raw-patch
          fi

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probes-${{ github.run_number }}
          path: |
            ml/runs/actions/probe_sequence.json
            ml/runs/actions/temporal.json
            ml/runs/probe_kfold.json
            ml/runs/actions/dip_check.json
            ml/runs/actions/probe_head.json
            ml/runs/actions/probe_head_raw3x3.json
            ml/runs/actions/temporal.pt
          retention-days: 30
          if-no-files-found: ignore

      # Archive BEFORE deleting: the per-run ml-live branch is scratch, but
      # the curves it carried are the record of the experiment. They move to
      # the long-lived ml-metrics branch as run-<n>.jsonl so a finished run
      # keeps its charts on status.html.
      - name: Archive metrics, then clean up the live branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/archive_run_metrics.sh "${{ github.run_number }}" || \
            echo "::warning::metrics archive failed — live branch kept for recovery"
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            ":refs/heads/ml-live-${{ github.run_number }}" 2>/dev/null || true
