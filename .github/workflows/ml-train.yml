# Credential-free training: runs PixelMAE on GitHub's own runners, using only
# the workflow's automatic GITHUB_TOKEN — no user credentials anywhere.
#
# Public-repo Actions minutes are free; one job may run up to 6 hours, and a
# 4-core runner does ~45-55k training steps in that window (the in-sandbox
# pilot did 1.8k). GPU larger runners exist but are a paid team/enterprise
# feature, and TPUs aren't offered at all — for those, the Colab CLI path in
# ml/README.md remains the route (it needs a one-time browser auth).
#
# The RG-Argo download (~2 GB) and the built tensor are cached between runs,
# so only the first run pays the fetch.
name: ml-train
on:
  workflow_dispatch:
    inputs:
      steps:
        description: "training steps"
        default: "40000"
      batch:
        description: "batch size"
        default: "512"
      d_z:
        description: "bottleneck dimensions"
        default: "32"
      anomaly:
        description: "train in anomaly space (protocol v2; state space is disqualified from ranking)"
        default: "true"
      temporal_steps:
        description: "stage-2 temporal transformer steps (0 = skip)"
        default: "6000"
      temporal_d_model:
        description: "stage-2 width (96=mid, 192=large, 256=xlarge, 320=xxlarge)"
        default: "96"
      temporal_layers:
        description: "stage-2 depth (3=mid, 4=large, 5=xlarge, 6=xxlarge)"
        default: "3"
      eval_every:
        description: "trainprobe cadence in steps (0 = off; requires anomaly)"
        default: "7500"
      window:
        description: "spatial window (global | na)"
        default: "global"
      sst_channel:
        description: "append monthly OISST as channel 15 (true | false)"
        default: "false"
      patch:
        description: "codec receptive field per channel token (1 | 3); 3 = 3x3 neighbourhood, true compression"
        default: "1"
      max_minutes:
        description: "wall-clock budget for the training loop (0 = off); the cosine schedule re-fits to the steps that fit. The job dies at 350 min with NO checkpoint otherwise."
        default: "0"
      runner:
        description: "ubuntu-latest (free 4-core CPU) | self-hosted (the GPU box, when registered)"
        default: "ubuntu-latest"
      job_timeout:
        description: "job timeout-minutes; hosted runners die at 360 regardless, self-hosted can run for days"
        default: "350"

# contents: write ONLY for the live-metrics side channel — the training
# step pushes metrics.jsonl to an orphan ml-live-<run_number> branch every
# 5 minutes so curves are plottable mid-run (ml/live_curve.py). The branch
# is deleted in the cleanup step; nothing ever touches main.
permissions:
  contents: write

jobs:
  train:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(inputs.job_timeout || '350') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (torch matches the hardware)
        run: |
          pip install --quiet numpy netCDF4 matplotlib
          # CUDA wheel when the runner has a GPU, CPU wheel otherwise —
          # train.py auto-selects the device, so the same dispatch works on both.
          if command -v nvidia-smi >/dev/null 2>&1; then
            pip install --quiet torch
            python -c "import torch; print('torch', torch.__version__, 'cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else '')"
          else
            pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          fi

      # On OUR box the data cache is a directory on the box, not a GitHub
      # cache. The sources total ~13 GB (8.9 GB Argo RG + 4.1 GB NCEP daily
      # wind), GitHub evicts caches once a repo passes 10 GB, and the eviction
      # is silent: the restore "succeeds" from a restore-key that predates the
      # wind files and the build then re-downloads all 13 GB. That is what
      # stalled runs #19 and #20 for 80 and 92 minutes — the log at cancel
      # showed uflx/vflx.sfc.gauss.YYYY.nc being fetched one year at a time.
      # A directory outside the workspace survives actions/checkout's clean,
      # so the box pays the download once, ever.
      - name: Persistent data cache (self-hosted box)
        if: inputs.runner != 'ubuntu-latest'
        run: |
          mkdir -p /opt/earth-cache
          rm -rf ml/cache
          ln -s /opt/earth-cache ml/cache
          echo "persistent cache: $(du -sh /opt/earth-cache | cut -f1)"

      - name: Restore data cache (GitHub-hosted only)
        if: inputs.runner == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: ml/cache
          key: ml-cache-v2-${{ inputs.window }}-${{ inputs.sst_channel }}-${{ hashFiles('ml/build_dataset.py', 'ml/fetch_rg_channels.py', 'ml/fetch_wind_channels.py', 'ml/fetch_sst_channel.py', 'ml/fetch_truth.py', 'ml/fetch_wind_stats.py') }}
          # Fall back across generations and windows: the expensive part of
          # the cache is the raw RG/NCEP downloads, which are window- and
          # version-independent (the tensor itself is rebuilt every run).
          restore-keys: |
            ml-cache-v2-${{ inputs.window }}-
            ml-cache-v2-
            ml-cache-v1-

      - name: Build dataset (repo channels + RG-Argo depth + NCEP wind stress)
        run: |
          python ml/build_dataset.py --window "${{ inputs.window }}"
          python ml/fetch_rg_channels.py
          python ml/fetch_wind_channels.py
          if [ "${{ inputs.sst_channel }}" = "true" ]; then python ml/fetch_sst_channel.py; fi
          python ml/fetch_wind_stats.py
          python ml/fetch_truth.py

      - name: Train
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -u ml/train.py \
            --steps "${{ inputs.steps }}" \
            --batch "${{ inputs.batch }}" \
            --d-z "${{ inputs.d_z }}" \
            --patch "${{ inputs.patch || '1' }}" \
            --max-minutes "${{ inputs.max_minutes || '0' }}" \
            $([ "${{ inputs.anomaly }}" = "true" ] && echo --anomaly) \
            $([ "${{ inputs.anomaly }}" = "true" ] && [ "${{ inputs.eval_every }}" != "0" ] \
              && echo --eval-every "${{ inputs.eval_every }}") \
            --out ml/runs/actions &
          TRAIN_PID=$!
          # Live-metrics side channel: publish curves every ~5 min while
          # training. Poll at 30s and publish every 10th tick rather than
          # sleeping 300s outright — a bare `sleep 300` also delays NOTICING
          # that training finished, which added a five-minute tail to every
          # job. That was invisible against a 6-hour CPU run and is 25% of a
          # 20-minute GPU one.
          TICK=0
          while kill -0 $TRAIN_PID 2>/dev/null; do
            sleep 30
            TICK=$((TICK + 1))
            if [ $((TICK % 10)) -eq 0 ]; then
              bash scripts/publish_live_metrics.sh "ml-live-${{ github.run_number }}" || true
            fi
          done
          wait $TRAIN_PID

      - name: Upload checkpoint + eval
        uses: actions/upload-artifact@v4
        with:
          name: pixelmae-${{ github.run_number }}
          path: |
            ml/runs/actions/pixelmae.pt
            ml/runs/actions/eval.json
            ml/runs/actions/metrics.jsonl
            ml/runs/actions/curve.png
          retention-days: 30
          if-no-files-found: warn

      # Protocol v2 verdicts ride along: the seasonality-proof K-sweep and the
      # stage-2 temporal transformer over the frozen codec. Both only make
      # sense on an anomaly-space codec (temporal.py refuses otherwise).
      - name: Probes (K-sweep + stage 2)
        if: inputs.anomaly == 'true'
        continue-on-error: true
        run: |
          python -u ml/probe_sequence.py --run actions --anomaly
          if [ "${{ inputs.temporal_steps }}" != "0" ]; then
            python -u ml/temporal.py --run actions --K 24 \
              --steps "${{ inputs.temporal_steps }}" \
              --d-model "${{ inputs.temporal_d_model }}" \
              --layers "${{ inputs.temporal_layers }}"
          fi
          # The decisive numbers, computed HERE rather than locally. The
          # k-fold is the only probe figure we argue from, and running it
          # afterwards on a laptop-sized box means holding a second global
          # tensor next to whatever else is running — which OOM-killed it
          # on 2026-08-07. The runner already has the matching tensor built
          # and the memory to probe it, so the run ships its own verdict.
          # Section-only embeddings, so this is minutes, not hours.
          python -u ml/probe_kfold.py --runs actions
          python -u ml/dip_check.py --run actions

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probes-${{ github.run_number }}
          path: |
            ml/runs/actions/probe_sequence.json
            ml/runs/actions/temporal.json
            ml/runs/probe_kfold.json
            ml/runs/actions/dip_check.json
            ml/runs/actions/temporal.pt
          retention-days: 30
          if-no-files-found: ignore

      - name: Clean up live-metrics branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            ":refs/heads/ml-live-${{ github.run_number }}" 2>/dev/null || true
